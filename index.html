tt": "Ja, f.eks. løse biter over en gangvei", "feil": ["Nei, konsekvensgraden følger skadegraden", "Bare hvis skaden er på en offshoreplattform", "Bare hvis skaden er kodet som 36 korrosjon"], "forkl": "Skadegrad og konsekvensgrad vurderes alltid hver for seg."}]}, {"nr": "G6", "tittel": "Å velge riktig løsning", "mal": ["Forklare forskjellen på forenklet og fullstendig reparasjon", "Vite hvorfor man må stoppe ny inntrengning etter reparasjonen", "Vite at katodisk beskyttelse finnes, og hva det betyr for valg av produkter"], "punkter": ["Start med årsaken. Den bestemmer løsningen.", "Forenklet: bare løs betong fjernes. Fullstendig: all karbonatisert eller saltholdig betong rundt stålet fjernes.", "Hydrofobering stopper vann og salt, men ikke CO₂.", "Ved KB eller offeranoder: ingen Mapefer eller epoksy på stålet. Bruk sementbasert mørtel med resistivitet som den gamle betongen.", "Prinsipp 1–6 gjelder betongen, og 7–11 gjelder armeringskorrosjon."], "kort": [{"id": "g6-1", "q": "Hva er forskjellen på forenklet og fullstendig reparasjon?", "a": "Forenklet reparasjon fjerner bare løs betong. Fullstendig reparasjon fjerner all karbonatisert eller saltholdig betong rundt armeringen."}, {"id": "g6-2", "q": "Stopper hydrofobering karbonatisering?", "a": "Nei. Den stopper vann og salt, men CO₂ kommer fortsatt inn."}, {"id": "g6-3", "q": "Hva gjør katodisk beskyttelse?", "a": "Den gjør hele armeringen til katode med en svak strøm. Da slutter stålet å ruste."}, {"id": "g6-4", "q": "Hvorfor skal armeringen ikke ha Mapefer når det skal brukes offeranoder?", "a": "Fordi strømmen må kunne gå fra mørtelen og inn i stålet. Mapefer hindrer den kontakten."}, {"id": "g6-5", "q": "Hvilke prinsipper i NS-EN 1504-9 handler om armeringskorrosjon?", "a": "Prinsipp 7–11. 1–6 gjelder betongen."}], "tall": [], "mcq": [{"id": "gm6-1", "q": "Hva er første spørsmål når man velger løsning?", "rett": "Hva er årsaken?", "feil": ["Hva er billigst?", "Hvilken farge?", "Hvor mange er på jobb?"], "forkl": "Det er årsaken som bestemmer løsningen."}, {"id": "gm6-2", "q": "Hva fjernes ved fullstendig reparasjon?", "rett": "All karbonatisert eller saltholdig betong rundt stålet", "feil": ["Bare løs og oppsprukket betong rundt selve skaden", "Betongen ned til 10 mm, uansett hva prøvene viser", "Bare betongen der armeringen allerede har synlig rust"], "forkl": "Målet er at stålet får frisk, basisk betong rundt seg."}, {"id": "gm6-3", "q": "Hva stopper IKKE hydrofobering?", "rett": "CO₂", "feil": ["Vann", "Salt fra sjøsprut", "Regn"], "forkl": "Porene er fortsatt åpne for gass, så CO₂ kommer inn."}, {"id": "gm6-4", "q": "Når er katodisk beskyttelse aktuelt?", "rett": "Når saltet har gått dypt over store flater", "feil": ["Når det bare er ett lite riss i overflaten", "Når betongen er karbonatisert 5 mm inn", "Når betongen har misfarging uten skader"], "forkl": "Da blir det svært dyrt å fjerne all saltholdig betong."}, {"id": "gm6-5", "q": "Hva er offeranoder?", "rett": "Sinkanoder som ruster i stedet for stålet", "feil": ["Stålplater som beskytter betongen mot slag", "Titannett som får strøm fra en likeretter", "Målere som viser om armeringen ruster"], "forkl": "Sink er mindre edelt enn stål, så sinken ruster først."}, {"id": "gm6-6", "q": "Hva skal IKKE på armeringen når det brukes offeranoder?", "rett": "Mapefer eller epoksy", "feil": ["Sementbasert mørtel", "Rent, blåst stål", "Sinkanodene selv"], "forkl": "Belegg på stålet stenger strømmen ute."}, {"id": "gm6-7", "q": "Hva handler prinsipp 7–11 om?", "rett": "Armeringskorrosjon", "feil": ["Frostskader", "Overflatebehandling", "Riss og injeksjon"], "forkl": "Prinsipp 1–6 gjelder betongen, 7–11 armeringen."}]}, {"nr": "G7", "tittel": "Reparasjonen steg for steg", "mal": ["Kjenne arbeidsgangen fra pigging til herding", "Kjenne kravene til et godt reparasjonsfelt", "Forklare hvorfor herding ikke kan hoppes over"], "punkter": ["Vannmeisling fjerner bare svak betong og gir ingen mikroriss. Gå minst 20 mm bak armeringen, mer ved klorider, og lag rette kanter.", "Rens stålet til minst Sa 2, eller Sa 2½ hvis beskrivelsen krever det. Offshore spyler du bort salt med ferskvann.", "Mapefer legges i to strøk, totalt 2 mm, rett etter rensing – men ikke ved KB eller offeranoder.", "Forvann underlaget minst ett døgn. Det skal være vannmettet og overflatetørt, mørkt og matt.", "R4: minst 45 MPa og 2,0 MPa heft. R3: minst 25 og 1,5.", "Herding er obligatorisk – tynne lag tørker fort."], "kort": [{"id": "g7-1", "q": "Hvor mye fritt rom skal det minst være bak armeringen?", "a": "Minst ca. 20 mm etter R762, ofte 25–30 mm ved klorider."}, {"id": "g7-2", "q": "Hvorfor skal mørtelen ikke fjæres ut mot null i kanten?", "a": "Fordi en tynn kant sprekker og løsner."}, {"id": "g7-3", "q": "Hva betyr «vannmettet, overflatetørt»?", "a": "Porene er fulle av vann, men det står ikke vann på overflaten. Flaten er mørk og matt. Du forvanner minst ett døgn før."}, {"id": "g7-4", "q": "Hvilke krav har en R4-mørtel?", "a": "Minst 45 MPa trykkfasthet og minst 2,0 MPa heft."}, {"id": "g7-5", "q": "Hvorfor er herding så viktig på reparasjoner?", "a": "Fordi de er tynne og tørker fort. Uttørking gir svinnriss, dårlig heft og en svak overflate."}], "tall": [], "mcq": [{"id": "gm7-1", "q": "Hvorfor er vannmeisling ofte bedre enn pigging?", "rett": "Fjerner bare svak betong, uten mikroriss", "feil": ["Den er alltid billigst og raskest", "Den trenger ikke oppsamling av vann", "Den gir en glatt flate som gir bedre heft"], "forkl": "Den er selektiv og skånsom mot betongen som blir igjen."}, {"id": "gm7-2", "q": "Hvor mye fritt rom skal det minst være bak armeringen?", "rett": "Minst 20 mm", "feil": ["2 mm", "100 mm", "Ingen"], "forkl": "Mørtelen må kunne legge seg rundt hele stålet."}, {"id": "gm7-3", "q": "Hvilken rensegrad krever Statens vegvesen minst for armering?", "rett": "Sa 2", "feil": ["Sa 1", "Ingen rensing", "Bare børsting med hånd"], "forkl": "Noen beskrivelser og produktblad krever Sa 2½, som er nesten metallisk blankt stål."}, {"id": "gm7-4", "q": "Hvor tykt legges Mapefer?", "rett": "To strøk, totalt 2 mm", "feil": ["Ett strøk, 0,1 mm", "Fem strøk, 10 mm", "Det legges ikke på stål"], "forkl": "Rett etter rensing – blåst stål ruster fort."}, {"id": "gm7-5", "q": "Hvordan skal underlaget være før mørtling?", "rett": "Vannmettet, men overflatetørt", "feil": ["Helt tørt og støvfritt", "Med vann stående på", "Dekket med et tynt lag olje"], "forkl": "Flaten skal være mørk og matt, ikke blank av vann."}, {"id": "gm7-6", "q": "Hva er kravet til R4?", "rett": "Minst 45 MPa og minst 2,0 MPa heft", "feil": ["Minst 25 MPa og 1,5 MPa heft", "Minst 60 MPa og 3,0 MPa heft", "Minst 15 MPa og 0,8 MPa heft"], "forkl": "R3 krever minst 25 MPa og 1,5 MPa heft."}, {"id": "gm7-7", "q": "Hva er prell?", "rett": "Mørtel som spretter av ved sprøyting", "feil": ["Vann som skiller seg ut fra mørtelen", "Støv som legger seg på armeringen", "Mørtel som blir igjen i blanderen"], "forkl": "Prell skal fjernes, ikke bygges inn."}, {"id": "gm7-8", "q": "Hva skjer hvis mørtelen ikke herdes?", "rett": "Svinnriss, dårlig heft og svak overflate", "feil": ["Den blir sterkere fordi den herder raskt", "Den får bare en litt lysere farge", "Ingenting, så lenge den er R4"], "forkl": "Tynne lag tørker fort, så herding er obligatorisk."}]}, {"nr": "G8", "tittel": "Produktene du bruker offshore", "mal": ["Kjenne Mapegrout T40 og T60, og når du velger hvilken", "Kjenne Mapepoxy L og LR, og hvorfor tiden avgjør", "Kjenne Mapeprimer M, Mapecoat CFS og Mapefill, og klimakravene for epoksy"], "punkter": ["T40 er R3, for fasader og ikke-kritiske flater. T60 er R4, for bærende, marint og offshore. Ved tvil: T60.", "Mapepoxy legges vått-i-vått. Åpentiden ved +20 °C er ca. 70 min for L og ca. 180 min for LR.", "Mapeprimer M tåler fukt. Mapecoat CFS krever maks 4 % fukt, RF maks 80 % og minst 3 °C over duggpunktet.", "Mapefill er en flytende støpemørtel. Støp fra én side.", "Logg klimaet før og under epoksyarbeid."], "kort": [{"id": "g8-1", "q": "Hvilken R-klasse har Mapegrout T40 og T60?", "a": "T40 er R3, og T60 er R4."}, {"id": "g8-2", "q": "Når velger du Mapepoxy LR i stedet for L?", "a": "Når støpen tar lang tid, mer enn ca. en time ved +20 °C. LR har ca. 180 min åpentid, mens L har ca. 70."}, {"id": "g8-3", "q": "Hva betyr vått-i-vått?", "a": "At du legger mørtelen mens limet fortsatt er klebrig, altså innenfor åpentiden."}, {"id": "g8-4", "q": "Hvilke klimakrav gjelder for Mapecoat CFS?", "a": "Betongen kan ha maks 4 % fukt, RF maks 80 %, og underlaget skal være minst 3 °C over duggpunktet."}, {"id": "g8-5", "q": "Hvorfor støper du Mapefill fra én side?", "a": "Så lufta kan gå ut på den andre siden i stedet for å bli fanget under platen."}], "tall": [], "mcq": [{"id": "gm8-1", "q": "Hvilken mørtel er standardvalget offshore?", "rett": "Mapegrout T60", "feil": ["Mapegrout T40", "Mapefill", "Mapecoat CFS"], "forkl": "Den er R4, sulfatresistent og har korrosjonsinhibitor."}, {"id": "gm8-2", "q": "Hvilken R-klasse har Mapegrout T40?", "rett": "R3", "feil": ["R4", "R1", "R2"], "forkl": "T40 er R3. Det er T60 som er R4."}, {"id": "gm8-3", "q": "Hva er åpentiden til Mapepoxy LR ved +20 °C?", "rett": "Ca. 180 min", "feil": ["Ca. 20 min", "Ca. 70 min", "Ca. 24 timer"], "forkl": "LR gir god tid. L har bare ca. 70 min."}, {"id": "gm8-4", "q": "Hva skjer hvis mørtelen legges etter at epoksylimet har herdet?", "rett": "Limet blir et slippsjikt", "feil": ["Heften blir bedre", "Ingenting", "Mørtelen herder raskere"], "forkl": "Derfor legger du vått-i-vått."}, {"id": "gm8-5", "q": "Hvilket produkt tåler fuktig betong?", "rett": "Mapeprimer M", "feil": ["Mapecoat CFS", "Begge", "Ingen av dem"], "forkl": "Mapecoat CFS krever at betongen har maks 4 % fukt."}, {"id": "gm8-6", "q": "Hvor mye over duggpunktet skal underlaget være for CFS?", "rett": "Minst 3 °C", "feil": ["0 °C", "Minst 10 °C", "Under duggpunktet"], "forkl": "Ellers kan det bli kondens under belegget, og da slipper det."}, {"id": "gm8-7", "q": "Hva er maks RF når Mapecoat CFS legges?", "rett": "80 %", "feil": ["95 %", "50 %", "100 %"], "forkl": "Er RF over 80 %, må du vente."}, {"id": "gm8-8", "q": "Hva brukes Mapefill til?", "rett": "Understøp, utstøping og forankring", "feil": ["Rissinjeksjon i fuktige riss", "Hydrofobering av sprutsonen", "Heftbro mellom gammel og ny betong"], "forkl": "Mapefill er en flytende støpemørtel."}, {"id": "gm8-9", "q": "Når trengs armering i Mapegrout T60, og når legges den i to strøk?", "rett": "Over ca. 30 mm: armering; 50–100 mm i to strøk", "feil": ["Over 10 mm: armering; 20–40 mm i to strøk", "Over 60 mm: armering; over 100 mm i to strøk", "Aldri armering; over 200 mm i to strøk"], "forkl": "Over ca. 30 mm monteres armering eller nett i feltet, forankret i underlaget. Ved 50–100 mm legges mørtelen i to strøk med 24 timer mellom."}, {"id": "gm8-10", "q": "Hvordan varmer du opp ved epoksyarbeid offshore?", "rett": "Bare elektrisk", "feil": ["Med gassbrenner", "Med åpen flamme", "Ikke i det hele tatt – epoksy tåler alt"], "forkl": "Avgasser fra brennere ødelegger overflaten."}]}, {"nr": "G9", "tittel": "Riss, injeksjon og overflatebeskyttelse", "mal": ["Velge riktig injeksjonsmateriale etter formålet", "Vite når riss ikke skal injiseres", "Forklare forskjellen på hydrofobering og belegg"], "punkter": ["Riss langs rustende armering injiseres ikke. Det er rusten som må repareres.", "Epoksy gir kraftoverføring i stabile, tørre riss. PUR tar bevegelse, og PUR-skum stopper vannlekkasje.", "Pakkeravstanden er ca. halve tykkelsen. Injiser nedenfra, med kontrollert trykk, og logg forbruket.", "Hydrofobering stopper vann og salt, men ikke CO₂. Et tett belegg stopper CO₂, men kan stenge fukt inne.", "Overflatebehandling stopper sjelden kloridrust som allerede er i gang."], "kort": [{"id": "g9-1", "q": "Skal et riss langs rustende armering injiseres?", "a": "Nei. Rusten er årsaken, og den må repareres."}, {"id": "g9-2", "q": "Hvilket materiale brukes for et stabilt, tørt riss som skal overføre krefter?", "a": "Lavviskøs, altså tyntflytende, epoksy."}, {"id": "g9-3", "q": "Hva gjør du med et riss som lekker vann?", "a": "Du stopper vannet med PUR-skum først."}, {"id": "g9-4", "q": "Hvorfor er høyt injeksjonstrykk ikke bedre?", "a": "Fordi det kan sprenge betongen. Injiser med kontrollert trykk."}, {"id": "g9-5", "q": "Hva er forskjellen på hydrofobering og et tett belegg?", "a": "Hydrofobering trenger inn i porene og stopper vann og salt, men ikke CO₂. Et tett belegg lager en film som også stopper CO₂, men kan stenge fukt inne."}], "tall": [], "mcq": [{"id": "gm9-1", "q": "Hvilket materiale brukes for riss som skal overføre krefter?", "rett": "Epoksy", "feil": ["PUR-skum", "Silan", "Akrylmaling"], "forkl": "Epoksy limer risset sammen og overfører krefter."}, {"id": "gm9-2", "q": "Hvilket materiale brukes for riss som beveger seg?", "rett": "Elastisk PUR", "feil": ["Lavviskøs epoksy", "Sementmørtel", "Akrylmaling"], "forkl": "Det må være elastisk og tåle bevegelsen."}, {"id": "gm9-3", "q": "Hva gjør du først med et riss som lekker vann?", "rett": "Stopper vannet med PUR-skum", "feil": ["Maler over med epoksybelegg", "Sparkler risset", "Venter til det tørker"], "forkl": "Vannet må stoppes før du kan gjøre noe annet."}, {"id": "gm9-4", "q": "Skal riss langs rustende armering injiseres?", "rett": "Nei, rusten må repareres", "feil": ["Ja, med epoksy", "Ja, med PUR-skum", "Ja, hvis det er tørt"], "forkl": "Injeksjon stopper ikke rust. Rusten må repareres."}, {"id": "gm9-5", "q": "Hva er typisk pakkeravstand?", "rett": "Ca. halve tykkelsen av elementet", "feil": ["Ca. dobbel tykkelse av elementet", "Alltid 1 meter, uansett tykkelse", "Ca. 5 cm, uansett tykkelse"], "forkl": "Bor annenhver gang fra hver side av risset."}, {"id": "gm9-6", "q": "Hvilken vei injiseres et vertikalt riss?", "rett": "Nedenfra og opp", "feil": ["Ovenfra og ned", "Fra midten", "Det spiller ingen rolle"], "forkl": "Da presses lufta ut oppover."}, {"id": "gm9-7", "q": "Hv
