<style>
/* VOICE: rolig, praktisk treningsverktøy for en fagarbeider – som et kortstokk i lomma på jobb.
   IDEA: inspeksjonskort / flashkort på betongflate – kortet er bildet.
   PICTURE: det store kortet i økta; på forsiden dagens økt som ett stort kort med teller.
   COLOUR and TYPE: betonggrå bakgrunn, mørk skifer tekst, sikkerhetsgul aksent, rustrød for «igjen». Archivo.
   LAYOUT: én kolonne, maks 680px, store knapper for tommel. */
:root{color-scheme:light dark;
 --bg:light-dark(#dcdedb,#16191a);--flate:light-dark(#f4f4f1,#22272a);--ink:light-dark(#1b2226,#e8ebe9);
 --dempet:light-dark(#5b666c,#9aa5aa);--linje:light-dark(#c5c9c5,#343b3f);--gul:#f2c12e;--gul-ink:#1b2226;
 --rust:light-dark(#a4471f,#e07a4f);--gronn:light-dark(#2f7a4b,#5fbf86);--skygge:0 1px 0 rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.35)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
main{max-width:680px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px}
h1{font-size:clamp(26px,6vw,34px);line-height:1.08;margin:0 0 4px;font-weight:800;text-wrap:balance}
h2{font-size:20px;line-height:1.2;margin:28px 0 10px;font-weight:800}
p{margin:0 0 10px}.dempet{color:var(--dempet)}.liten{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:600}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gul);outline-offset:2px}
.hoved{background:var(--gul);color:var(--gul-ink);width:100%;font-size:18px;min-height:56px}
.sek{background:var(--flate);border:1px solid var(--linje)}
.rad{display:flex;gap:10px;flex-wrap:wrap}.rad>*{flex:1 1 0}
.kort{background:var(--flate);border-radius:18px;box-shadow:var(--skygge);padding:22px 20px;position:relative}
.dag{margin:18px 0 8px}.dag .tall{font-size:56px;font-weight:800;line-height:1}
.dag .tall small{font-size:18px;font-weight:600;color:var(--dempet);margin-left:6px}
.statrad{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px;color:var(--dempet);font-size:14px}
.statrad b{color:var(--ink);font-size:16px}
.modus{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.modus button{flex:1;min-height:42px;background:transparent;font-size:15px}.modus button[aria-pressed=true]{background:var(--flate);box-shadow:var(--skygge)}
.kap{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:var(--flate);
 border-radius:12px;padding:12px 14px;margin:0 0 8px;font-weight:500}
.kap .nr{font-weight:800;font-size:18px;color:var(--dempet)}.kap .t{line-height:1.25}.kap .p{font-size:13px;color:var(--dempet);white-space:nowrap}
.bar{grid-column:2/4;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gronn)}
.tilbake{background:none;padding:0;min-height:44px;color:var(--dempet);font-weight:600}
ul.pkt{padding-left:20px;margin:6px 0 0}ul.pkt li{margin-bottom:6px}
details{background:var(--flate);border-radius:12px;padding:12px 14px;margin:10px 0}summary{font-weight:600;cursor:pointer;min-height:28px}
.fremdrift{height:6px;background:var(--flate);border-radius:3px;overflow:hidden;margin:6px 0 14px}.fremdrift i{display:block;height:100%;background:var(--gul);transition:width .3s}
.etikett{font-size:13px;color:var(--dempet);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.spm{font-size:clamp(20px,5vw,24px);line-height:1.3;font-weight:600;margin:0 0 4px;text-wrap:pretty}
.svar{border-top:2px dashed var(--linje);margin-top:18px;padding-top:16px}
.svar .fasit{font-size:17px}
textarea{width:100%;min-height:120px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--linje);border-radius:12px;padding:12px;resize:vertical;margin:14px 0 10px}
.vurd{border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--bg)}
.vurd b{display:block;margin-bottom:4px}.v2{border-left:5px solid var(--gronn)}.v1{border-left:5px solid var(--gul)}.v0{border-left:5px solid var(--rust)}
.karakter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.karakter button{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:16px}
.karakter small{font-weight:500;font-size:12px;opacity:.8}
.igjen{background:var(--rust);color:#fff}.vansk{background:var(--sek,var(--flate));border:1px solid var(--linje)}.kunne{background:var(--gronn);color:#fff}
.mic[aria-pressed=true]{background:var(--rust);color:#fff}
.sporsvar{white-space:pre-wrap;font-size:15px;margin-top:8px}
.melding{font-size:14px;color:var(--dempet);margin:8px 0}
.ferdig .tall{font-size:48px;font-weight:800}
.lytt{display:flex;gap:12px;align-items:center}.lytt .hoved{width:auto;flex:1}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px max(12px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.25)}
.mini[hidden]{display:none}.mini .inn{max-width:680px;margin:0 auto}
.mini .topp{display:flex;align-items:center;gap:8px}.mini .navn{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button{background:transparent;color:inherit;min-height:44px;min-width:44px;padding:6px 8px;font-size:15px}
.mini .pp{background:var(--gul);color:var(--gul-ink);border-radius:50%;width:48px;height:48px;font-size:18px}
.mini input[type=range]{width:100%;accent-color:var(--gul);margin:4px 0 0}
.mini .tid{display:flex;justify-content:space-between;font-size:12px;opacity:.75}
body.har-mini main{padding-bottom:150px}
.tv{position:fixed;inset:0;z-index:19;background:var(--bg);display:flex;flex-direction:column}
.tv[hidden]{display:none}
.tv .tvtopp{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(127,127,127,.25)}
.tv .tvtopp b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .tvtopp button{min-height:44px;min-width:44px;font-size:15px}
.tv .tvtekst{flex:1;overflow-y:auto;padding:16px 18px 190px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.tv .tvtekst p{margin:0 0 14px;padding:6px 10px;border-radius:8px;line-height:1.55;font-size:17px;opacity:.55;transition:opacity .25s,background .25s;cursor:pointer}
.tv .tvtekst p.ov{font-weight:700;font-size:18px}
.tv .tvtekst p.les{opacity:1;background:rgba(240,190,40,.38);box-shadow:inset 4px 0 0 var(--gul)}
.tv .tvtekst p.lest{opacity:.8}
.tv .folg{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:21;background:var(--gul);color:var(--gul-ink);border-radius:22px;padding:10px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tv .folg[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
{
const DATA = [{"nr": 1, "tittel": "Rehabiliteringsfaget og prosessen", "mal": ["Forklare hvorfor rehabilitering skiller seg fra nybygging", "Beskrive de fem fasene i et rehabiliteringsprosjekt og hva hver fase leverer", "Kjenne rollene og kompetansekravene (produksjonsleder, kontrolleder, formann/bas)", "Vite hvilke standarder og håndbøker som styrer faget"], "punkter": ["Skadeårsaken er som regel fortsatt aktiv – en reparasjon som bare fjerner symptomet, kommer tilbake.", "Prosessen er tilstandsanalyse → strategi → prosjektering → utførelse → bruksfase, ofte med prøvefelt.", "Armeringskorrosjon fra karbonatisering eller klorider er den vanligste skadeårsaken i Norge.", "NS-EN 1504-serien er hovedregelverket; del 9 gir prinsippene og del 10 utførelse og kontroll."], "kort": [{"id": "1-1", "q": "Hvorfor er det ikke nok å reparere en avskalling for å løse problemet?", "a": "Fordi årsaken (f.eks. karbonatisering eller klorider) fortsatt virker. Uten å stoppe årsaken kommer skaden tilbake, ofte raskt."}, {"id": "1-2", "q": "Hvilke tre ting skal tilstandsanalysen kartlegge?", "a": "Skadeårsak, skadeomfang og skadekonsekvens (gjerne også utvikling/prognose)."}, {"id": "1-3", "q": "Hva er hensikten med et prøvefelt?", "a": "Kontrollere at mengder, metode og produkter fungerer under de faktiske forholdene før hele jobben settes i gang."}, {"id": "1-4", "q": "Hvilken del av NS-EN 1504 beskriver prinsippene for reparasjon?", "a": "Del 9 (NS-EN 1504-9)."}, {"id": "1-5", "q": "Hvilke kurs gir normalt grunnlag for kompetansebevis i betongrehabilitering?", "a": "R-kurset (betongrehabilitering) kombinert med U1 (praktisk betongteknologi), pluss dokumentert praksis."}], "tall": [{"id": "t1-4", "q": "NS-EN 1504-serien er hovedregelverket; del 9 gir prinsippene og del ____ utførelse og kontroll.", "a": "10", "hel": "NS-EN 1504-serien er hovedregelverket; del 9 gir prinsippene og del 10 utførelse og kontroll."}]}, {"nr": 2, "tittel": "Betong og armering – det du må forstå", "mal": ["Forklare hvorfor stål i betong normalt ikke ruster (passivering)", "Beskrive korrosjonscellen og hvilke fire forutsetninger som må være til stede", "Forklare initierings- og propageringsfasen", "Forstå hvordan v/c-tall, fukt og overdekning styrer bestandigheten"], "punkter": ["Porevæsken har pH 13–14 (litt lavere med slagg, flygeaske og silika), og stålet får en beskyttende passivfilm.", "Karbonatisering (lav pH) og klorider (lokalt angrep) bryter passivfilmen.", "Korrosjon krever anode, katode, elektrisk forbindelse og elektrolytt, pluss oksygen.", "Dobbel overdekning gir omtrent fire ganger så lang initieringstid.", "Rustproduktene har større volum enn stålet og sprenger overdekningen.", "Fire transportmekanismer: kapillærsug, permeasjon, diffusjon og migrasjon. Fukt avgjør hvilken som er åpen.", "Gasser går gjennom luftfylte porer, klorider bare gjennom vannfylte. Vått-tørt gir raskest kloridinntrengning."], "kort": [{"id": "2-1", "q": "Hva er normal pH i porevæsken i ny betong?", "a": "Ca. 13–14 for portlandsement (13,4–13,9 målt), litt lavere med slagg, flygeaske eller mye silika. 12,5 er pH i en ren kalsiumhydroksidløsning."}, {"id": "2-2", "q": "Hva er forskjellen på korrosjon fra karbonatisering og fra klorider?", "a": "Karbonatisering gir generell, jevn korrosjon fordi pH synker overalt. Klorider gir lokal groptæring som kan gi stort tverrsnittstap uten store synlige tegn."}, {"id": "2-3", "q": "Hvilke fire elementer må til for en korrosjonscelle?", "a": "Anode, katode, elektrisk forbindelse (stålet) og elektrolytt (fuktig betong). I tillegg oksygen til katodereaksjonen."}, {"id": "2-4", "q": "Hva skjer i initieringsfasen?", "a": "Karbonatiseringsfronten eller kloridene vandrer inn mot armeringen. Det er ingen synlige skader ennå."}, {"id": "2-5", "q": "Hvorfor er konstruksjoner som veksler mellom vått og tørt mest utsatt?", "a": "Fukten gir ledningsevne og transporterer klorider, mens uttørkingen gir oksygentilgang. Kloridene konsentreres ved gjentatt fukting og uttørking."}, {"id": "2-6", "q": "Hvorfor går klorider raskere inn i en kantdrager som veksler mellom vått og tørt enn i en som alltid er våt?", "a": "Når overflaten tørker, suger den saltvann inn ved kapillærsug neste gang den blir våt. Kapillærsug er mye raskere enn diffusjon, som er den eneste mekanismen i vannmettet betong."}, {"id": "2-7", "q": "Hvorfor trenger CO₂ nesten ikke inn i vannmettet betong?", "a": "Gasser diffunderer omtrent 10 000 ganger langsommere gjennom vann enn gjennom luft. Når porene er fulle av vann, stopper CO₂-transporten nesten helt."}], "tall": [{"id": "t2-1", "q": "Porevæsken har pH ____ (litt lavere med slagg, flygeaske og silika), og stålet får en beskyttende passivfilm.", "a": "13–14", "hel": "Porevæsken har pH 13–14 (litt lavere med slagg, flygeaske og silika), og stålet får en beskyttende passivfilm."}]}, {"nr": 3, "tittel": "Nedbrytningsmekanismer", "mal": ["Kjenne igjen de viktigste nedbrytningsmekanismene i felt", "Regne ut karbonatiseringskoeffisient og anslå når fronten når armeringen", "Forklare kritisk kloridinnhold og ringanodeeffekten", "Vite hvordan AKR, frost og kjemiske angrep ser ut og hvordan de påvises"], "punkter": ["Karbonatisering følger x = k·√t. Målt dybde og alder gir k.", "Kritisk kloridinnhold settes ofte til ca. 0,4 % av sementvekt (ca. 0,05–0,07 % av betongvekt), men varierer.", "Ringanode: Reparasjon i kloridforurenset betong kan gi ny korrosjon rundt lappen.", "AKR gir kartmønsterriss og bremses best ved å holde betongen tørr.", "Saltfrost gir lagvis avskalling, særlig på kantdragere og kaier.", "Karbonatisering går raskest ved 60–70 % RF og på flater skjermet mot regn.", "Frostskader krever høy vannmetning (over ca. 80–90 % av porene). Luftporer med avstand under 0,1–0,2 mm beskytter.", "Sprutsonen er verst i sjøvann. Sulfatbestandig sement er ikke automatisk kloridbestandig."], "kort": [{"id": "3-1", "q": "En konstruksjon er 36 år og har 18 mm karbonatiseringsdybde. Hva er k, og når når fronten 30 mm overdekning?", "a": "k = 18/√36 = 3,0 mm/√år. t = (30/3)² = 100 år, altså om ca. 64 år."}, {"id": "3-2", "q": "Bremser hydrofobering karbonatisering?", "a": "Nei. Porene forblir åpne for CO₂, og fordi betongen blir tørrere, kan karbonatiseringen til og med gå litt raskere. Mot karbonatisering trengs et belegg med høy CO₂-motstand. Hydrofobering kan likevel senke korrosjonshastigheten i karbonatisert betong ved å holde den tørr."}, {"id": "3-3", "q": "Hva er ringanodeeffekten, og hvordan forebygges den?", "a": "Ny korrosjon rundt en reparert lapp fordi stålet utenfor lappen blir anode. Forebygges ved å fjerne all forurenset betong, bruke offeranoder i kanten eller katodisk beskyttelse."}, {"id": "3-4", "q": "Hvordan påviser du AKR sikkert?", "a": "Med planslip eller tynnslip (mikroskopi) av borkjerner, som viser alkaligel og typisk rissmønster."}, {"id": "3-5", "q": "Hvor kom klorider fra i eldre betong som aldri har vært saltutsatt?", "a": "Fra kalsiumklorid brukt som akselerator (fram til 1970-tallet), eller forurenset tilslag og blandevann."}, {"id": "3-6", "q": "Hvorfor finner du ofte dypere karbonatisering under et takutstikk enn på en fasade som får regn?", "a": "Den skjermede flaten holder seg nær 60–70 % RF, der karbonatiseringen går raskest. Flaten som får regn, er ofte våt, og da stenger vannet for CO₂."}, {"id": "3-7", "q": "Hva er kritisk metningsgrad ved frost, og hvilke reparasjonstiltak utnytter den?", "a": "Når mer enn ca. 80–90 % av porevolumet er vannfylt, kan få frostsykluser gi skade. Drenering, hydrofobering og diffusjonsåpne belegg holder metningen under grensen."}, {"id": "3-8", "q": "Hvorfor var sement med lavt C₃A et dårlig valg for mange marine konstruksjoner?", "a": "Den motstår sulfat, men binder klorider dårlig. Kloridene nådde derfor armeringen raskere, og konstruksjonene fikk omfattende korrosjon."}], "tall": [{"id": "t3-2", "q": "Kritisk kloridinnhold settes ofte til ca. ____ av sementvekt (ca. 0,05–0,07 % av betongvekt), men varierer.", "a": "0,4 %", "hel": "Kritisk kloridinnhold settes ofte til ca. 0,4 % av sementvekt (ca. 0,05–0,07 % av betongvekt), men varierer."}, {"id": "t3-6", "q": "Karbonatisering går raskest ved ____ RF og på flater skjermet mot regn.", "a": "60–70 %", "hel": "Karbonatisering går raskest ved 60–70 % RF og på flater skjermet mot regn."}, {"id": "t3-7", "q": "Frostskader krever høy vannmetning (over ca. ____ av porene). Luftporer med avstand under 0,1–0,2 mm beskytter.", "a": "80–90 %", "hel": "Frostskader krever høy vannmetning (over ca. 80–90 % av porene). Luftporer med avstand under 0,1–0,2 mm beskytter."}]}, {"nr": 4, "tittel": "Tilstandskontroll og undersøkelsesmetoder", "mal": ["Planlegge en tilstandskontroll med soneinndeling og prøvetakingsplan", "Utføre og tolke de vanligste målingene (overdekning, karbonatisering, klorider, potensial, resistivitet)", "Bruke kloridprofilen til å bestemme hvor dypt betong må fjernes", "Skrive en rapport som kan brukes direkte til strategivalg"], "punkter": ["Del konstruksjonen i eksponeringssoner – skadene følger miljøet.", "Fenolftalein på fersk bruddflate: rødlilla = ikke karbonatisert (pH over ca. 9).", "Kloridprofilen viser om terskelen er nådd ved armeringen og hvor dypt forurensningen går.", "Potensialkartlegging viser sannsynlighet for korrosjon, ikke hastighet. Se på gradienter og bekreft med åpninger.", "Rapporten skal gi årsak, omfang, konsekvens, prognose og anbefalte tiltak."], "kort": [{"id": "4-1", "q": "Hvorfor skal fenolftalein ikke sprayes på en saget flate?", "a": "Sagestøv smører indikator og alkalisk materiale utover flaten og gir feil avlesning. Bruk en fersk bruddflate."}, {"id": "4-2", "q": "Potensialet måles til −400 mV mot Cu/CuSO₄. Er det sikkert at stålet korroderer?", "a": "Nei. Det tyder på høy sannsynlighet, men fukt, oksygen og belegg påvirker. Vurder gradienter og bekreft med åpning."}, {"id": "4-3", "q": "Hva forteller lav resistivitet (under 10 kΩ·cm)?", "a": "At betongen er fuktig og/eller kloridholdig og leder ionestrøm godt, slik at korrosjonen kan gå raskt hvis stålet er depassivert."}, {"id": "4-4", "q": "Hvorfor bør du også ta prøver der det ikke er synlige skader?", "a": "For å se hvor langt fronten er kommet før skadene viser seg. Det er avgjørende for prognose og forebyggende tiltak."}, {"id": "4-5", "q": "Hva er tre registreringsnivåer i NS 3424 i grove trekk?", "a": "Nivå 1 er generelt og visuelt, nivå 2 er mer inngående med enkle målinger, og nivå 3 er spesielt inngående med prøvetaking og laboratorieanalyser."}, {"id": "4-6", "q": "Du måler svært negative potensialer ved foten av en søyle som står i fuktig terreng, men ser ingen skader. Hvordan tolker du det?", "a": "Det kan skyldes oksygenmangel i vannmettet betong, ikke aktiv korrosjon. Mål korrosjonshastigheten eller åpne for å kontrollere."}, {"id": "4-7", "q": "Hvordan bør potensialmåling gjøres på karbonatisert betong?", "a": "Mål først med lite fukting, fukt deretter grundig og vent minst 2 timer før ny måling. Se etter områder som er ca. 100 mV mer negative innenfor ca. 1 m, og bekreft med åpninger."}], "tall": []}, {"nr": 5, "tittel": "Dokumentasjon og klassifisering etter Statens vegvesen (V441)", "mal": ["Registrere et funn med alle V441-feltene", "Bruke riktige koder for skadetype og skadeårsak", "Skille mellom skadegrad og konsekvensgrad", "Vite når bruforvalter skal varsles umiddelbart"], "punkter": ["Skadetype = hva, skadeårsak = hvorfor, skadegrad = hvor ille, konsekvenstype = hva rammes, konsekvensgrad = hvor mye.", "Skadegrad 1–4: liten, middels, stor, svært stor skade.", "Konsekvenstyper: B bæreevne, T trafikksikkerhet, V vedlikeholdskostnader, M miljø/estetikk.", "Konsekvensgrad 3: tiltak registreres i Brutus og inspeksjonsintervall vurderes. Konsekvensgrad 4: varsle umiddelbart.", "Riss kodes 14 og lekkasje 17 (materialuavhengig), ikke under betong."], "kort": [{"id": "5-1", "q": "Hvilken kode har avskalling, og hvilken har armeringskorrosjon?", "a": "35 Avskalling og 36 Armeringskorrosjon."}, {"id": "5-2", "q": "Hva er koden for kloridangrep og for karbonatisering?", "a": "52 Kloridangrep og 53 Karbonatisering (under 50 Miljøangrep)."}, {"id": "5-3", "q": "Kan en middels skade ha stor konsekvens? Gi et eksempel.", "a": "Ja. En middels avskalling med løse biter over en gangveg kan gi konsekvensgrad 4 for trafikksikkerhet."}, {"id": "5-4", "q": "Hva skal skje ved konsekvensgrad 4?", "a": "Bruforvalter eller oppdragsgiver kontaktes umiddelbart, og varslingen dokumenteres."}, {"id": "5-5", "q": "Hvordan kodes kalkutfellinger fra riss i undersiden av et dekke?", "a": "Skadetype 14 Riss/sprekk og 17 Lekkasje/fuktbelastning, årsak 54 Utluting. Konsekvens typisk V og M."}], "tall": []}, {"nr": 6, "tittel": "Reparasjonsstrategi og NS-EN 1504-9", "mal": ["Forklare arbeidsgangen i NS-EN 1504-9: skade → strategi → prinsipp → metode → produkt", "Kjenne de 11 prinsippene og hvilke som gjelder betong og armering", "Velge prinsipp for karbonatisering og klorider ut fra omfang", "Skille mellom forenklet, begrenset og fullstendig mekanisk reparasjon"], "punkter": ["Prinsipp 1–6 gjelder betongen, 7–11 armeringskorrosjon.", "Prinsipp 7 (gjenopprette passivitet) og 10 (katodisk beskyttelse) er de viktigste ved korrosjon.", "Ved utbredte, dype kloridskader er KB ofte billigere enn å fjerne all forurenset betong.", "Alle løsninger bør kombineres med tiltak mot ny inntrengning (prinsipp 1, 2, 8).", "RILEM: velg alternativ → prinsipp → metode. Del konstruksjonen i passive, tidlig korroderende og skadde soner.", "Én hovedmetode med alle krav oppfylt – tilleggsmetoder kan ikke erstatte den.", "Katodeprosessen (oksygen) kan ikke stoppes pålitelig med belegg på konstruksjoner i luft."], "kort": [{"id": "6-1", "q": "Hvilket prinsipp er katodisk beskyttelse?", "a": "Prinsipp 10."}, {"id": "6-2", "q": "Hva er forskjellen på forenklet og fullstendig reparasjon?", "a": "Forenklet fjerner bare løs og oppsprukket betong. Fullstendig fjerner all karbonatisert eller kloridforurenset betong rundt armeringen og gjenoppretter passiviteten."}, {"id": "6-3", "q": "Hvorfor må du vite om KB skal brukes senere før du velger reparasjonsmørtel?", "a": "KB krever elektrisk kontakt. Isolerende polymermørtler eller epoksy på armeringen hindrer strømmen."}, {"id": "6-4", "q": "Nevn tre metoder under prinsipp 7.", "a": "Økt overdekning, utskifting av forurenset/karbonatisert betong, elektrokjemisk realkalisering, kloriduttrekk."}, {"id": "6-5", "q": "Hvilken del av EN 1504 stiller krav til reparasjonsmørtel?", "a": "Del 3 (NS-EN 1504-3)."}, {"id": "6-6", "q": "Hvorfor er det ikke nok å reparere bare der armeringen ruster i kloridforurenset betong?", "a": "Betongen rundt har ofte klorider over terskelen, men stålet der er beskyttet av korrosjonen i det skadde området. Når skaden repareres, forsvinner denne beskyttelsen, og den nye passive lappen driver i tillegg korrosjon i kanten (ringanodeeffekt)."}, {"id": "6-7", "q": "Hvorfor kan du ikke stoppe korrosjonen ved å legge et tett belegg som stenger ute oksygen?", "a": "Selv tette belegg slipper gjennom litt oksygen, betongen inneholder oksygen fra før, og det er sjelden mulig å belegge alle sider. Nye riss gir nye veier inn."}, {"id": "6-8", "q": "Når kan et alkalisk overlag på over 20 mm brukes på karbonatisert betong?", "a": "Når bare risset og delaminert betong fjernes, betongen er fuktig nok til at OH⁻ kan diffundere inn, og karbonatiseringen ikke går mer enn ca. 20 mm bak armeringen. Overlaget må selv motstå karbonatisering i hele levetiden."}], "tall": [{"id": "t6-2", "q": "Prinsipp 7 (gjenopprette passivitet) og ____ (katodisk beskyttelse) er de viktigste ved korrosjon.", "a": "10", "hel": "Prinsipp 7 (gjenopprette passivitet) og 10 (katodisk beskyttelse) er de viktigste ved korrosjon."}]}, {"nr": 7, "tittel": "Forbehandling", "mal": ["Velge riktig metode for fjerning av betong", "Utforme et reparasjonsfelt med riktige kanter og dybde", "Rengjøre og vurdere armering", "Klargjøre underlaget riktig før mørtling"], "punkter": ["Vannmeisling er selektiv og gir ingen mikroriss, men krever håndtering av alkalisk vann.", "Rette kanter, ingen fjæring mot null, fritt rom bak armeringen (typisk 15–20 mm).", "Fortsett langs armeringen til ren stål. Vurder tverrsnittstap og ny armering.", "Underlaget skal være rent og vannmettet, men overflatetørt.", "R4: ≥45 MPa og ≥2,0 MPa heft. R3: ≥25 MPa og ≥1,5 MPa."], "kort": [{"id": "7-1", "q": "Hvorfor skal mørtel ikke fjæres ut mot null i kanten?", "a": "Den tynne kanten sprekker og løsner. Kanten skal ha en minste dybde og være rett."}, {"id": "7-2", "q": "Hva betyr «vannmettet, overflatetørt»?", "a": "Porene er fylt med vann, men det står ikke vann på overflaten. Den er mørk og matt."}, {"id": "7-3", "q": "Hvorfor er vannmeisling ofte å foretrekke framfor tung pigging?", "a": "Den fjerner selektivt svak betong og gir ikke mikroriss i gjenværende betong. Den gir også en ru heftflate."}, {"id": "7-4", "q": "Hvilken rensegrad kreves ofte for armering?", "a": "Sa 2½ etter ISO 8501-1, eller det produktdatabladet angir."}, {"id": "7-5", "q": "Når skal armeringen ikke males med epoksy?", "a": "Når katodisk beskyttelse eller elektrokjemiske metoder skal brukes, fordi stålet må ha elektrisk kontakt med mørtelen."}, {"id": "7-6", "q": "Hvorfor bør beskrivelsen ta hensyn til «skyggen» bak armeringen ved vannmeisling?", "a": "Vannmeisling etterlater ofte en topp av betong bak stengene. Kreves den fjernet, forsvinner mye av den økonomiske gevinsten. Beskrivelsen bør tilpasses hva metoden faktisk gir."}], "tall": [{"id": "t7-2", "q": "Rette kanter, ingen fjæring mot null, fritt rom bak armeringen (typisk ____).", "a": "15–20 mm", "hel": "Rette kanter, ingen fjæring mot null, fritt rom bak armeringen (typisk 15–20 mm)."}, {"id": "t7-5", "q": "R4: ≥____ og ≥2,0 MPa heft. R3: ≥25 MPa og ≥1,5 MPa.", "a": "45 MPa", "hel": "R4: ≥45 MPa og ≥2,0 MPa heft. R3: ≥25 MPa og ≥1,5 MPa."}]}, {"nr": 8, "tittel": "Mekanisk reparasjon", "mal": ["Velge mellom håndmørtel, utstøping og sprøyting", "Lese et produktdatablad og velge riktig R-klasse", "Utføre og etterbehandle en reparasjon riktig", "Kjenne de vanligste feilene og hvordan de forebygges"], "punkter": ["Sementbaserte (CC) og polymermodifiserte (PCC) mørtler er hovedvalget. Ren epoksymørtel (PC) brukes bare til små spesialjobber.", "Respekter lagtykkelse og komprimer godt bak armeringen.", "Tørrsprøyting er fleksibelt og gir god heft. Våtsprøyting gir høy kapasitet og mindre støv.", "Herding er obligatorisk: dekk til og hold fuktig i den tiden databladet krever."], "kort": [{"id": "8-1", "q": "Hvilken R-klasse brukes for konstruktive reparasjoner?", "a": "R3 eller R4."}, {"id": "8-2", "q": "Nevn tre vanlige feil ved håndmørtling.", "a": "For lite fjernet bak armering, tørt eller støvete underlag, for mye vann, for tykke lag, manglende herding, fjæring i kanter."}, {"id": "8-3", "q": "Hva er prelltap, og hvorfor må det fjernes?", "a": "Materiale som spretter av ved sprøyting. Bygges det inn, gir det svake soner og hulrom."}, {"id": "8-4", "q": "Hvorfor er herding spesielt viktig for reparasjoner?", "a": "De er tynne med stor overflate og tørker fort ut. Det gir svinnriss, dårlig heft og svak overflate."}, {"id": "8-5", "q": "Når velger du utstøping framfor håndmørtel?", "a": "Ved store volum, gjennomgående skader og armering på flere sider, der sprøyting ikke er mulig."}], "tall": []}, {"nr": 9, "tittel": "Overflatebeskyttelse", "mal": ["Skille mellom hydrofobering, impregnering og belegg", "Velge overflatebeskyttelse etter nedbrytningsmekanisme", "Forstå diffusjonsåpenhet og CO₂-motstand", "Utføre og kontrollere overflatebehandling"], "punkter": ["Hydrofobering stopper vann og klorider, men ikke CO₂.", "Belegg mot karbonatisering skal ha sd,CO₂ over 50 m.", "Utvendige, fuktige konstruksjoner trenger diffusjonsåpne løsninger.", "Inntrengningsdybde avgjør levetiden til hydrofobering. Underlaget må være tørt.", "Tett gir god barriere men stenger fukt inne; åpent varer lenger. Tette belegg må fornyes etter 10–15 år.", "Overflatebehandling bremser ny inntrengning, men stopper sjelden kloridkorrosjon som allerede er i gang."], "kort": [{"id": "9-1", "q": "Hvilken behandling velger du mot klorider på en kantdrager?", "a": "Hydrofobering, gjerne silangel for dyp inntrengning, eventuelt en sementbasert kloridbremsende membran."}, {"id": "9-2", "q": "Hvorfor kan et tett epoksybelegg være feil valg på AKR-skadet betong?", "a": "Det stenger fukten inne og holder betongen våt, slik at reaksjonen fortsetter."}, {"id": "9-3", "q": "Hva er duggpunktsregelen ved maling?", "a": "Underlaget skal være minst 3 °C over duggpunktet."}, {"id": "9-4", "q": "Hvordan kontrolleres hydrofobering?", "a": "Ved inntrengningsdybde på kjerner, forbruk per m² og eventuelt vannabsorpsjon."}, {"id": "9-5", "q": "Hvilken type behandling bremser karbonatisering best?", "a": "Belegg med høy CO₂-motstand, f.eks. akrylmaling beregnet for betong."}, {"id": "9-6", "q": "Hvorfor kan et epoksybelegg gjøre kloridskadene verre etter 15–20 år?", "a": "Når belegget får skader, slipper vann inn, men belegget hindrer fortsatt uttørking. Betongen blir stående våt, klorider transporteres raskt og korrosjonen går fort."}, {"id": "9-7", "q": "Nevn tre krav til en god hydrofobering.", "a": "Vannopptak under ca. 20 % av ubehandlet, inntrengning minst 2 mm (ofte mer i norske beskrivelser), uttørking minst 60 % av ubehandlet, og alkalibestandighet."}], "tall": [{"id": "t9-2", "q": "Belegg mot karbonatisering skal ha sd,CO₂ over ____ m.", "a": "50", "hel": "Belegg mot karbonatisering skal ha sd,CO₂ over 50 m."}, {"id": "t9-5", "q": "Tett gir god barriere men stenger fukt inne; åpent varer lenger. Tette belegg må fornyes etter ____.", "a": "10–15 år", "hel": "Tett gir god barriere men stenger fukt inne; åpent varer lenger. Tette belegg må fornyes etter 10–15 år."}]}, {"nr": 10, "tittel": "Riss og injeksjon", "mal": ["Avgjøre om et riss skal injiseres og med hvilket formål", "Velge materiale etter EN 1504-5 (F, D, S)", "Planlegge pakkerplassering og utføre injeksjon", "Dokumentere injeksjonsarbeidet og ivareta HMS"], "punkter": ["Formål styrer materialet: epoksy for kraftoverføring, elastisk PUR for bevegelige riss, skum/gel for vann.", "Riss langs korrodert armering injiseres ikke – årsaken må utbedres.", "Bor skrått, vekselvis fra hver side. Pakkeravstand ca. halve tykkelsen.", "Injiser nedenfra med kontrollert trykk, og logg forbruk per pakker.", "Epoksy og isocyanater krever opplæring og verneutstyr."], "kort": [{"id": "10-1", "q": "Et stabilt, tørt riss i en bærende bjelke skal injiseres. Hvilket materiale?", "a": "Lavviskøs epoksy (klasse F, kraftoverførende)."}, {"id": "10-2", "q": "Et riss lekker vann aktivt. Hva gjør du?", "a": "Tetter med PUR-skum (eventuelt etterinjisering med elastisk PUR), og forinjiserer med vann."}, {"id": "10-3", "q": "Hvorfor er høyt trykk ikke bedre?", "a": "Det kan sprenge betongen og presse materialet bort i stedet for å fylle risset."}, {"id": "10-4", "q": "Hva kan svært lavt forbruk per pakker bety?", "a": "At risset ikke er fylt, f.eks. fordi borehullet ikke traff risset eller risset er tettet av støv."}, {"id": "10-5", "q": "Hvilken klasse i EN 1504-5 brukes for riss som beveger seg?", "a": "Klasse D (duktil fylling)."}, {"id": "10-6", "q": "Et produkt er merket U(S1) W(8)(1/3)(5/30). Kan du bruke det på et vannførende riss på 0,3 mm?", "a": "Nei. W(8) betyr at produktet er dokumentert for riss fra 0,8 mm, og fuktklassen (1/3) dekker ikke rennende vann (4). Til 0,3 mm trengs et produkt med W(3) eller lavere, for eksempel Foamjet F."}, {"id": "10-7", "q": "Du skal injisere et stabilt riss med epoksy ved +8 °C. Hvorfor velger du Mapepoxy BI og ikke BI-R?", "a": "BI er klassifisert for +5 til +30 °C. BI-R er klassifisert for +21 til +30 °C ved betonginjeksjon."}], "tall": []}, {"nr": 11, "tittel": "Elektrokjemisk realkalisering og kloriduttrekk", "mal": ["Forklare prinsippet for realkalisering og kloriduttrekk", "Kjenne typiske parametre og forutsetninger", "Vurdere når metodene passer, og når KB er bedre"], "punkter": ["Begge er midlertidige behandlinger med høy strømtetthet (ca. 1 A/m² betong).", "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk 2–8 uker.", "Kontinuitet i armering og fravær av kortslutning er forutsetninger.", "Spennarmering og AKR krever særskilt vurdering."], "kort": [{"id": "11-1", "q": "Hvilken elektrolytt brukes ved realkalisering?", "a": "Typisk natriumkarbonatløsning, f.eks. i sprøytet cellulosefiber."}, {"id": "11-2", "q": "Hvorfor fjerner kloriduttrekk dårlig klorider bak armeringen?", "a": "Stålet er katoden og «skygger». Kloridene bak vandrer dårlig ut mot anoden på overflaten."}, {"id": "11-3", "q": "Hva er den største forskjellen mellom kloriduttrekk og KB?", "a": "Kloriduttrekk er en midlertidig behandling, mens KB er permanent, overvåkes og beskytter også mot fremtidige klorider."}, {"id": "11-4", "q": "Hvordan kontrolleres realkalisering?", "a": "Med fenolftalein på kjerner/åpninger etter behandlingen, i tillegg til logging av ladningsmengde."}, {"id": "11-5", "q": "Nevn fire måter å bestemme når kloriduttrekk skal avsluttes på.", "a": "Når effekten avtar (strømmen faller, typisk under ca. 0,5 A/m²), når kloridprøver når avtalt nivå, når kloridinnholdet i elektrolytten flater ut, og ved erfaringsbasert ladningsmengde (Ah/m²)."}, {"id": "11-6", "q": "Hva er den mest katastrofale feilen ved elektrokjemisk behandling?", "a": "Feil polaritet. Da blir armeringen anode og korroderer kraftig."}], "tall": [{"id": "t11-1", "q": "Begge er midlertidige behandlinger med høy strømtetthet (ca. ____ betong).", "a": "1 A/m²", "hel": "Begge er midlertidige behandlinger med høy strømtetthet (ca. 1 A/m² betong)."}, {"id": "t11-2", "q": "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk ____.", "a": "2–8 uker", "hel": "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk 2–8 uker."}]}, {"nr": 12, "tittel": "Katodisk beskyttelse", "mal": ["Forklare hvordan katodisk beskyttelse stopper korrosjon", "Kjenne anodesystemene for ICCP og galvaniske anoder", "Beskrive kritiske punkter ved installasjon og idriftsettelse", "Kjenne kriteriene i ISO 12696 og grensene for overbeskyttelse"], "punkter": ["KB gjør hele armeringen til katode, slik at anodereaksjonen undertrykkes.", "ICCP gir styrbar, målbar beskyttelse. Galvaniske anoder er enkle, men har begrenset kapasitet.", "Kontinuitet og kortslutningskontroll er de viktigste installasjonskontrollene.", "Kriterier (minst ett): instant-off mer negativ enn −720 mV, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid.", "Grenser: ikke mer negativt enn ca. −1100 mV (slakkarmering) og −900 mV (spennarmering)."], "kort": [{"id": "12-1", "q": "Hvorfor måles potensialet «instant-off»?", "a": "For å fjerne IR-fallet i betongen, som ellers gir et for negativt og misvisende potensial."}, {"id": "12-2", "q": "Hva er en typisk strømtetthet for KB i atmosfærisk betong?", "a": "Fra noen få opp til ca. 20 mA/m² stål. Ved katodisk forebygging under ca. 2 mA/m²."}, {"id": "12-3", "q": "Hvorfor skal reparasjonsmørtelen i en KB-sone være sementbasert med passende resistivitet?", "a": "Strømmen må kunne gå jevnt gjennom betongen til armeringen. Isolerende materialer gir skygge og ubeskyttede områder."}, {"id": "12-4", "q": "Hva er det første du måler før strømmen slås på?", "a": "Naturlige (statiske) potensialer ved alle referanseelektroder."}, {"id": "12-5", "q": "Nevn to vanlige problemer i eldre KB-anlegg.", "a": "Anlegg som er utkoblet uten at noen vet det, defekte referanseelektroder, syredannelse ved anoden, kortslutninger etter senere boring."}, {"id": "12-6", "q": "Hvilket anodesystem velger du på et brudekke med trafikk, og hvorfor?", "a": "MMO-titannett i overlag eller titanbånd i spor. Belegg tåler ikke slitasje, mens titan er robust og har svært lang levetid."}, {"id": "12-7", "q": "Hvorfor monteres ofte pseudoreferanser i tillegg til ekte referanseelektroder?", "a": "Ekte referanseelektroder har begrenset levetid (ca. 20 år). Pseudoreferanser gjør det mulig å fortsette å måle depolarisasjon uten å bytte elektroder."}], "tall": [{"id": "t12-4", "q": "Kriterier (minst ett): instant-off mer negativ enn ____, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid.", "a": "−720 mV", "hel": "Kriterier (minst ett): instant-off mer negativ enn −720 mV, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid."}, {"id": "t12-5", "q": "Grenser: ikke mer negativt enn ca. ____ (slakkarmering) og −900 mV (spennarmering).", "a": "−1100 mV", "hel": "Grenser: ikke mer negativt enn ca. −1100 mV (slakkarmering) og −900 mV (spennarmering)."}]}, {"nr": 13, "tittel": "Forsterkning av betongkonstruksjoner", "mal": ["Kjenne de vanligste forsterkningsmetodene", "Utføre karbonfiberforsterkning riktig i felt", "Forstå hvorfor underlag og forankring er avgjørende"], "punkter": ["Forsterkning prosjekteres alltid av konstruktør.", "FRP har høy strekkfasthet, men svikter typisk i limfugen eller betongoverdekningen.", "Underlaget skal ha tilstrekkelig strekkfasthet (typisk ≥ 1,5 MPa), og hjørner rundes av ved omsnøring."], "kort": [{"id": "13-1", "q": "Hvor svikter CFRP-forsterkning vanligvis?", "a": "Ved avskalling av betongoverdekningen eller heftsvikt i endene, sjelden ved brudd i fiberen."}, {"id": "13-2", "q": "Hvorfor rundes hjørner av før omsnøring med vev?", "a": "Skarpe hjørner gir spenningskonsentrasjoner som kan kutte fibrene."}, {"id": "13-3", "q": "Hva må gjøres før forsterkning av et korrosjonsskadet element?", "a": "Reparere betongskadene og stoppe korrosjonen først."}], "tall": [{"id": "t13-3", "q": "Underlaget skal ha tilstrekkelig strekkfasthet (typisk ≥ ____), og hjørner rundes av ved omsnøring.", "a": "1,5 MPa", "hel": "Underlaget skal ha tilstrekkelig strekkfasthet (typisk ≥ 1,5 MPa), og hjørner rundes av ved omsnøring."}]}, {"nr": 14, "tittel": "Mapei-produktene – lest fra databladene", "mal": ["Lese et produktdatablad og finne klasse, lagtykkelse, temperatur og forbruk", "Velge riktig Mapei-produkt etter funksjon og EN 1504-klasse", "Kjenne de vanligste fellene: feil kombinasjon av produkter, for tynne lag, feil herding", "Regne ut materialbehov fra forbruksangivelsen"], "punkter": ["Prinsipp og metode velges først – deretter produkt med riktig standard og klasse.", "Mapefer og Redisit: to strøk, totalt 2 mm, rett etter rensing. Aldri sammen med galvanisk KB.", "Redirep 45 RSF, DS, DS-RSF og Confix er R4. Mapegrout T40 er R3. Redirep 25 RSF er R2.", "Planiseal WR 90 Gel gir inntrengning klasse II (≥ 10 mm) i ett strøk; WR 100 legges i to strøk.", "Elastiske belegg (Cem Elastic, Mapelastic Smart) krever minst 2 mm for å bygge over riss.", "Mapeshield E er en sinkplate på overflaten; Mapeshield I er anoder som festes til armeringen og støpes inn.", "Bruk forbruket i databladet til å regne ut mengder, og legg til svinn.", "Sjekk alltid gjeldende datablad og DoP – utgavenummeret står nederst på databladet."], "kort": [{"id": "14-1", "q": "Du skal reparere en søyle i skvalpesonen på en kai. Hvilken av Redirep-mørtlene velger du, og hvorfor?", "a": "Redirep 45 RSF. Den er klasse R4 (konstruktiv), frostbestandig og deklarert for XS3/XD3/XF4. Redirep 25 RSF er bare R2."}, {"id": "14-2", "q": "Hvor tykt skal Mapefer eller Redisit ligge på armeringen, og hvordan legges det?", "a": "Totalt ca. 2 mm i to strøk med pensel, 1–2 timer mellom strøkene (Mapefer ca. 2 timer), rett etter at stålet er renset."}, {"id": "14-3", "q": "Hvorfor skal du ikke bruke Mapefer når det skal monteres Mapeshield E?", "a": "Korrosjonsbeskyttelsen hindrer god elektrolytisk kontakt mellom stålet og mørtelen. Den galvaniske strømmen fra sinkanoden må gå gjennom mørtelen og inn i armeringen. Databladet forbyr derfor korrosjonsbeskyttelse på armeringen."}, {"id": "14-4", "q": "Regn ut hvor mange sekker DS du trenger for 12 m² sprøyting med 40 mm tykkelse.", "a": "19 kg/m² per cm × 4 cm × 12 m² = 912 kg. Med 5 % prell ≈ 958 kg, altså ca. 39 sekker à 25 kg (eller én storsekk à 1200 kg)."}, {"id": "14-5", "q": "Hva er forskjellen på Planiseal WR 90 Gel og Planiseal WR 100?", "a": "Begge er ren silan (hydrofobering). WR 90 Gel er tiksotrop, legges i ett strøk og trenger dypt inn (klasse II, ≥ 10 mm). WR 100 er tyntflytende og legges i to strøk på 0,1–0,2 kg/m²."}, {"id": "14-6", "q": "Hvilken minimumstykkelse krever Cem Elastic og Mapelastic Smart, og hvorfor er den viktig?", "a": "Minst 2 mm. Rissoverbyggingen og tettheten mot CO₂ og klorider er dokumentert ved den tykkelsen. Tynnere lag gir ikke den deklarerte ytelsen."}, {"id": "14-7", "q": "Hvilket krav stiller Carboplate-databladet til underlaget?", "a": "Avtrekksfastheten (strekkfastheten) i betongen må være over 1,5 MPa."}, {"id": "14-8", "q": "Hvorfor skal Mapecure 1 ikke brukes på en flate som skal males?", "a": "Voksfilmen hindrer heft. Den må fjernes helt før epoksy, maling eller påstøp. Bruk heller plast eller vanning."}, {"id": "14-9", "q": "Hva skiller Mapegrout T60 fra T40, og når velger du T60?", "a": "T60 er R4 (T40 er R3), har sulfatresistent sement og korrosjonsinhibitor, 60 MPa og lagtykkelse opptil 100 mm. Velg T60 for bærende deler, marint miljø og offshore."}, {"id": "14-10", "q": "Hvorfor kan Mapeprimer M legges på fuktig betong, mens Mapecoat CFS ikke kan det?", "a": "Mapeprimer M er laget og testet for fuktig underlag (EN 13578). CFS krever maks 4 % fukt og legges derfor på primeren, ikke direkte på fuktig betong."}, {"id": "14-11", "q": "Hva betyr W(1) og (5/30) i klassifiseringen av Mapepoxy BI?", "a": "W(1): kan injiseres i riss fra 0,1 mm. (5/30): brukstemperatur fra +5 til +30 °C."}], "tall": [{"id": "t14-2", "q": "Mapefer og Redisit: to strøk, totalt ____, rett etter rensing. Aldri sammen med galvanisk KB.", "a": "2 mm", "hel": "Mapefer og Redisit: to strøk, totalt 2 mm, rett etter rensing. Aldri sammen med galvanisk KB."}, {"id": "t14-5", "q": "Elastiske belegg (Cem Elastic, Mapelastic Smart) krever minst ____ for å bygge over riss.", "a": "2 mm", "hel": "Elastiske belegg (Cem Elastic, Mapelastic Smart) krever minst 2 mm for å bygge over riss."}]}, {"nr": 15, "tittel": "Mapei-systemer steg for steg", "mal": ["Bygge opp et komplett reparasjonssystem lag for lag", "Koble hvert lag til et prinsipp i EN 1504-9", "Velge riktig system for bru, kai, søyle, balkong og dekke", "Unngå de vanligste feilene i overgangene mellom produktene"], "punkter": ["Et system er lag som virker sammen. Svikt skjer oftest i overgangene: ventetid, fukt og herding.", "Bærende reparasjon: Redisit → Redirep 45 RSF → sparkel → primer → maling.", "Kantdrager: Mapepoxy L vått-i-vått med Confix, deretter Cem Elastic.", "Galvanisk KB: ingen korrosjonsbeskyttelse på stålet, sementbasert mørtel, kontinuitet ≤ 1 ohm.", "FRP: underlaget over 1,5 MPa, lim innen brukstid, riktig produkt for temperaturen.", "Dekker: fukt under primeren er fienden.", "Offshore: T60 på mettet, overflatetørt underlag; Mapepoxy LR når tiden er lang; Mapeprimer M + Mapecoat CFS bare når fukt, RF og duggpunkt er innenfor."], "kort": [{"id": "15-1", "q": "Hvorfor legges Confix «vått-i-vått» på Mapepoxy L?", "a": "For å få monolittisk heft: den ferske mørtelen må binde i limet mens det fortsatt er klebrig (innenfor åpentiden). Har limet herdet, blir det et slippsjikt."}, {"id": "15-2", "q": "Hvilke to ting må være på plass før Mapeshield E kobles til?", "a": "Minst to tilkoblinger per element loddet/festet til armeringen, og dokumentert elektrisk kontinuitet i armeringen (maks 1 ohm)."}, {"id": "15-3", "q": "Nevn tre feil som ødelegger et galvanisk KB-system.", "a": "Korrosjonsbeskyttelse (Mapefer/Redisit) på armeringen, epoksy- eller PU-mørtel, mørtel med stålfiber eller med resistivitet utenfor 50–200 % av gammel betong, og manglende kontinuitet."}, {"id": "15-4", "q": "Hvilke prinsipper i EN 1504-9 dekker Cem Elastic?", "a": "1 (beskyttelse mot inntrengning), 2 (fuktkontroll) og 8 (økt resistivitet)."}, {"id": "15-5", "q": "Hvilke krav stiller Purtop 400 M-systemet til betongdekket?", "a": "Trykkfasthet ≥ 25 MPa, avtrekksfasthet ≥ 1,5 MPa og maks ca. 4 % fukt (ellers fuktprimer)."}, {"id": "15-6", "q": "I hvilken rekkefølge bygges MapeWrap C-systemet opp?", "a": "Primer 1 → MapeWrap 11 (avretting, vått-i-vått) → MapeWrap 31 → vev → MapeWrap 31."}, {"id": "15-7", "q": "Du skal lime en påstøp offshore, og utstøpingen tar ca. 2 timer ved +20 °C. Mapepoxy L eller LR?", "a": "LR. Åpentiden ved +20 °C er ca. 180 min for LR mot 70 min for L. Med L ville limet ha herdet for langt før betongen kom på."}, {"id": "15-8", "q": "Hvilke klimakrav må være oppfylt før Mapecoat CFS legges?", "a": "Underlaget maks 4 % fukt og uten oppstigende fukt, RF maks 80 %, underlaget minst 3 °C over duggpunktet (og minst +5 °C). Belegget skal legges 6–24 timer etter Mapeprimer M og beskyttes mot vann i 24 timer."}, {"id": "15-9", "q": "Hva betyr «mettet, overflatetørt» underlag for Mapegrout T60, og hvorfor?", "a": "Betongen vannmettes slik at den ikke suger vann ut av mørtelen, men fritt vann på overflaten fjernes (trykkluft) så det ikke blir et svakt, vannrikt sjikt i heftsonen."}, {"id": "15-10", "q": "Hvorfor holder ikke hydrofobering alene på en kantdrager med høyt kloridinnhold ved armeringen?", "a": "Silanet bremser ny inntrengning av vann og klorider, men korrosjonen som allerede er i gang fortsetter så lenge det er nok fukt. Kloridbelastet betong må fjernes, eller armeringen må beskyttes elektrokjemisk."}], "tall": [{"id": "t15-4", "q": "Galvanisk KB: ingen korrosjonsbeskyttelse på stålet, sementbasert mørtel, kontinuitet ≤ ____.", "a": "1 ohm", "hel": "Galvanisk KB: ingen korrosjonsbeskyttelse på stålet, sementbasert mørtel, kontinuitet ≤ 1 ohm."}, {"id": "t15-5", "q": "FRP: underlaget over ____, lim innen brukstid, riktig produkt for temperaturen.", "a": "1,5 MPa", "hel": "FRP: underlaget over 1,5 MPa, lim innen brukstid, riktig produkt for temperaturen."}]}, {"nr": 16, "tittel": "Kvalitetskontroll, dokumentasjon og HMS", "mal": ["Lage og følge en kontrollplan", "Føre klimalogg og avvik", "Levere komplett sluttdokumentasjon", "Kjenne HMS- og miljøkravene i faget"], "punkter": ["Kontroller hvert skjulte trinn før det dekkes til.", "Klimalogg (luft, underlag, RF, duggpunkt) hindrer de fleste produktfeil.", "Avvik meldes og avklares før arbeidet fortsetter.", "Vann fra vannmeisling har høy pH og må samles og renses før utslipp."], "kort": [{"id": "16-1", "q": "Nevn fem ting som bør stå i sluttdokumentasjonen.", "a": "Som utført-kart, kontrollskjemaer, klimalogger, testresultater, produktdokumentasjon og batchnumre, foto, FDV."}, {"id": "16-2", "q": "Hvorfor er klimalogg så viktig?", "a": "Fordi mange produktfeil skyldes arbeid utenfor produktets grenser for temperatur, fukt og duggpunkt."}, {"id": "16-3", "q": "Hva gjør du hvis mengden skade er dobbelt så stor som beskrevet?", "a": "Stanser, dokumenterer og melder avvik til byggherre/rådgiver, og avklarer før du fortsetter."}, {"id": "16-4", "q": "Hvilket vern trengs ved pigging og blåsing?", "a": "Støvreduksjon/avsug og P3-åndedrettsvern, hørselvern, vernebriller, og vibrasjonsdempet verktøy."}], "tall": []}, {"nr": 17, "tittel": "Kontrakt, beskrivelse og måleregler", "mal": ["Forstå hvordan beskrivelser og måleregler fordeler risiko", "Kjenne typiske måleenheter for rehabiliteringsarbeid", "Kalkulere med realistiske påslag"], "punkter": ["Bruk enhetspriser med regulering etter oppmålte mengder.", "Mål og dokumenter felles før mørtling.", "Pris injeksjonsmateriale separat. Forbruket varierer mye."], "kort": [{"id": "17-1", "q": "Når må oppmåling av et reparasjonsfelt gjøres?", "a": "Før mørtling, gjerne felles og med bilder og signatur."}, {"id": "17-2", "q": "Hvorfor er små, spredte felt dyrere per m²?", "a": "Rigg, tilkomst, oppstart og herding koster det samme uansett størrelse."}, {"id": "17-3", "q": "Hvilken håndbok har Statens vegvesen brukt for beskrivelser på bruer og kaier?", "a": "R762 Prosesskode 2 (hovedprosess 8), fra 2025 slått sammen med R761."}], "tall": []}, {"nr": 18, "tittel": "Caser – fra funn til ferdig reparasjon", "mal": [], "punkter": [], "kort": [], "tall": []}, {"nr": 19, "tittel": "Fordypning: korrosjon, hastighet og levetid", "mal": ["Forklare hvorfor lite tæring er nok til å sprenge overdekningen", "Kjenne igjen situasjoner med «svart rust» uten synlige skader", "Regne om korrosjonsstrøm til tæring og tolke LPR-målinger", "Bruke Ficks 2. lov og kjenne fallgruvene i levetidsberegninger", "Forklare risikoen for hydrogensprøhet i spennarmering"], "punkter": ["Rust tar mange ganger større volum enn stålet. Riss kan komme allerede under 0,1 mm tæring.", "I vannmettet, oksygenfattig betong kan stålet tæres kraftig uten riss – «svart rust».", "1 µA/cm² ≈ 11,6 µm/år. LPR-målinger er nøyaktige innen omtrent en faktor 2.", "Kloridterskelen avhenger av sementtype, fukt og oksygen. Lav risiko under ca. 0,4 % og høy over ca. 1 % av sementvekt i luftet betong.", "Dapp avtar med alderen. Se bort fra de ytterste millimeterne og ta prøver i flere høyder.", "Groptæring på spennstål kan gi hydrogensprøhet. Galvanisk KB foretrekkes på spennarmering."], "kort": [{"id": "19-1", "q": "Målt korrosjonshastighet er 0,3 µA/cm². Hvor mye jevn tæring gir det på 15 år?", "a": "0,3 × 11,6 ≈ 3,5 µm/år, altså ca. 52 µm (0,05 mm) på 15 år. Det er nok til å gi riss i mange tilfeller."}, {"id": "19-2", "q": "Hvorfor kan armering under en lekk membran være kraftig korrodert uten riss?", "a": "Lite oksygen gjør at jernet blir værende i oppløsning i stedet for å danne ekspansiv rust («svart rust»). Da oppstår ikke sprengtrykket som gir riss."}, {"id": "19-3", "q": "Hvorfor ser man ofte bort fra de første 5–10 mm i en kloridprofil?", "a": "Overflatesonen påvirkes av utvasking, kapillærsug og avdamping, ikke bare diffusjon. Den forstyrrer tilpasningen til Ficks lov."}, {"id": "19-4", "q": "Hvorfor gir kloridprofiler tatt de første årene ofte for pessimistisk prognose?", "a": "Den tilsynelatende diffusjonskoeffisienten avtar med alderen, særlig for betong med flygeaske og slagg. Tidlige målinger gir for høy D."}, {"id": "19-5", "q": "Nevn to situasjoner der hydrogen kan dannes på spennstål.", "a": "Inne i korrosjonsgroper i kloridholdig betong (lav pH), og ved for negativ polarisering fra KB, vagabonderende strøm eller elektrokjemiske behandlinger med høy spenning."}], "tall": [{"id": "t19-1", "q": "Rust tar mange ganger større volum enn stålet. Riss kan komme allerede under ____ tæring.", "a": "0,1 mm", "hel": "Rust tar mange ganger større volum enn stålet. Riss kan komme allerede under 0,1 mm tæring."}, {"id": "t19-3", "q": "1 µA/cm² ≈ ____/år. LPR-målinger er nøyaktige innen omtrent en faktor 2.", "a": "11,6 µm", "hel": "1 µA/cm² ≈ 11,6 µm/år. LPR-målinger er nøyaktige innen omtrent en faktor 2."}, {"id": "t19-4", "q": "Kloridterskelen avhenger av sementtype, fukt og oksygen. Lav risiko under ca. ____ og høy over ca. 1 % av sementvekt i luftet betong.", "a": "0,4 %", "hel": "Kloridterskelen avhenger av sementtype, fukt og oksygen. Lav risiko under ca. 0,4 % og høy over ca. 1 % av sementvekt i luftet betong."}]}, {"nr": 20, "tittel": "Fordypning: tiltak som virker – og tiltak som ikke gjør det", "mal": ["Forklare de vanligste årsakene til at reparasjoner svikter", "Vurdere realistisk hva belegg, silan og membraner kan oppnå", "Vurdere bruk av inhibitorer kritisk", "Velge mellom typer galvaniske anoder og korrosjonsbestandig armering", "Planlegge monitorering og bruke en beslutningsflyt for metodevalg"], "punkter": ["Ringanoder, lastomfordeling, undervurderte mengder og manglende herding er vanlige årsaker til svikt.", "Belegg kan kontrollere karbonatiseringskorrosjon, men stopper ikke kloridkorrosjon som har startet.", "Innblandet kalsiumnitritt har god dokumentasjon. Inhibitorer påført herdnet betong har svak feltdokumentasjon.", "Galvaniske anoder er enkle, men har begrenset strøm og levetid og må overvåkes for å oppfylle ISO 12696.", "Rustfritt stål kan blandes trygt med vanlig armering og brukes selektivt i utsatte soner.", "Kontinuitet, kortslutninger, isolerende lag, AKR, spennarmering og strømforsyning må avklares før elektrokjemiske tiltak."], "kort": [{"id": "20-1", "q": "Hvorfor kan KB bli billigere enn tradisjonell reparasjon på en kloridskadet viadukt?", "a": "Fullstendig fjerning av forurenset betong krever ofte avstivning og omfattende arbeid. KB krever bare reparasjon av løs betong og stopper korrosjonen over hele flaten."}, {"id": "20-2", "q": "Hvorfor stopper ikke et tett belegg kloridkorrosjon som har startet?", "a": "Det er nok fukt og oksygen i porene. Kloridsaltene trekker til seg fukt, og korrosjonen går fortsatt ved den fuktigheten som er vanlig i norsk klima."}, {"id": "20-3", "q": "Hva er risikoen ved underdosering av inhibitor?", "a": "Små, svært aktive anoder med groptæring."}, {"id": "20-4", "q": "Kan rustfritt stål brukes sammen med vanlig armering ved reparasjon?", "a": "Ja. Rustfritt stål er en dårlig katode og øker korrosjonen på karbonstål mindre enn passivt karbonstål gjør. Det kan dessuten begrense ringanodeeffekten."}, {"id": "20-5", "q": "Hva viser en galvanisk «stigeprobe»?", "a": "Når fronten av klorid eller karbonatisering når hver elektrode i ulike dybder. Den gir varsel før fronten når armeringen."}, {"id": "20-6", "q": "Nevn fire forutsetninger som må sjekkes før KB.", "a": "Elektrisk kontinuitet, ingen kortslutninger, ingen isolerende lag, risiko for spennarmering/AKR, strømforsyning og en organisasjon for drift."}], "tall": []}];
const MCQ = {"1": [{"id": "m1-1", "q": "Hvorfor kommer en skade ofte tilbake etter at en avskalling er reparert?", "rett": "Skadeårsaken virker fortsatt", "feil": ["Reparasjonsmørtelen er alltid svakere enn betongen", "Det ble brukt for lite primer", "Avskallinger kan ikke repareres"], "forkl": "En reparasjon som bare fjerner symptomet, holder ikke. Karbonatisering eller klorider fortsetter å virke."}, {"id": "m1-2", "q": "Hva er riktig rekkefølge i rehabiliteringsprosessen?", "rett": "Tilstandsanalyse → strategi → prosjektering → utførelse → bruksfase", "feil": ["Strategi → tilstandsanalyse → prosjektering → utførelse → bruksfase", "Tilstandsanalyse → prosjektering → utførelse → strategi → bruksfase", "Prosjektering → tilstandsanalyse → strategi → utførelse → bruksfase"], "forkl": "Først må du vite hva som er galt, så velger du strategi, prosjekterer og utfører."}, {"id": "m1-3", "q": "Hva er den vanligste skadeårsaken på betong i Norge?", "rett": "Armeringskorrosjon fra karbonatisering eller klorider", "feil": ["Alkalireaksjoner (AKR) mellom tilslag og sement", "Frostskader fra gjentatt frysing og tining med salt", "Sulfatangrep fra grunnvann, jord og avløpsvann"], "forkl": "Korrosjon av armeringen er klart vanligst."}, {"id": "m1-4", "q": "Hvilken del av NS-EN 1504 gir prinsippene for reparasjon?", "rett": "Del 9", "feil": ["Del 3", "Del 5", "Del 10"], "forkl": "Del 9 gir prinsippene, del 10 utførelse og kontroll. Del 3 gjelder mørtel og del 5 injeksjon."}, {"id": "m1-5", "q": "Hvilke tre ting skal tilstandsanalysen kartlegge?", "rett": "Skadeårsak, skadeomfang og skadekonsekvens", "feil": ["Skadeomfang, kostnadsoverslag og tidsplan for jobben", "Skadetype, produktvalg og nødvendig mengde mørtel", "Skadeårsak, garantitid og hvem som skal utføre"], "forkl": "Årsak, omfang og konsekvens – gjerne også utvikling/prognose."}, {"id": "m1-6", "q": "Hva er hensikten med et prøvefelt?", "rett": "Teste metode, mengder og produkter under de faktiske forholdene", "feil": ["Vise byggherren ferdig farge og overflate før kontrakten signeres", "Erstatte tilstandsanalysen på mindre konstruksjoner uten prøver", "Måle trykkfastheten i den eksisterende betongen før pigging starter"], "forkl": "Prøvefeltet avdekker problemer før hele jobben settes i gang."}, {"id": "m1-7", "q": "Hvilke kurs gir normalt grunnlag for kompetansebevis i betongrehabilitering?", "rett": "R-kurset sammen med U1, pluss dokumentert praksis", "feil": ["Fagbrev i betongfaget og minst fem års praksis", "U3-kurset alene, uten krav til dokumentert praksis", "Epoksykurs og varme arbeider sammen med fagbrev"], "forkl": "R-kurset (rehabilitering) og U1 (praktisk betongteknologi) pluss praksis."}], "2": [{"id": "m2-1", "q": "Hva er normal pH i porevæsken i ny betong med portlandsement?", "rett": "Ca. 13–14", "feil": ["Ca. 7", "Ca. 9", "Ca. 11"], "forkl": "Porevæsken er sterkt basisk, og stålet får en passivfilm. Slagg, flygeaske og silika gir litt lavere pH."}, {"id": "m2-2", "q": "Hva slags korrosjon gir klorider typisk?", "rett": "Lokal groptæring", "feil": ["Jevn korrosjon over hele stålet", "Ingen korrosjon før betongen er karbonatisert", "Bare overflaterust uten tverrsnittstap"], "forkl": "Klorider gir lokale angrep som kan gi stort tverrsnittstap uten store synlige tegn. Karbonatisering gir jevnere korrosjon."}, {"id": "m2-3", "q": "Hva trengs for en korrosjonscelle (i tillegg til oksygen)?", "rett": "Anode, katode, elektrisk forbindelse og elektrolytt", "feil": ["Anode, katode, karbonatiseringsfront og høyt kloridinnhold", "Klorider, CO₂, riss i overdekningen og lav overdekning", "Elektrolytt, frost, rissvidde over 0,3 mm og høy temperatur"], "forkl": "Stålet er den elektriske forbindelsen og fuktig betong elektrolytten."}, {"id": "m2-4", "q": "Hvor mye lengre blir initieringstiden omtrent ved dobbel overdekning?", "rett": "Ca. fire ganger", "feil": ["Ca. dobbelt", "Ca. 1,5 ganger", "Ca. ti ganger"], "forkl": "Fronten går med √t, så dobbel dybde gir omtrent fire ganger tiden."}, {"id": "m2-5", "q": "Hvorfor sprekker overdekningen når armeringen ruster?", "rett": "Rustproduktene har større volum enn stålet", "feil": ["Stålet krymper og trekker betongen med seg", "Rusten løser opp sementen", "Rust gjør betongen varmere"], "forkl": "Ekspansjonen gir sprengtrykk som gir riss og avskalling."}, {"id": "m2-6", "q": "Hvorfor trenger CO₂ nesten ikke inn i vannmettet betong?", "rett": "Gasser diffunderer ca. 10 000 ganger langsommere i vann", "feil": ["Vannet i porene nøytraliserer CO₂ med en gang", "Vannmettet betong har lukkede porer uten forbindelse", "CO₂ omdannes til karbonat i vannet før den når stålet"], "forkl": "Når porene er fulle av vann, stopper gasstransporten nesten helt."}, {"id": "m2-7", "q": "Hvorfor går klorider raskest inn i betong som veksler mellom vått og tørt?", "rett": "Tørr overflate suger saltvann inn ved kapillærsug", "feil": ["Diffusjon går raskest når betongen er tørr og porene åpne", "Kloridene fordamper med vannet og trekkes innover i porene", "Uttørkingen gir riss som kloridene renner rett inn gjennom"], "forkl": "Kapillærsug er mye raskere enn diffusjon, som er hovedmekanismen i vannmettet betong."}, {"id": "m2-8", "q": "Hva skjer i initieringsfasen?", "rett": "CO₂ eller klorider vandrer inn mot armeringen, uten synlige skader", "feil": ["Armeringen ruster, og det kommer riss langs stengene i overdekningen", "Betongen herder videre og får full fasthet etter omtrent 28 døgn", "Rusten sprenger overdekningen, og betongen skaller av i flak"], "forkl": "Initieringsfasen varer til passivfilmen brytes. Først da starter propageringsfasen."}], "3": [{"id": "m3-1", "q": "En konstruksjon er 36 år og har 18 mm karbonatiseringsdybde. Hva er k?", "rett": "3,0 mm/√år", "feil": ["0,5 mm/√år", "6,0 mm/√år", "18 mm/√år"], "forkl": "k = x/√t = 18/√36 = 18/6 = 3,0."}, {"id": "m3-2", "q": "En konstruksjon har k = 3,0 mm/√år. Ved hvilken alder når fronten 30 mm?", "rett": "Ved ca. 100 års alder", "feil": ["Ved ca. 10 års alder", "Ved ca. 30 års alder", "Ved ca. 300 års alder"], "forkl": "t = (x/k)² = (30/3)² = 100 år. Er konstruksjonen 36 år i dag, er det ca. 64 år igjen."}, {"id": "m3-3", "q": "Ved hvilken relativ fuktighet går karbonatiseringen raskest?", "rett": "Ca. 60–70 % RF", "feil": ["Ca. 20 % RF", "Ca. 95–100 % RF", "Den er uavhengig av fukt"], "forkl": "Porene er delvis tørre (CO₂ slipper inn), men det er nok vann til reaksjonen."}, {"id": "m3-4", "q": "Hva er et vanlig anslag for kritisk kloridinnhold?", "rett": "Ca. 0,4 % av sementvekt", "feil": ["Ca. 4 % av sementvekt", "Ca. 0,004 % av sementvekt", "Ca. 0,4 % av betongvekt"], "forkl": "0,4 % av sementvekt tilsvarer ca. 0,05–0,07 % av betongvekt, men terskelen varierer."}, {"id": "m3-5", "q": "Hva er ringanodeeffekten?", "rett": "Ny korrosjon rundt en reparert lapp", "feil": ["At KB-anoden får form av en ring", "Riss i ringform rundt en søyle", "At reparasjonsmørtelen krymper i ring"], "forkl": "Stålet utenfor den passive lappen blir anode og korroderer."}, {"id": "m3-6", "q": "Bremser hydrofobering karbonatisering?", "rett": "Nei, porene er fortsatt åpne for CO₂", "feil": ["Ja, den stopper all CO₂", "Ja, men bare på vegger", "Bare hvis den legges i fem strøk"], "forkl": "Mot karbonatisering trengs belegg med høy CO₂-motstand."}, {"id": "m3-7", "q": "Hvordan påviser du AKR sikkert?", "rett": "Plan- eller tynnslip av borkjerner", "feil": ["Fenolftalein på fersk bruddflate", "Potensialkartlegging over hele flaten", "Bankeprøve og måling av rissvidder"], "forkl": "Mikroskopi viser alkaligel og typisk rissmønster."}, {"id": "m3-8", "q": "Hvilket rissmønster er typisk for AKR?", "rett": "Kartmønsterriss", "feil": ["Rette riss langs armeringen", "Ett enkelt horisontalt riss", "Ingen riss, bare misfarging"], "forkl": "AKR bremses best ved å holde betongen tørr."}, {"id": "m3-9", "q": "Hvor mye av porene må omtrent være vannfylt før få frostsykluser kan gi skade?", "rett": "Over ca. 80–90 %", "feil": ["Over ca. 20 %", "Over ca. 50 %", "100 % – ellers skjer ingenting"], "forkl": "Kritisk metningsgrad. Drenering og hydrofobering holder metningen under grensen."}, {"id": "m3-10", "q": "Hvorfor var sement med lavt C₃A dårlig for mange marine konstruksjoner?", "rett": "Den binder klorider dårlig", "feil": ["Den tåler sulfat dårlig i sjøvann", "Den herder for sakte i kaldt sjøvann", "Den gir mer AKR i marint miljø"], "forkl": "Sulfatbestandig sement er ikke automatisk kloridbestandig."}], "4": [{"id": "m4-1", "q": "Hva viser fenolftalein på en fersk bruddflate når den blir rødlilla?", "rett": "Betongen er ikke karbonatisert (pH over ca. 9)", "feil": ["Betongen er karbonatisert (pH under ca. 9)", "Betongen har klorider over kritisk grense", "Armeringen bak flaten korroderer aktivt"], "forkl": "Fargeløs = karbonatisert, rødlilla = ikke karbonatisert."}, {"id": "m4-2", "q": "Hvorfor skal fenolftalein ikke sprayes på en saget flate?", "rett": "Sagestøv smører alkalisk materiale utover og gir feil", "feil": ["Indikatoren virker bare på våte, nyborede flater", "Sagingen varmer opp flaten og endrer fargen", "Kjølevannet fra sagen vasker ut karbonatiseringen"], "forkl": "Bruk en fersk bruddflate."}, {"id": "m4-3", "q": "Hva forteller potensialkartlegging?", "rett": "Sannsynlighet for korrosjon, ikke hastighet", "feil": ["Nøyaktig hvor fort armeringen korroderer", "Kloridinnholdet ved armeringsdybde", "Hvor dypt karbonatiseringen har gått"], "forkl": "Se på gradienter og bekreft med åpninger."}, {"id": "m4-4", "q": "Potensialet er −400 mV mot Cu/CuSO₄. Hva er riktig tolkning?", "rett": "Høy sannsynlighet for korrosjon, men det må bekreftes", "feil": ["Stålet korroderer garantert og må repareres straks", "Stålet er passivt fordi verdien er under −500 mV", "Målingen er ugyldig fordi den er mer negativ enn 0"], "forkl": "Fukt, oksygen og belegg påvirker. Bekreft med åpning."}, {"id": "m4-5", "q": "Hva forteller lav resistivitet (under 10 kΩ·cm)?", "rett": "Fuktig og/eller kloridholdig betong som leder godt", "feil": jø/estetikk."}, {"id": "m5-4", "q": "Hva skal skje ved konsekvensgrad 4?", "rett": "Forvalter varsles umiddelbart, og varslingen dokumenteres", "feil": ["Skaden registreres og følges opp ved neste hovedinspeksjon", "Tiltak registreres i Brutus og inspeksjonsintervall vurderes", "Skaden kontrolleres på nytt innen ett år før noe gjøres"], "forkl": "Konsekvensgrad 4 krever umiddelbar varsling."}, {"id": "m5-5", "q": "Hvilken skadetypekode har avskalling?", "rett": "35", "feil": ["36", "14", "53"], "forkl": "35 Avskalling, 36 Armeringskorrosjon."}, {"id": "m5-6", "q": "Hvilken kode har karbonatisering?", "rett": "53", "feil": ["52", "35", "17"], "forkl": "52 Kloridangrep, 53 Karbonatisering (under 50 Miljøangrep)."}, {"id": "m5-7", "q": "Hvordan kodes riss og lekkasje?", "rett": "14 og 17 – materialuavhengige typer", "feil": ["35 og 36 – under betong", "52 og 53 – miljøangrep", "53 og 54 – årsakskoder"], "forkl": "Riss/sprekk 14 og Lekkasje/fuktbelastning 17."}, {"id": "m5-8", "q": "Kan en middels skade ha konsekvensgrad 4?", "rett": "Ja, f.eks. løse biter over en gangveg", "feil": ["Nei, skadegrad og konsekvensgrad må være like", "Bare på bruer over 100 m", "Bare hvis skadegraden er 4"], "forkl": "Skadegrad og konsekvensgrad vurderes hver for seg."}], "6": [{"id": "m6-1", "q": "Hvilke prinsipper i NS-EN 1504-9 gjelder armeringskorrosjon?", "rett": "7–11", "feil": ["1–6", "1–3", "12–15"], "forkl": "1–6 gjelder betongen, 7–11 armeringskorrosjon."}, {"id": "m6-2", "q": "Hvilket prinsipp er katodisk beskyttelse?", "rett": "Prinsipp 10", "feil": ["Prinsipp 7", "Prinsipp 1", "Prinsipp 3"], "forkl": "Prinsipp 7 (gjenopprette passivitet) og 10 (KB) er de viktigste ved korrosjon."}, {"id": "m6-3", "q": "Hvilken del av EN 1504 stiller krav til reparasjonsmørtel?", "rett": "Del 3", "feil": ["Del 2", "Del 5", "Del 9"], "forkl": "Del 2 overflatebeskyttelse, del 5 injeksjon, del 9 prinsipper."}, {"id": "m6-4", "q": "Hva er en fullstendig reparasjon?", "rett": "All karbonatisert/kloridholdig betong rundt stålet fjernes", "feil": ["Bare løs og oppsprukket betong fjernes og erstattes med ny mørtel", "Overflaten hydrofoberes etter at alle riss er injisert med epoksy", "All synlig rust males med epoksy før feltet sparkles og males"], "forkl": "Forenklet reparasjon fjerner bare løs betong."}, {"id": "m6-5", "q": "Hvorfor må du vite om KB kommer senere før du velger mørtel?", "rett": "Isolerende mørtel eller epoksy på stålet stopper strømmen", "feil": ["KB krever en spesiell mørtel med høyt kloridinnhold for å lede strøm", "KB virker bare når armeringen er malt med epoksy før mørtling", "KB krever at mørtelen er av klasse R1 for at strømmen skal gå"], "forkl": "KB krever elektrisk kontakt mellom stål og mørtel."}, {"id": "m6-6", "q": "Når er KB ofte billigere enn tradisjonell reparasjon?", "rett": "Ved utbredte, dype kloridskader", "feil": ["Ved én liten avskalling", "Ved karbonatisering på 5 mm", "Ved estetiske misfarginger"], "forkl": "Å fjerne all forurenset betong blir svært dyrt når skadene er dype og spredte."}, {"id": "m6-7", "q": "Hvorfor kan et tett belegg ikke stoppe korrosjonen ved å stenge ute oksygen?", "rett": "Litt oksygen kommer alltid inn, og ikke alle sider kan belegges", "feil": ["Belegget slipper ut CO₂ og senker dermed pH-en i betongen bak", "Korrosjon trenger ikke oksygen når det først er klorider ved stålet", "Belegget løses opp av den høye pH-en i betongen etter noen år"], "forkl": "Katodeprosessen kan ikke stoppes pålitelig med belegg på konstruksjoner i luft."}, {"id": "m6-8", "q": "Hvilken metode hører IKKE til prinsipp 7?", "rett": "Hydrofobering", "feil": ["Økt overdekning", "Elektrokjemisk realkalisering", "Kloriduttrekk"], "forkl": "Hydrofobering hører til prinsipp 1, 2 og 8 (beskyttelse mot inntrengning, fuktkontroll, økt resistivitet)."}], "7": [{"id": "m7-1", "q": "Hvorfor er vannmeisling ofte bedre enn tung pigging?", "rett": "Den er selektiv og gir ikke mikroriss", "feil": ["Den er alltid billigst per m²", "Den trenger ikke oppsamling av vann", "Den gir glatt flate og god heft"], "forkl": "Den gir også en ru heftflate, men alkalisk vann må håndteres."}, {"id": "m7-2", "q": "Hvor mye fritt rom bak armeringen er typisk?", "rett": "15–20 mm", "feil": ["2–3 mm", "50–60 mm", "Ingen – mørtelen skal bare dekke forsiden"], "forkl": "Mørtelen må kunne omslutte stålet."}, {"id": "m7-3", "q": "Hvorfor skal mørtel ikke fjæres ut mot null i kanten?", "rett": "Den tynne kanten sprekker og løsner", "feil": ["Mørtelen krymper mer i kanten", "Det bruker for mye mørtel per m²", "Det gir for høy heft og spenninger"], "forkl": "Kanten skal være rett og ha en minste dybde."}, {"id": "m7-4", "q": "Hva betyr «vannmettet, overflatetørt»?", "rett": "Porene er fulle av vann, men flaten har ikke vannfilm", "feil": ["Flaten har en tynn vannfilm som gir bedre heft for mørtelen", "Betongen er tørket helt ut før mørtelen legges på flaten", "Bare de øverste millimeterne er fuktet med kost rett før"], "forkl": "Flaten er mørk og matt."}, {"id": "m7-5", "q": "Hvilken rensegrad kreves ofte for armering?", "rett": "Sa 2½ (ISO 8501-1)", "feil": ["St 2 (stålbørste)", "Sa 1 (lett blåsing)", "St 3 (maskinbørste)"], "forkl": "Eller det produktdatabladet angir."}, {"id": "m7-6", "q": "Når skal armeringen IKKE males med epoksy?", "rett": "Når KB eller elektrokjemiske metoder skal brukes", "feil": ["Når reparasjonsmørtelen er av klasse R4 eller sterkere", "Når arbeidet gjøres i tørre innerom uten klorider", "Når temperaturen på stålet er under +10 °C"], "forkl": "Stålet må ha elektrisk kontakt med mørtelen."}, {"id": "m7-7", "q": "Hvilke krav har en R4-mørtel?", "rett": "≥ 45 MPa trykk og ≥ 2,0 MPa heft", "feil": ["≥ 25 MPa trykk og ≥ 1,5 MPa heft", "≥ 15 MPa trykk og ≥ 0,8 MPa heft", "≥ 60 MPa trykk og ≥ 3,0 MPa heft"], "forkl": "R3: ≥ 25 MPa og ≥ 1,5 MPa."}, {"id": "m7-8", "q": "Hvor langt skal du fjerne betong langs korrodert armering?", "rett": "Til du finner rent stål", "feil": ["Bare der betongen er løs", "Alltid : ["For tykke lag i ett strøk", "Tørt eller støvete underlag", "For lite fjernet bak armeringen"], "forkl": "Herding etter databladet er riktig praksis."}], "9": [{"id": "m9-1", "q": "Hva stopper hydrofobering?", "rett": "Vann og klorider, men ikke CO₂", "feil": ["CO₂, men ikke vann", "Alt – vann, klorider og CO₂", "Bare frost"], "forkl": "Porene forblir åpne for gass."}, {"id": "m9-2", "q": "Hvilken sd,CO₂ skal et belegg mot karbonatisering ha?", "rett": "Over 50 m", "feil": ["Over 0,5 m", "Over 5 m", "Under 1 m"], "forkl": "Høy CO₂-motstand (sd > 50 m)."}, {"id": "m9-3", "q": "Hvor mye over duggpunktet skal underlaget være ved maling?", "rett": "Minst 3 °C", "feil": ["Minst 0,5 °C", "Minst 10 °C", "Under duggpunktet"], "forkl": "Duggpunktsregelen."}, {"id": "m9-4", "q": "Hva avgjør levetiden til en hydrofobering?", "rett": "Inntrengningsdybden", "feil": ["Fargen", "Glansgraden", "Antall dager før regn"], "forkl": "Underlaget må også være tørt for god inntrengning."}, {"id": "m9-5", "q": "Hvorfor kan tett epoksybelegg være feil på AKR-skadet betong?", "rett": "Det stenger fukten inne, så reaksjonen fortsetter", "feil": ["Epoksy reagerer med alkaligelen og løser seg opp", "Det slipper inn CO₂ som øker AKR-reaksjonen", "Det gjør betongen for tørr til at riss lukker seg"], "forkl": "AKR bremses best ved å la betongen tørke."}, {"id": "m9-6", "q": "Hvilken behandling velger du mot klorider på en kantdrager?", "rett": "Hydrofobering, gjerne silangel for dyp inntrengning", "feil": ["Akrylmaling med høy CO₂-motstand (sd over 50 m)", "Kalkmaling som slipper fukt godt ut av betongen", "Ingen behandling, fordi kantdragere skal tørke"], "forkl": "Eventuelt en sementbasert kloridbremsende membran."}, {"id": "m9-7", "q": "Hva er riktig om tette belegg?", "rett": "God barriere, men stenger fukt inne og fornyes etter 10–15 år", "feil": ["Slipper ut fukt bedre enn åpne løsninger og varer i 50 år", "Stopper kloridkorrosjon som er i gang, uten annen reparasjon", "Brukes bare innendørs fordi de ikke tåler UV og regn"], "forkl": "Utvendige, fuktige konstruksjoner trenger diffusjonsåpne løsninger."}, {"id": "m9-8", "q": "Hvilket er et typisk krav til en god hydrofobering?", "rett": "Inntrengning minst 2 mm (ofte mer i beskrivelser)", "feil": ["Inntrengning under 0,1 mm, slik at porene holdes åpne", "Vannopptak over 80 % av ubehandlet betong etter behandling", "Den skal danne en tett, blank film på hele overflaten"], "forkl": "Også vannopptak under ca. 20 % og uttørking minst 60 % av ubehandlet."}], "10": [{"id": "m10-1", "q": "Et stabilt, tørt riss i en bærende bjelke skal injiseres. Hvilket materiale?", "rett": "Lavviskøs epoksy (klasse F)", "feil": ["PUR-skum (klasse S)", "Elastisk PUR (klasse D)", "Akrylatgel (klasse S)"], "forkl": "Epoksy gir kraftoverføring."}, {"id": "m10-2", "q": "Hvilken EN 1504-5-klasse brukes for riss som beveger seg?", "rett": "Klasse D (duktil fylling)", "feil": ["Klasse F (kraftoverførende)", "Klasse S (svellende fylling)", "Klasse R4 (konstruktiv)"], "forkl": "F = kraftoverførende, D = duktil, S = svellende."}, {"id": "m10-3", "q": "Et riss lekker aktivt vann. Hva gjør du først?", "rett": "Tetter med PUR-skum", "feil": ["Sparkler risset med mørtel", "Maler over med epoksybelegg", "Venter til risset tørker ut"], "forkl": "Eventuelt etterinjisering med elastisk PUR."}, {"id": "m10-4", "q": "Skal riss langs korrodert armering injiseres?", "rett": "Nei, korrosjonen må utbedres", "feil": ["Ja, med epoksy for å binde stålet", "Ja, med PUR-skum for å stoppe vann", "Ja, men bare hvis risset er over 1 mm"], "forkl": "Injeksjon stopper ikke korrosjonen."}, {"id": "m10-5", "q": "Hva er typisk pakkeravstand?", "rett": "Ca. halve tykkelsen av elementet", "feil": ["Ca. dobbel tykkelse av elementet", "Alltid 1 m, uansett tykkelse", "Ca. 5 cm, uansett tykkelse"], "forkl": "Bor skrått, vekselvis fra hver side av risset."}, {"id": "m10-6", "q": "Hvorfor er høyt trykk ikke bedre ved injeksjon?", "rett": "Det kan sprenge betongen og pr   const dom = pst >= 90 ? "Svært bra – dette sitter." : pst >= 70 ? "Bra. Se over de du bommet på." : "Ta flashkortene for kapitlet og prøv igjen om et par dager.";
  app.innerHTML = `<button class="tilbake" id="tilb">← Tilbake</button>
    <div class="kort ferdig"><h1>${p.nr === "alle" ? "Blandet prøve" : p.nr === "galle" ? "Blandet grunnkurs-prøve" : "Prøve " + kapNavn(p.nr)}</h1>
      <div class="tall">${p.riktig}/${p.sp.length}</div><p class="dempet">${pst} % riktig${gml ? ` · beste før: ${gml.best} %` : ""}</p><p>${dom}</p>
      <div class="rad"><button class="sek" id="igjen">Ta prøven igjen</button><button class="hoved" id="tilb2">Ferdig</button></div>
      ${videreLyd(p.nr, pst)}</div>
    ${p.feil.length ? `<h2>Det du bommet på</h2><div id="feilliste"></div>` : ""}`;
  const fl = app.querySelector("#feilliste");
  if (fl) for (const o of p.feil) {

    const q = document.createElement("p"); q.style.fontWeight = "600"; q.textContent = ((p.nr === "alle" || p.nr === "galle") ? `${kapKort(o.kap)}: ` : "") + o.q;

  }

  const vl = app.querySelector("#videre"); if (vl) vl.onclick = () => { const n = vl.dataset.nr; const nn = n[0] === "G" || n === "gi" || n === "hi" ? n : +n; prøve = null; if (KAP[nn]) location.hash = "kap-" + nn; spill(nn); };
  const ig = app.querySelector("#horigjen"); if (ig) ig.onclick = () => { prøve = null; location.hash = "kap-" + nr; spill(nr, true); };

}

// ---------- lydbok ----------
const GREKKE = ["gi", ...GK.map(k => k.nr)], HREKKE = ["hi", ...DATA.map(k => k.nr)];
const lydId = nr => nr === "gi" ? "g00" : nr === "hi" ? "h00" : erG(nr) ? "g" + nr.slice(1).padStart(2, "0") : "h" + String(nr).padStart(2, "0");
const lydFor = nr => LYDID[lydId(nr)];
const navnFor = nr => nr === "gi" ? "Innledning, grunnboka" : nr === "hi" ? "Innledning, hovedboka" : `${kapKort(nr)} · ${KAP[nr].tittel}`;
const min = sek => sek >= 60 ? Math.round(sek / 60) + " min" : Math.round(sek) + " s";
const klokke = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const hort = nr => !!(S.lyd && S.lyd[lydId(nr)] && S.lyd[lydId(nr)].ferdig);
function nesteKap(nr) { for (const r of [GREKKE, HREKKE]) { const i = r.indexOf(nr); if (i >= 0) return r[i + 1] ?? (r === GREKKE ? "hi" : null); } return null; }
function lytteStatus(nr) { const l = S.lyd && S.lyd[lydId(nr)]; if (!l) return ""; if (l.ferdig) return "Du har hørt hele kapitlet."; return l.pos > 5 ? `Du stoppet på ${klokke(l.pos)}.` : ""; }
function fortsettKort() {
  const s = S.sistLyd; if (!s || !lydFor(s.nr) || (s.nr !== "gi" && s.nr !== "hi" && !KAP[s.nr])) return "";
  const l = (S.lyd || {})[lydId(s.nr)] || {}; const ferdig = l.ferdig;
  const nr = ferdig ? nesteKap(s.nr) : s.nr; if (!nr || !lydFor(nr)) return "";
  if (ferdig) S.sistLyd = { nr, t: s.t };
  return `<button class="kap" id="fortsett" style="margin-top:12px"><span class="nr">▶</span><span class="t"><b>Fortsett å lytte</b><br><span class="liten dempet">${esc(navnFor(nr))}</span></span><span class="p">${ferdig ? "neste" : klokke(l.pos)}</span></button>`;
}
function videreLyd(nr, pst) {
  if (nr === "alle" || nr === "galle" || !lydFor(nr)) return "";
  const n = nesteKap(nr);
  if (pst >= 80) return n && lydFor(n) ? `<button class="hoved" id="videre" data-nr="${n}" style="margin-top:10px">▶ Fortsett: ${esc(navnFor(n))}</button>` : "";
  return `<p class="melding">Under 80 %: øv litt mer før du går videre.</p><div class="rad"><button class="sek" id="flash">Øv på flashkortene</button><button class="sek" id="horigjen">Hør kapitlet igjen</button></div>`;

const lyd = new Audio(); lyd.preload = "metadata"; window.__lyd = lyd;
let spiller = { nr: null }, sistLagret = 0;
const mini = document.getElementById("mini"), mpp = document.getElementById("m-pp"), mpos = document.getElementById("m-pos");
function spill(nr, fraStart = false) {
  const l = lydFor(nr); if (!l) return;
  const id = lydId(nr); S.lyd = S.lyd || {};

    spiller = { nr, id }; lyd.src = "lyd/" + id + ".mp3";
    const lagret = S.lyd[id] || {};
    const start = fraStart || lagret.ferdig ? 0 : (lagret.pos || 0);

  } else if (fraStart) lyd.currentTime = 0;
  if (fraStart && S.lyd[id]) S.lyd[id].ferdig = false;
  lyd.playbackRate = S.fart || 1;
  document.getElementById("m-navn").textContent = navnFor(nr);
  mini.hidden = false; document.body.classList.add("har-mini");
  lyd.play().catch(() => {});
  S.sistLyd = { nr, t: nå() }; lagre();
  if (S.visTekst !== false) visTekst();

    navigator.mediaSession.metadata = new MediaMetadata({ title: navnFor(nr), artist: erG(nr) || nr === "gi" ? "Grunnbok i betongrehabilitering" : "Rehabilitering av betongkonstruksjoner" });

    navigator.mediaSession.setActionHandler("seekforward", () => hopp(30));
  } catch (_) {}

function hopp(s) { if (spiller.nr) lyd.currentTime = Math.max(0, Math.min((lyd.duration || 0) - 1, lyd.currentTime + s)); }
function lagrePos(tving) {

  const t = nå(); if (!tving && t - sistLagret < 15000) return; sistLagret = t;
  const id = spiller.id, gml = S.lyd[id] || {};

}
lyd.addEventListener("play", () => { mpp.textContent = "❚❚"; });
lyd.addEventListener("pause", () => { mpp.textContent = "▶"; lagrePos(true); });

});

  else { const n = nesteKap(nr); if (n && KAP[n]) location.hash = "kap-" + n; else { location.hash = ""; hjem(); } }

mf.textContent = String(S.fart || 1).replace(".", ",") + "×";

// ---------- følg teksten ----------
const tv = document.getElementById("tv"), tvt = document.getElementById("tv-tekst"), tvf = document.getElementById("tv-folg");

let brukerRull = 0;
for (const ev of ["touchmove", "wheel", "keydown"]) tvt.addEventListener(ev, () => { brukerRull = Date.now(); }, { passive: true });
tvt.addEventListener("scroll", () => { if (Date.now() - brukerRull > 1200) return; if (folger) { folger = false; tvf.hidden = false; } }, { passive: true });
tvf.onclick = () => { folger = true; tvf.hidden = true; oppdaterTekst(true); };
document.getElementById("tv-lukk").onclick = () => lukkTekst();
document.getElementById("m-tekst").onclick = () => tv.hidden ? visTekst() : lukkTekst();
lyd.addEventListener("timeupdate", () => oppdaterTekst(false));

window.__tekst = { visTekst, lukkTekst, finnAvsnitt, get tilstand() { return { id: tekst.id, aktiv, n: tekst.avsnitt.length, åpen: !tv.hidden }; } };


// ---------- ruting og oppstart ----------
function rute() {
  const m = location.hash.match(/^#kap-(G?\d+)$/);

(async () => {
  try { sample = await claude.use("sample"); } catch (_) { sample = null; }
  try { dikt = await claude.use("dictation"); } catch (_) { dikt = null; }
  try {
    const db = await claude.use("db"), user = await claude.use("user");

      const tidsavbrudd = new Promise(r => setTimeout(() => r(null), 10000));
      const snap = await Promise.race([ref.get(), tidsavbrudd]);
      if (snap) {
        dbRef = ref;
        if (snap.exists) flett(snap.data());

        if (!økt && !prøve) rute();

    }
  } catch (_) {}

}
