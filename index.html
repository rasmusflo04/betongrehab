<style>
/* VOICE: rolig, praktisk treningsverktøy for en fagarbeider – som et kortstokk i lomma på jobb.
   IDEA: inspeksjonskort / flashkort på betongflate – kortet er bildet.
   PICTURE: det store kortet i økta; på forsiden dagens økt som ett stort kort med teller.
   COLOUR and TYPE: betonggrå bakgrunn, mørk skifer tekst, sikkerhetsgul aksent, rustrød for «igjen». Archivo.
   LAYOUT: én kolonne, maks 680px, store knapper for tommel. */
:root{color-scheme:light dark;
 --bg:light-dark(#dcdedb,#16191a);--flate:light-dark(#f4f4f1,#22272a);--ink:light-dark(#1b2226,#e8ebe9);
 --dempet:light-dark(#5b666c,#9aa5aa);--linje:light-dark(#c5c9c5,#343b3f);--gul:#f2c12e;--gul-ink:#1b2226;
 --rust:light-dark(#a4471f,#e07a4f);--gronn:light-dark(#2f7a4b,#5fbf86);--skygge:0 1px 0 rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.35)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
main{max-width:680px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px}
h1{font-size:clamp(26px,6vw,34px);line-height:1.08;margin:0 0 4px;font-weight:800;text-wrap:balance}
h2{font-size:20px;line-height:1.2;margin:28px 0 10px;font-weight:800}
p{margin:0 0 10px}.dempet{color:var(--dempet)}.liten{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:600}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gul);outline-offset:2px}
.hoved{background:var(--gul);color:var(--gul-ink);width:100%;font-size:18px;min-height:56px}
.sek{background:var(--flate);border:1px solid var(--linje)}
.rad{display:flex;gap:10px;flex-wrap:wrap}.rad>*{flex:1 1 0}
.kort{background:var(--flate);border-radius:18px;box-shadow:var(--skygge);padding:22px 20px;position:relative}
.dag{margin:18px 0 8px}.dag .tall{font-size:56px;font-weight:800;line-height:1}
.dag .tall small{font-size:18px;font-weight:600;color:var(--dempet);margin-left:6px}
.statrad{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px;color:var(--dempet);font-size:14px}
.statrad b{color:var(--ink);font-size:16px}
.modus{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.modus button{flex:1;min-height:42px;background:transparent;font-size:15px}.modus button[aria-pressed=true]{background:var(--flate);box-shadow:var(--skygge)}
.kap{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:var(--flate);
 border-radius:12px;padding:12px 14px;margin:0 0 8px;font-weight:500}
.kap .nr{font-weight:800;font-size:18px;color:var(--dempet)}.kap .t{line-height:1.25}.kap .p{font-size:13px;color:var(--dempet);white-space:nowrap}
.bar{grid-column:2/4;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gronn)}
.tilbake{background:none;padding:0;min-height:44px;color:var(--dempet);font-weight:600}
ul.pkt{padding-left:20px;margin:6px 0 0}ul.pkt li{margin-bottom:6px}
details{background:var(--flate);border-radius:12px;padding:12px 14px;margin:10px 0}summary{font-weight:600;cursor:pointer;min-height:28px}
.fremdrift{height:6px;background:var(--flate);border-radius:3px;overflow:hidden;margin:6px 0 14px}.fremdrift i{display:block;height:100%;background:var(--gul);transition:width .3s}
.etikett{font-size:13px;color:var(--dempet);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.spm{font-size:clamp(20px,5vw,24px);line-height:1.3;font-weight:600;margin:0 0 4px;text-wrap:pretty}
.svar{border-top:2px dashed var(--linje);margin-top:18px;padding-top:16px}
.svar .fasit{font-size:17px}
textarea{width:100%;min-height:120px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--linje);border-radius:12px;padding:12px;resize:vertical;margin:14px 0 10px}
.vurd{border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--bg)}
.vurd b{display:block;margin-bottom:4px}.v2{border-left:5px solid var(--gronn)}.v1{border-left:5px solid var(--gul)}.v0{border-left:5px solid var(--rust)}
.karakter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.karakter button{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:16px}
.karakter small{font-weight:500;font-size:12px;opacity:.8}
.igjen{background:var(--rust);color:#fff}.vansk{background:var(--sek,var(--flate));border:1px solid var(--linje)}.kunne{background:var(--gronn);color:#fff}
.mic[aria-pressed=true]{background:var(--rust);color:#fff}
.sporsvar{white-space:pre-wrap;font-size:15px;margin-top:8px}
.melding{font-size:14px;color:var(--dempet);margin:8px 0}
.ferdig .tall{font-size:48px;font-weight:800}
.lytt{display:flex;gap:12px;align-items:center}.lytt .hoved{width:auto;flex:1}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:10px max(12px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.25)}
.mini[hidden]{display:none}.mini .inn{max-width:680px;margin:0 auto}
.mini .topp{display:flex;align-items:center;gap:8px}.mini .navn{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button{background:transparent;color:inherit;min-height:44px;min-width:44px;padding:6px 8px;font-size:15px}
.mini .pp{background:var(--gul);color:var(--gul-ink);border-radius:50%;width:48px;height:48px;font-size:18px}
.mini input[type=range]{width:100%;accent-color:var(--gul);margin:4px 0 0}
.mini .tid{display:flex;justify-content:space-between;font-size:12px;opacity:.75}
body.har-mini main{padding-bottom:150px}
.tv{position:fixed;inset:0;z-index:19;background:var(--bg);display:flex;flex-direction:column}
.tv[hidden]{display:none}
.tv .tvtopp{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(127,127,127,.25)}
.tv .tvtopp b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .tvtopp button{min-height:44px;min-width:44px;font-size:15px}
.tv .tvtekst{flex:1;overflow-y:auto;padding:16px 18px 190px;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box;-webkit-overflow-scrolling:touch}
.tv .tvtekst p{margin:0 0 14px;padding:6px 10px;border-radius:8px;line-height:1.55;font-size:17px;opacity:.55;transition:opacity .25s,background .25s;cursor:pointer}
.tv .tvtekst p.ov{font-weight:700;font-size:18px}
.tv .tvtekst p.les{opacity:1;background:rgba(240,190,40,.38);box-shadow:inset 4px 0 0 var(--gul)}
.tv .tvtekst p.lest{opacity:.8}
.tv .folg{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:21;background:var(--gul);color:var(--gul-ink);border-radius:22px;padding:10px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tv .folg[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
{
const DATA = [{"nr": 1, "tittel": "Rehabiliteringsfaget og prosessen", "mal": ["Forklare hvorfor rehabilitering skiller seg fra nybygging", "Beskrive de fem fasene i et rehabiliteringsprosjekt og hva hver fase leverer", "Kjenne rollene og kompetansekravene (produksjonsleder, kontrolleder, formann/bas)", "Vite hvilke standarder og håndbøker som styrer faget"], "punkter": ["Skadeårsaken virker som regel fortsatt. Fjerner du bare symptomet, kommer skaden tilbake.", "Prosessen går fra tilstandsanalyse til strategi, prosjektering, utførelse og bruksfase – ofte med et prøvefelt underveis.", "Den vanligste skadeårsaken i Norge er armeringskorrosjon, enten fra karbonatisering eller fra klorider.", "NS-EN 1504-serien er hovedregelverket. Del 9 gir prinsippene, og del 10 gjelder utførelse og kontroll."], "kort": [{"id": "1-1", "q": "Hvorfor er det ikke nok å reparere en avskalling for å løse problemet?", "a": "Fordi årsaken, for eksempel karbonatisering eller klorider, fortsatt virker. Stopper du ikke årsaken, kommer skaden tilbake – ofte raskt."}, {"id": "1-2", "q": "Hvilke tre ting skal tilstandsanalysen kartlegge?", "a": "Skadeårsak, skadeomfang og skadekonsekvens. Ofte tar du også med hvordan skaden vil utvikle seg (prognose)."}, {"id": "1-3", "q": "Hva er hensikten med et prøvefelt?", "a": "Du kontrollerer at metode, mengder og produkter fungerer under de faktiske forholdene før hele jobben settes i gang."}, {"id": "1-4", "q": "Hvilken del av NS-EN 1504 beskriver prinsippene for reparasjon?", "a": "Del 9, altså NS-EN 1504-9."}, {"id": "1-5", "q": "Hvilke kurs gir normalt grunnlag for kompetansebevis i betongrehabilitering?", "a": "Typisk R-kurset i betongrehabilitering sammen med U1, praktisk betongteknologi – pluss dokumentert praksis."}], "tall": [{"id": "t1-4", "q": "NS-EN 1504-serien er hovedregelverket; del 9 gir prinsippene og del ____ utførelse og kontroll.", "a": "10", "hel": "NS-EN 1504-serien er hovedregelverket; del 9 gir prinsippene og del 10 utførelse og kontroll."}]}, {"nr": 2, "tittel": "Betong og armering – det du må forstå", "mal": ["Forklare hvorfor stål i betong normalt ikke ruster (passivering)", "Beskrive korrosjonscellen og hvilke fire forutsetninger som må være til stede", "Forklare initierings- og propageringsfasen", "Forstå hvordan v/c-tall, fukt og overdekning styrer bestandigheten"], "punkter": ["Porevæsken har pH 13–14, litt lavere med slagg, flygeaske og silika. Den høye pH-en gir stålet en beskyttende passivfilm.", "Passivfilmen brytes enten av karbonatisering, som senker pH, eller av klorider, som angriper lokalt.", "Korrosjon krever anode, katode, elektrisk forbindelse og elektrolytt – og i tillegg oksygen.", "Dobler du overdekningen, blir initieringstiden omtrent fire ganger så lang.", "Rustproduktene tar større plass enn stålet, og trykket sprenger overdekningen.", "Stoffer transporteres på fire måter: kapillærsug, permeasjon, diffusjon og migrasjon. Fukten avgjør hvilke veier som er åpne.", "Gasser går gjennom luftfylte porer, mens klorider bare går gjennom vannfylte. Veksling mellom vått og tørt gir raskest kloridinntrengning."], "kort": [{"id": "2-1", "q": "Hva er normal pH i porevæsken i ny betong?", "a": "Omtrent 13–14 for portlandsement (målt 13,4–13,9), litt lavere med slagg, flygeaske eller mye silika. Verdien 12,5 gjelder en ren kalsiumhydroksidløsning, ikke porevæsken."}, {"id": "2-2", "q": "Hva er forskjellen på korrosjon fra karbonatisering og fra klorider?", "a": "Karbonatisering senker pH overalt og gir derfor jevn, generell korrosjon. Klorider gir lokal groptæring, som kan gi stort tverrsnittstap uten store synlige tegn."}, {"id": "2-3", "q": "Hvilke fire elementer må til for en korrosjonscelle?", "a": "Anode, katode, elektrisk forbindelse (selve stålet) og elektrolytt (fuktig betong). I tillegg trengs oksygen til katodereaksjonen."}, {"id": "2-4", "q": "Hva skjer i initieringsfasen?", "a": "Karbonatiseringsfronten eller kloridene vandrer inn mot armeringen. Ennå ser du ingen skader – de kommer først når passivfilmen er brutt."}, {"id": "2-5", "q": "Hvorfor er konstruksjoner som veksler mellom vått og tørt mest utsatt?", "a": "Fukten gir ledningsevne og frakter klorider inn, mens uttørkingen slipper til oksygen. Gjentatt fukting og tørking konsentrerer i tillegg kloridene."}, {"id": "2-6", "q": "Hvorfor går klorider raskere inn i en kantdrager som veksler mellom vått og tørt enn i en som alltid er våt?", "a": "Når overflaten har tørket, suger den saltvann inn ved kapillærsug neste gang den blir våt. Det går mye raskere enn diffusjon, som er hovedmekanismen i vannmettet betong."}, {"id": "2-7", "q": "Hvorfor trenger CO₂ nesten ikke inn i vannmettet betong?", "a": "Gasser diffunderer omtrent 10 000 ganger langsommere gjennom vann enn gjennom luft. Er porene fulle av vann, stopper CO₂-transporten derfor nesten helt."}], "tall": [{"id": "t2-1", "q": "Porevæsken har pH ____ (litt lavere med slagg, flygeaske og silika), og stålet får en beskyttende passivfilm.", "a": "13–14", "hel": "Porevæsken har pH 13–14 (litt lavere med slagg, flygeaske og silika), og stålet får en beskyttende passivfilm."}]}, {"nr": 3, "tittel": "Nedbrytningsmekanismer", "mal": ["Kjenne igjen de viktigste nedbrytningsmekanismene i felt", "Regne ut karbonatiseringskoeffisient og anslå når fronten når armeringen", "Forklare kritisk kloridinnhold og ringanodeeffekten", "Vite hvordan AKR, frost og kjemiske angrep ser ut og hvordan de påvises"], "punkter": ["Karbonatiseringen følger x = k·√t. Kjenner du målt dybde og alder, kan du regne ut k.", "Kritisk kloridinnhold varierer. Ofte brukes ca. 0,4 % av sementvekt eller 0,07–0,10 % av betongvekt, så oppgi alltid både grense og enhet.", "Ringanodeeffekten: En reparasjon i kloridforurenset betong kan gi ny korrosjon rundt lappen.", "AKR gir kartmønsterriss. Reaksjonen kan ikke stoppes, men uttørking kan forsinke den og hindrer følgeskader.", "Saltfrost skaller av betongen lag for lag, særlig på kantdragere og kaier.", "Karbonatiseringen går raskest ved ca. 50–70 % RF og på flater som er skjermet mot regn.", "Frostskader krever høy vannmetning, over ca. 80–90 % av porene. Luftporer med avstand under 0,1–0,2 mm beskytter.", "Sprutsonen er den verste sonen i sjøvann. Husk at sulfatbestandig sement ikke automatisk er kloridbestandig."], "kort": [{"id": "3-1", "q": "En konstruksjon er 36 år og har 18 mm karbonatiseringsdybde. Hva er k, og hvor lenge tar det før fronten når 30 mm overdekning?", "a": "k = 18/√36 = 3,0 mm/√år. Fronten når 30 mm ved t = (30/3)² = 100 år – altså om ca. 64 år."}, {"id": "3-2", "q": "Bremser hydrofobering karbonatisering?", "a": "Nei. Porene står fortsatt åpne for CO₂, og fordi betongen blir tørrere, kan karbonatiseringen til og med gå litt raskere. Mot karbonatisering trenger du et belegg med høy CO₂-motstand. Hydrofobering kan likevel senke korrosjonshastigheten i karbonatisert betong fordi den holder betongen tørr."}, {"id": "3-3", "q": "Hva er ringanodeeffekten, og hvordan forebygges den?", "a": "Det er ny korrosjon rundt en reparert lapp, fordi stålet like utenfor lappen blir anode. Du forebygger den ved å fjerne all forurenset betong, sette offeranoder i kanten eller bruke katodisk beskyttelse."}, {"id": "3-4", "q": "Hvordan påviser du AKR sikkert?", "a": "Med plan- eller tynnslip av borkjerner, altså mikroskopi. Der ser du alkaligelen og det typiske rissmønsteret."}, {"id": "3-5", "q": "Hvor kom klorider fra i eldre betong som aldri har vært saltutsatt?", "a": "Fra kalsiumklorid brukt som akselerator – i Norge fram til ca. 1990, særlig i betongelementer. I eldre kystbruer kommer de fra sjøvann og sjøgrabbet tilslag. Innstøpte klorider gir en flat kloridprofil dypt inn i betongen."}, {"id": "3-6", "q": "Hvorfor finner du ofte dypere karbonatisering under et takutstikk enn på en fasade som får regn?", "a": "Den skjermede flaten holder seg nær 50–70 % RF, der karbonatiseringen går raskest. Fasaden som får regn, er ofte våt, og da stenger vannet for CO₂."}, {"id": "3-7", "q": "Hva er kritisk metningsgrad ved frost, og hvilke reparasjonstiltak utnytter den?", "a": "Når mer enn ca. 80–90 % av porevolumet er vannfylt, kan få frostsykluser gi skade. Drenering, hydrofobering og diffusjonsåpne belegg holder metningen under denne grensen."}, {"id": "3-8", "q": "Hvorfor var sement med lavt C₃A et dårlig valg for mange marine konstruksjoner?", "a": "Den motstår sulfat, men binder klorider dårlig. Kloridene nådde derfor armeringen raskere, og konstruksjonene fikk omfattende korrosjon."}, {"id": "3-r1", "q": "Hvorfor kan korrosjonen i et riss bli svært rask selv om resten av stangen er passiv?", "a": "Stålet i risset blir anode, mens stålet på hver side – minst ca. 30 cm – blir en stor katode. En stor katode og en liten anode gir en kraftig makrocelle med dyp groptæring i risset."}, {"id": "3-r2", "q": "Hvordan kan armeringen ruste langs et vannførende riss uten klorider og uten karbonatisering?", "a": "Vannet vasker ut alkaliene over tid. Da faller pH langs rissflatene, og stålet mister passiviteten. Med fenolftalein ser du det som manglende rødfarge langs risset."}], "tall": [{"id": "t3-2", "q": "Internasjonalt oppgis ofte ca. ____ av sementvekt som nedre grense for korrosjonsrisiko; i norsk praksis brukes ofte 0,07–0,10 % av betongvekt.", "a": "0,4 %", "hel": "Internasjonalt oppgis ofte ca. 0,4 % av sementvekt som nedre grense for korrosjonsrisiko; i norsk praksis brukes ofte 0,07–0,10 % av betongvekt."}, {"id": "t3-6", "q": "Karbonatisering går raskest ved ca. ____ RF og på flater skjermet mot regn.", "a": "50–70 %", "hel": "Karbonatisering går raskest ved ca. 50–70 % RF og på flater skjermet mot regn."}, {"id": "t3-7", "q": "Frostskader krever høy vannmetning (over ca. ____ av porene). Luftporer med avstand under 0,1–0,2 mm beskytter.", "a": "80–90 %", "hel": "Frostskader krever høy vannmetning (over ca. 80–90 % av porene). Luftporer med avstand under 0,1–0,2 mm beskytter."}]}, {"nr": 4, "tittel": "Tilstandskontroll og undersøkelsesmetoder", "mal": ["Planlegge en tilstandskontroll med soneinndeling og prøvetakingsplan", "Utføre og tolke de vanligste målingene (overdekning, karbonatisering, klorider, potensial, resistivitet)", "Bruke kloridprofilen til å bestemme hvor dypt betong må fjernes", "Skrive en rapport som kan brukes direkte til strategivalg"], "punkter": ["Del konstruksjonen inn i eksponeringssoner, fordi skadene følger miljøet.", "Spray fenolftalein på en fersk bruddflate. Rødlilla betyr at betongen ikke er karbonatisert (pH over ca. 9).", "Kloridprofilen viser om terskelen er nådd ved armeringen, og hvor dypt forurensningen går.", "Potensialkartlegging viser sannsynligheten for korrosjon, ikke hastigheten. Se på gradientene og bekreft med åpninger.", "Rapporten skal gi årsak, omfang, konsekvens, prognose og anbefalte tiltak."], "kort": [{"id": "4-1", "q": "Hvorfor skal fenolftalein ikke sprayes på en saget flate?", "a": "Sagestøvet smører indikatoren utover flaten, og da blir avlesningen feil. Bruk en fersk bruddflate."}, {"id": "4-2", "q": "Potensialet måles til −400 mV mot Cu/CuSO₄. Er det sikkert at stålet korroderer?", "a": "Nei. Verdien tyder på høy sannsynlighet for korrosjon, men fukt, oksygen og belegg påvirker målingen. Vurder gradientene og bekreft med en åpning."}, {"id": "4-3", "q": "Hva forteller lav resistivitet (under 10 kΩ·cm)?", "a": "At betongen er fuktig, kloridholdig eller begge deler, og leder ionestrøm godt. Er stålet depassivert, kan korrosjonen da gå raskt."}, {"id": "4-4", "q": "Hvorfor bør du også ta prøver der det ikke er synlige skader?", "a": "Du ser hvor langt fronten har kommet før skadene viser seg. Det er avgjørende for prognosen og for å velge forebyggende tiltak."}, {"id": "4-5", "q": "Hva er de tre registreringsnivåene i NS 3424, i grove trekk?", "a": "Nivå 1 er generelt og visuelt. Nivå 2 er mer inngående, med enkle målinger. Nivå 3 er spesielt inngående, med prøvetaking og laboratorieanalyser."}, {"id": "4-6", "q": "Du måler svært negative potensialer ved foten av en søyle som står i fuktig terreng, men ser ingen skader. Hvordan tolker du det?", "a": "Det kan skyldes oksygenmangel i vannmettet betong, ikke aktiv korrosjon. Mål korrosjonshastigheten eller åpne betongen for å kontrollere."}, {"id": "4-7", "q": "Hvordan bør potensialmåling gjøres på karbonatisert betong?", "a": "Mål først med lite fukting. Fukt så grundig, vent minst 2 timer og mål på nytt. Se etter områder som er ca. 100 mV mer negative innenfor ca. 1 m, og bekreft med åpninger."}, {"id": "4-r1", "q": "Hvordan kan du sikkert måle hvor dypt et riss går når bare én side er tilgjengelig?", "a": "Injiser først en tyntflytende harpiks i risset og la den herde. Bor så ut en kjerne over risset. Harpiksen holder kjernen sammen, så du kan måle dybde og vidde direkte."}, {"id": "4-r2", "q": "Hvorfor er tørkemetoden viktig selv om CM-metoden og elektriske målere er raskere?", "a": "Tørkemetoden gir det absolutte fuktinnholdet og brukes til å kalibrere de raskere metodene. Uten slik kalibrering kan CM-metoden og elektriske målere gi store feil."}], "tall": []}, {"nr": 5, "tittel": "Dokumentasjon og klassifisering etter Statens vegvesen (V441)", "mal": ["Registrere et funn med alle V441-feltene", "Bruke riktige koder for skadetype og skadeårsak", "Skille mellom skadegrad og konsekvensgrad", "Vite når bruforvalter skal varsles umiddelbart"], "punkter": ["Skadetype er hva, skadeårsak er hvorfor og skadegrad er hvor ille. Konsekvenstype er hva som rammes, og konsekvensgrad hvor mye.", "Skadegrad går fra 1 til 4: liten, middels, stor og svært stor skade.", "Konsekvenstypene er B for bæreevne, T for trafikksikkerhet, V for vedlikeholdskostnader og M for miljø og estetikk.", "Ved konsekvensgrad 3 registreres tiltak i Brutus, og inspeksjonsintervallet vurderes. Ved konsekvensgrad 4 skal det varsles umiddelbart.", "Riss kodes 14 for alle materialer, også betong. Lekkasje kodes 17 og er materialuavhengig.", "Hver skadetype har sin egen skadegradskala. Samme skadetype på ett element registreres én gang, med høyeste skadegrad.", "Registrer primærskaden: Avskalling med korrodert armering kodes 36."], "kort": [{"id": "5-1", "q": "Hvilken kode har avskalling, og hvilken har armeringskorrosjon?", "a": "35 er Avskalling og 36 Armeringskorrosjon. Opptrer de sammen på samme sted, registrerer du primærskaden, altså 36."}, {"id": "5-2", "q": "Hva er koden for kloridangrep og for karbonatisering?", "a": "52 Kloridangrep og 53 Karbonatisering. Begge ligger under gruppe 50 Miljøangrep."}, {"id": "5-3", "q": "Kan en middels skade ha stor konsekvens? Gi et eksempel.", "a": "Ja. En middels avskalling med løse biter over en gangveg kan gi konsekvensgrad 4 for trafikksikkerhet, fordi skadegrad og konsekvensgrad vurderes hver for seg."}, {"id": "5-4", "q": "Hva skal skje ved konsekvensgrad 4?", "a": "Bruforvalter eller oppdragsgiver kontaktes umiddelbart, og varslingen dokumenteres."}, {"id": "5-5", "q": "Hvordan kodes kalkutfellinger fra riss i undersiden av et dekke?", "a": "Som skadetype 14 Riss/sprekk og 17 Lekkasje/fuktbelastning, med årsak 54 Utluting. Konsekvensen er typisk V og M."}, {"id": "5-6", "q": "Hva er forskjellen på en enkelinspeksjon og en hovedinspeksjon etter N-V441?", "a": "En enkelinspeksjon er en enkel visuell kontroll av elementer over vann, uten tilkomstutstyr og normalt uten målinger. En hovedinspeksjon er en nær visuell kontroll av hele brua – også kabler og elementer under vann – med målinger ved behov, tiltak og kostnadsoverslag."}, {"id": "5-7", "q": "Hvor langt opp skal elementene kontrolleres ved hovedinspeksjon under vann?", "a": "Fra bunnen opp til og med tidevannssonen."}], "tall": []}, {"nr": 6, "tittel": "Reparasjonsstrategi og NS-EN 1504-9", "mal": ["Forklare arbeidsgangen i NS-EN 1504-9: skade → strategi → prinsipp → metode → produkt", "Kjenne de 11 prinsippene og hvilke som gjelder betong og armering", "Velge prinsipp for karbonatisering og klorider ut fra omfang", "Skille mellom forenklet, begrenset og fullstendig mekanisk reparasjon"], "punkter": ["Prinsipp 1–6 gjelder selve betongen, og prinsipp 7–11 gjelder armeringskorrosjon.", "Ved korrosjon er prinsipp 7, gjenopprette passivitet, og prinsipp 10, katodisk beskyttelse, de viktigste.", "Ved utbredte, dype kloridskader er KB ofte billigere enn å fjerne all forurenset betong.", "Alle løsninger bør kombineres med tiltak mot ny inntrengning, altså prinsipp 1, 2 og 8.", "Etter RILEM velger du først alternativ, så prinsipp og til slutt metode. Del konstruksjonen i passive, tidlig korroderende og skadde soner.", "Velg én hovedmetode som oppfyller alle kravene. Tilleggsmetoder kan ikke erstatte den.", "På konstruksjoner i luft kan katodeprosessen (oksygen) ikke stoppes pålitelig med belegg."], "kort": [{"id": "6-1", "q": "Hvilket prinsipp er katodisk beskyttelse?", "a": "Prinsipp 10 i NS-EN 1504-9."}, {"id": "6-2", "q": "Hva er forskjellen på forenklet og fullstendig reparasjon?", "a": "En forenklet reparasjon fjerner bare løs og oppsprukket betong. En fullstendig reparasjon fjerner all karbonatisert eller kloridforurenset betong rundt armeringen og gjenoppretter passiviteten."}, {"id": "6-3", "q": "Hvorfor må du vite om KB skal brukes senere før du velger reparasjonsmørtel?", "a": "Fordi KB krever elektrisk kontakt. Isolerende polymermørtler eller epoksy på armeringen hindrer strømmen."}, {"id": "6-4", "q": "Nevn tre metoder under prinsipp 7.", "a": "For eksempel økt overdekning, utskifting av forurenset eller karbonatisert betong, elektrokjemisk realkalisering og kloriduttrekk."}, {"id": "6-5", "q": "Hvilken del av NS-EN 1504 stiller krav til reparasjonsmørtel?", "a": "Del 3, altså NS-EN 1504-3."}, {"id": "6-6", "q": "Hvorfor er det ikke nok å reparere bare der armeringen ruster i kloridforurenset betong?", "a": "Betongen rundt har ofte klorider over terskelen, men stålet der beskyttes av korrosjonen i det skadde området. Reparerer du skaden, forsvinner denne beskyttelsen – og den nye, passive lappen driver i tillegg korrosjon i kanten (ringanodeeffekten)."}, {"id": "6-7", "q": "Hvorfor kan du ikke stoppe korrosjonen ved å legge et tett belegg som stenger ute oksygen?", "a": "Selv tette belegg slipper gjennom litt oksygen, og betongen inneholder oksygen fra før. Det er dessuten sjelden mulig å belegge alle sider, og nye riss gir nye veier inn."}, {"id": "6-8", "q": "Når kan et alkalisk overlag på over 20 mm brukes på karbonatisert betong?", "a": "Når bare risset og delaminert betong skal fjernes, betongen er kloridfri, og karbonatiseringen ikke har gått mer enn ca. 20 mm bak armeringen. Overlaget må selv motstå karbonatisering i hele levetiden. OH⁻ diffunderer raskest i fuktig betong."}, {"id": "6-r1", "q": "Hvilke to krav stilles til laget ved realkalisering ved diffusjon (metode 7.4)?", "a": "Laget må være sementbasert og minst 20 mm tykt – og minst like tykt som det selv vil karbonatisere i restlevetiden. I tillegg bør den gamle karbonatiseringsdybden ikke overstige ca. 40 mm, og betongen må være kloridfri."}, {"id": "6-r2", "q": "Et riss beveger seg flere millimeter gjennom året og kan ikke stoppes. Hvilken metode i NS-EN 1504-9 kan være riktig?", "a": "Metode 1.6: Gjør risset om til en fuge ved å frese det opp og tette med fugemasse. Er bevegelsen mindre, kan rissbandasje (1.4) være et alternativ."}], "tall": [{"id": "t6-2", "q": "Prinsipp 7 (gjenopprette passivitet) og ____ (katodisk beskyttelse) er de viktigste ved korrosjon.", "a": "10", "hel": "Prinsipp 7 (gjenopprette passivitet) og 10 (katodisk beskyttelse) er de viktigste ved korrosjon."}]}, {"nr": 7, "tittel": "Forbehandling", "mal": ["Velge riktig metode for fjerning av betong", "Utforme et reparasjonsfelt med riktige kanter og dybde", "Rengjøre og vurdere armering", "Klargjøre underlaget riktig før mørtling"], "punkter": ["Vannmeisling er selektiv og gir ingen mikroriss, men det alkaliske vannet må håndteres.", "Gi feltet rette kanter uten fjæring mot null, og lag fritt rom bak armeringen – minst 20 mm etter R762.", "Fortsett langs armeringen til du finner rent stål. Vurder tverrsnittstapet og om det trengs ny armering.", "Underlaget skal være rent og vannmettet, men overflatetørt.", "En R4-mørtel krever minst 45 MPa trykkfasthet og minst 2,0 MPa heft. For R3 er kravene 25 MPa og 1,5 MPa."], "kort": [{"id": "7-1", "q": "Hvorfor skal mørtel ikke fjæres ut mot null i kanten?", "a": "Den tynne kanten sprekker og løsner. Kanten skal derfor være rett og ha en minste dybde."}, {"id": "7-2", "q": "Hva betyr «vannmettet, overflatetørt»?", "a": "Porene er fylt med vann, men det står ikke vann på overflaten. Flaten ser mørk og matt ut."}, {"id": "7-3", "q": "Hvorfor er vannmeisling ofte å foretrekke framfor tung pigging?", "a": "Den fjerner selektivt den svake betongen og gir ikke mikroriss i betongen som blir igjen. I tillegg gir den en ru heftflate."}, {"id": "7-4", "q": "Hvilken rensegrad kreves ofte for armering?", "a": "Sa 2 etter ISO 8501-1, som R762 (2018) og DIBt TR Instandhaltung krever. Andre steder kreves Sa 2½, eller den rensegraden produktdatabladet angir."}, {"id": "7-5", "q": "Når skal armeringen ikke males med epoksy?", "a": "Når katodisk beskyttelse eller elektrokjemiske metoder skal brukes. Da må stålet ha elektrisk kontakt med mørtelen."}, {"id": "7-6", "q": "Hvorfor bør beskrivelsen ta hensyn til «skyggen» bak armeringen ved vannmeisling?", "a": "Vannmeisling etterlater ofte en «skygge» av betong bak stengene. Kreves den fjernet, forsvinner mye av den økonomiske gevinsten, så beskrivelsen bør tilpasses det metoden faktisk gir."}, {"id": "7-7", "q": "Hvorfor gir vannmeisling bedre heft enn pigging?", "a": "Slagmetoder gir et oppknust lag med mikroriss, typisk 3–10 mm dypt, og det svekker heften. Vannmeisling gir ingen mikroriss og etterlater en ru overflate."}, {"id": "7-8", "q": "Hvorfor anbefales ikke vannmeisling rundt etteroppspent spennarmering?", "a": "Vann kan trenge inn i kabelrørene og gi korrosjon. Fjerner du betong rundt forankringene, kan kablene i tillegg plutselig miste spenningen."}], "tall": [{"id": "t7-2", "q": "Rette kanter, ingen fjæring mot null, fritt rom bak armeringen (minst ____, R762).", "a": "20 mm", "hel": "Rette kanter, ingen fjæring mot null, fritt rom bak armeringen (minst 20 mm, R762)."}, {"id": "t7-5", "q": "R4: ≥____ og ≥2,0 MPa heft. R3: ≥25 MPa og ≥1,5 MPa.", "a": "45 MPa", "hel": "R4: ≥45 MPa og ≥2,0 MPa heft. R3: ≥25 MPa og ≥1,5 MPa."}]}, {"nr": 8, "tittel": "Mekanisk reparasjon", "mal": ["Velge mellom håndmørtel, utstøping og sprøyting", "Lese et produktdatablad og velge riktig R-klasse", "Utføre og etterbehandle en reparasjon riktig", "Kjenne de vanligste feilene og hvordan de forebygges"], "punkter": ["Sementbaserte (CC) og polymermodifiserte (PCC) mørtler er hovedvalget. Ren epoksymørtel (PC) brukes bare til små spesialjobber.", "Hold deg innenfor lagtykkelsen, og komprimer godt bak armeringen.", "Tørrsprøyting er fleksibel og gir god heft, mens våtsprøyting gir høy kapasitet og mindre støv.", "Herding er obligatorisk: Dekk til og hold reparasjonen fuktig så lenge databladet krever."], "kort": [{"id": "8-1", "q": "Hvilken R-klasse brukes for konstruktive reparasjoner?", "a": "R3 eller R4. R1 og R2 er ikke-konstruktive klasser."}, {"id": "8-2", "q": "Nevn tre vanlige feil ved håndmørtling.", "a": "For eksempel for lite fjernet bak armeringen, tørt eller støvete underlag, for mye vann, for tykke lag, manglende herding og fjæring i kantene."}, {"id": "8-3", "q": "Hva er prelltap, og hvorfor må det fjernes?", "a": "Prelltap er materiale som spretter av når du sprøyter. Bygges det inn, gir det svake soner og hulrom."}, {"id": "8-4", "q": "Hvorfor er herding spesielt viktig for reparasjoner?", "a": "Reparasjoner er tynne og har stor overflate, så de tørker fort ut. Det gir svinnriss, dårlig heft og en svak overflate."}, {"id": "8-5", "q": "Når velger du utstøping framfor håndmørtel?", "a": "Ved store volum og gjennomgående skader med armering på flere sider, der sprøyting ikke er mulig."}, {"id": "8-6", "q": "Når passer forhåndsplassert tilslag (ACI RAP-9) som reparasjonsmetode?", "a": "På vegger, i tak og under vann – særlig der du vil ha lite svinn. Steinen legges i forskalingen først, og så injiseres mørtel."}], "tall": []}, {"nr": 9, "tittel": "Overflatebeskyttelse", "mal": ["Skille mellom hydrofobering, impregnering og belegg", "Velge overflatebeskyttelse etter nedbrytningsmekanisme", "Forstå diffusjonsåpenhet og CO₂-motstand", "Utføre og kontrollere overflatebehandling"], "punkter": ["Hydrofobering holder vann og klorider ute, men stopper ikke CO₂.", "Et belegg mot karbonatisering skal ha sd,CO₂ over 50 m.", "Utvendige, fuktige konstruksjoner trenger diffusjonsåpne løsninger.", "Inntrengningsdybden avgjør hvor lenge en hydrofobering varer, og underlaget må være tørt.", "Et tett belegg er en god barriere, men stenger fukten inne. Åpne løsninger varer lenger, og tette belegg må fornyes etter 10–15 år.", "Overflatebehandling bremser ny inntrengning, men stopper sjelden kloridkorrosjon som allerede er i gang."], "kort": [{"id": "9-1", "q": "Hvilken behandling velger du mot klorider på en kantdrager?", "a": "Hydrofobering, gjerne med silangel fordi den trenger dypt inn. Et alternativ er en sementbasert membran som bremser kloridene."}, {"id": "9-2", "q": "Hvorfor kan et tett epoksybelegg være feil valg på AKR-skadet betong?", "a": "Fordi belegget stenger fukten inne. Betongen holdes våt, og da fortsetter reaksjonen."}, {"id": "9-3", "q": "Hva er duggpunktsregelen ved maling?", "a": "Underlaget skal være minst 3 °C over duggpunktet, så det ikke dannes kondens."}, {"id": "9-4", "q": "Hvordan kontrolleres hydrofobering?", "a": "Mål inntrengningsdybden på kjerner, følg med på forbruket per m², og mål eventuelt vannabsorpsjonen."}, {"id": "9-5", "q": "Hvilken type behandling bremser karbonatisering best?", "a": "Et belegg med høy CO₂-motstand, for eksempel en akrylmaling som er laget for betong."}, {"id": "9-6", "q": "Hvorfor kan et epoksybelegg gjøre kloridskadene verre etter 15–20 år?", "a": "Når belegget får skader, slipper vannet inn, men belegget hindrer fortsatt uttørking. Betongen blir stående våt, kloridene transporteres raskt, og korrosjonen går fort."}, {"id": "9-7", "q": "Nevn tre krav til en god hydrofobering.", "a": "Vannopptak under ca. 20 % av ubehandlet og inntrengning minst 2 mm (ofte mer i norske beskrivelser). Uttørking minst 60 % av ubehandlet, og produktet må være alkalibestandig."}, {"id": "9-r1", "q": "Hvilke riss bør lukkes før en betongflate hydrofoberes?", "a": "Riss bredere enn ca. 0,1 mm, for hydrofobering tetter ikke riss. Ved bevegelser over ca. 0,1–0,2 mm er et rissoverbyggende belegg bedre."}], "tall": [{"id": "t9-2", "q": "Belegg mot karbonatisering skal ha sd,CO₂ over ____ m.", "a": "50", "hel": "Belegg mot karbonatisering skal ha sd,CO₂ over 50 m."}, {"id": "t9-5", "q": "Tett gir god barriere men stenger fukt inne; åpent varer lenger. Tette belegg må fornyes etter ____.", "a": "10–15 år", "hel": "Tett gir god barriere men stenger fukt inne; åpent varer lenger. Tette belegg må fornyes etter 10–15 år."}]}, {"nr": 10, "tittel": "Riss og injeksjon", "mal": ["Avgjøre om et riss skal injiseres og med hvilket formål", "Velge materiale etter EN 1504-5 (F, D, S)", "Planlegge pakkerplassering og utføre injeksjon", "Dokumentere injeksjonsarbeidet og ivareta HMS"], "punkter": ["Formålet styrer materialvalget: epoksy for kraftoverføring, elastisk PUR for riss som beveger seg, og skum eller gel mot vann.", "Riss langs korrodert armering skal ikke injiseres. Du må utbedre årsaken.", "Bor skrått og vekselvis fra hver side av risset, med pakkeravstand på ca. halve tykkelsen.", "Injiser nedenfra med kontrollert trykk, og logg forbruket per pakker.", "Epoksy og isocyanater krever opplæring og riktig verneutstyr."], "kort": [{"id": "10-1", "q": "Et stabilt, tørt riss i en bærende bjelke skal injiseres. Hvilket materiale?", "a": "Lavviskøs epoksy i klasse F, fordi den er kraftoverførende."}, {"id": "10-2", "q": "Et riss lekker vann aktivt. Hva gjør du?", "a": "Tett med PUR-skum, og etterinjiser eventuelt med elastisk PUR. Forinjiser med vann, som aktiverer reaksjonen."}, {"id": "10-3", "q": "Hvorfor er høyt trykk ikke bedre?", "a": "Fordi for høyt trykk kan sprenge betongen og presse materialet bort i stedet for å fylle risset."}, {"id": "10-4", "q": "Hva kan svært lavt forbruk per pakker bety?", "a": "At risset ikke er fylt. Kanskje traff ikke borehullet risset, eller risset er tettet av støv."}, {"id": "10-5", "q": "Hvilken klasse i EN 1504-5 brukes for riss som beveger seg?", "a": "Klasse D (duktil fylling), som tåler bevegelse."}, {"id": "10-6", "q": "Et produkt er merket U(S1) W(8)(1/3)(5/30). Kan du bruke det på et vannførende riss på 0,3 mm?", "a": "Nei. W(8) betyr at produktet er dokumentert for riss fra 0,8 mm. Til 0,3 mm trenger du W(3) eller lavere, for eksempel Foamjet F."}, {"id": "10-7", "q": "Du skal injisere et stabilt riss med epoksy ved +8 °C. Hvorfor velger du Mapepoxy BI og ikke BI-R?", "a": "Fordi BI er klassifisert for +5 til +30 °C. BI-R er klassifisert for +21 til +30 °C ved betonginjeksjon, så +8 °C er utenfor."}, {"id": "10-8", "q": "Hvorfor skal du rengjøre langs risset med stålbørste og ikke slipemaskin før injeksjon?", "a": "Fordi slipestøvet fyller risset og hindrer injeksjonsmaterialet i å trenge inn."}, {"id": "10-9", "q": "Hvilken viskositet anbefaler ACI RAP-1 for riss på 0,3 mm og mindre?", "a": "Lavviskøs epoksy, 500 cP eller lavere."}], "tall": []}, {"nr": 11, "tittel": "Elektrokjemisk realkalisering og kloriduttrekk", "mal": ["Forklare prinsippet for realkalisering og kloriduttrekk", "Kjenne typiske parametre og forutsetninger", "Vurdere når metodene passer, og når KB er bedre"], "punkter": ["Begge metodene er midlertidige behandlinger med høy strømtetthet, i størrelsesorden 1 A/m² stål.", "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk 2–10 uker.", "Armeringen må ha kontinuitet, og det må ikke være kortslutninger.", "Spennarmering og AKR krever en særskilt vurdering."], "kort": [{"id": "11-1", "q": "Hvilken elektrolytt brukes ved realkalisering?", "a": "Typisk en natriumkarbonatløsning, for eksempel i sprøytet cellulosefiber."}, {"id": "11-2", "q": "Hvorfor fjerner kloriduttrekk dårlig klorider bak armeringen?", "a": "Fordi stålet er katoden og «skygger». Kloridene som ligger bak, vandrer dårlig ut mot anoden på overflaten."}, {"id": "11-3", "q": "Hva er den største forskjellen mellom kloriduttrekk og KB?", "a": "Kloriduttrekk er en midlertidig behandling. KB er permanent, overvåkes og beskytter også mot klorider som kommer inn senere."}, {"id": "11-4", "q": "Hvordan kontrolleres realkalisering?", "a": "Du tester kjerner eller åpninger med fenolftalein etter behandlingen. I tillegg logger du ladningsmengden underveis."}, {"id": "11-5", "q": "Nevn fire måter å bestemme når kloriduttrekk skal avsluttes på.", "a": "Når effekten avtar og strømmen faller, typisk under ca. 0,5 A/m². Når kloridprøver når avtalt nivå, når kloridinnholdet i elektrolytten flater ut, og ut fra erfaringsbasert ladningsmengde (Ah/m²)."}, {"id": "11-6", "q": "Hva er den mest katastrofale feilen ved elektrokjemisk behandling?", "a": "Feil polaritet. Da blir armeringen anode og korroderer kraftig."}, {"id": "11-r1", "q": "Hvorfor bør du ikke gjøre potensialkartlegging rett etter et kloriduttrekk?", "a": "Fordi armeringen er sterkt polarisert av behandlingen lenge etterpå, og da blir potensialene misvisende. Vent, eller bruk innstøpte sensorer."}], "tall": [{"id": "t11-1", "q": "Begge er midlertidige behandlinger med høy strømtetthet (i størrelsesorden ____ stål).", "a": "1 A/m²", "hel": "Begge er midlertidige behandlinger med høy strømtetthet (i størrelsesorden 1 A/m² stål)."}, {"id": "t11-2", "q": "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk ____.", "a": "2–10 uker", "hel": "Realkalisering tar typisk fra noen dager til noen uker, kloriduttrekk typisk 2–10 uker."}]}, {"nr": 12, "tittel": "Katodisk beskyttelse", "mal": ["Forklare hvordan katodisk beskyttelse stopper korrosjon", "Kjenne anodesystemene for ICCP og galvaniske anoder", "Beskrive kritiske punkter ved installasjon og idriftsettelse", "Kjenne kriteriene i ISO 12696 og grensene for overbeskyttelse"], "punkter": ["KB gjør hele armeringen til katode, slik at anodereaksjonen, altså korrosjonen, undertrykkes.", "Påtrykt strøm (ICCP) gir styrbar, målbar beskyttelse. Galvaniske anoder er enkle, men har begrenset kapasitet.", "Kontinuitet i armeringen og kontroll av kortslutninger er de viktigste kontrollene under installasjonen.", "Minst ett kriterium skal være oppfylt: instant-off mer negativ enn −720 mV, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid.", "Potensialet skal ikke være mer negativt enn ca. −1100 mV for slakkarmering og −900 mV for spennarmering."], "kort": [{"id": "12-1", "q": "Hvorfor måles potensialet «instant-off»?", "a": "For å fjerne IR-fallet i betongen. Uten det blir potensialet for negativt og gir et misvisende bilde."}, {"id": "12-2", "q": "Hva er en typisk strømtetthet for KB i atmosfærisk betong?", "a": "Fra noen få opp til ca. 20 mA/m² stål. Ved katodisk forebygging er behovet under ca. 2 mA/m²."}, {"id": "12-3", "q": "Hvorfor skal reparasjonsmørtelen i en KB-sone være sementbasert med passende resistivitet?", "a": "Fordi strømmen må gå jevnt gjennom betongen til armeringen. Isolerende materialer gir skygge, og da blir områder bak dem ubeskyttet."}, {"id": "12-4", "q": "Hva er det første du måler før strømmen slås på?", "a": "Naturlige (statiske) potensialer ved alle referanseelektroder. De er utgangspunktet."}, {"id": "12-5", "q": "Nevn to vanlige problemer i eldre KB-anlegg.", "a": "Anlegg som er koblet ut uten at noen vet det, og defekte referanseelektroder. Andre er syredannelse ved anoden og kortslutninger etter senere boring."}, {"id": "12-6", "q": "Hvilket anodesystem velger du på et brudekke med trafikk, og hvorfor?", "a": "MMO-titannett i overlag eller titanbånd i spor. Belegg tåler ikke slitasjen fra trafikk, mens titan er robust og har svært lang levetid."}, {"id": "12-7", "q": "Hvorfor monteres ofte pseudoreferanser i tillegg til ekte referanseelektroder?", "a": "Fordi ekte referanseelektroder har begrenset levetid, ca. 20 år. Med pseudoreferanser kan du fortsatt måle depolarisasjon uten å bytte elektroder."}, {"id": "12-8", "q": "Hvor stor motstand kan forbindelsen mellom en innstøpt sinkanode og armeringen høyst ha?", "a": "Motstanden skal være under 1 Ω."}, {"id": "12-9", "q": "Hvorfor kan du ikke bruke epoksy som heftbro rundt innstøpte galvaniske anoder?", "a": "Fordi epoksy har svært høy resistivitet og isolerer anoden fra betongen, så den ikke kan avgi strøm. Materialet rundt anoden bør ha resistivitet under ca. 15 000 Ω·cm."}], "tall": [{"id": "t12-4", "q": "Kriterier (minst ett): instant-off mer negativ enn ____, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid.", "a": "−720 mV", "hel": "Kriterier (minst ett): instant-off mer negativ enn −720 mV, 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid."}, {"id": "t12-5", "q": "Grenser: ikke mer negativt enn ca. ____ (slakkarmering) og −900 mV (spennarmering).", "a": "−1100 mV", "hel": "Grenser: ikke mer negativt enn ca. −1100 mV (slakkarmering) og −900 mV (spennarmering)."}]}, {"nr": 13, "tittel": "Forsterkning av betongkonstruksjoner", "mal": ["Kjenne de vanligste forsterkningsmetodene", "Utføre karbonfiberforsterkning riktig i felt", "Forstå hvorfor underlag og forankring er avgjørende"], "punkter": ["Forsterkning skal alltid prosjekteres av en konstruktør.", "FRP har svært høy strekkfasthet, men svikter typisk i limfugen eller i betongoverdekningen.", "Underlaget må ha tilstrekkelig strekkfasthet, typisk minst 1,5 MPa, og hjørnene rundes av før omsnøring."], "kort": [{"id": "13-1", "q": "Hvor svikter CFRP-forsterkning vanligvis?", "a": "Som regel skaller betongoverdekningen av, eller heften svikter i endene. Det er sjelden fiberen selv som ryker."}, {"id": "13-2", "q": "Hvorfor rundes hjørner av før omsnøring med vev?", "a": "Fordi skarpe hjørner gir spenningskonsentrasjoner som kan kutte fibrene."}, {"id": "13-3", "q": "Hva må gjøres før forsterkning av et korrosjonsskadet element?", "a": "Først reparere betongskadene og stoppe korrosjonen, så underlaget er friskt."}], "tall": [{"id": "t13-3", "q": "Underlaget skal ha tilstrekkelig strekkfasthet (typisk minst ____), og hjørner rundes av ved omsnøring.", "a": "1,5 MPa", "hel": "Underlaget skal ha tilstrekkelig strekkfasthet (typisk minst 1,5 MPa), og hjørner rundes av ved omsnøring."}]}, {"nr": 14, "tittel": "Mapei-produktene – lest fra databladene", "mal": ["Lese et produktdatablad og finne klasse, lagtykkelse, temperatur og forbruk", "Velge riktig Mapei-produkt etter funksjon og EN 1504-klasse", "Kjenne de vanligste fellene: feil kombinasjon av produkter, for tynne lag, feil herding", "Regne ut materialbehov fra forbruksangivelsen"], "punkter": ["Velg først prinsipp og metode, og deretter et produkt med riktig standard og klasse.", "Mapefer og Redisit legges i to strøk, totalt 2 mm, rett etter rensing. Aldri sammen med galvanisk KB.", "Redirep 45 RSF, DS, DS-RSF og Confix er R4. Mapegrout T40 er R3, og Redirep 25 RSF er R2.", "Planiseal WR 90 Gel gir inntrengning i klasse II (≥ 10 mm) i ett strøk, mens WR 100 legges i to strøk.", "Elastiske belegg som Cem Elastic og Mapelastic Smart må ligge minst 2 mm tykt for å bygge over riss.", "Mapeshield E er en sinkplate på overflaten. Mapeshield I er anoder som festes til armeringen og støpes inn.", "Bruk forbruket i databladet til å regne ut mengder, og legg til svinn.", "Sjekk alltid gjeldende datablad og DoP. Utgavenummeret står nederst på databladet."], "kort": [{"id": "14-1", "q": "Du skal reparere en søyle i skvalpesonen på en kai. Hvilken av Redirep-mørtlene velger du, og hvorfor?", "a": "Redirep 45 RSF. Den er klasse R4 (konstruktiv), frostbestandig og deklarert for XS3/XD3/XF4. Redirep 25 RSF er bare R2."}, {"id": "14-2", "q": "Hvor tykt skal Mapefer eller Redisit ligge på armeringen, og hvordan legges det?", "a": "Totalt ca. 2 mm i to strøk med pensel, 1–2 timer mellom strøkene (Mapefer ca. 2 timer). Legg det rett etter at stålet er renset."}, {"id": "14-3", "q": "Hvorfor skal du ikke bruke Mapefer når det skal monteres Mapeshield E?", "a": "Fordi korrosjonsbeskyttelsen hindrer god elektrolytisk kontakt mellom stålet og mørtelen. Strømmen fra sinkanoden må gå gjennom mørtelen og inn i armeringen, så databladet forbyr korrosjonsbeskyttelse på armeringen."}, {"id": "14-4", "q": "Regn ut hvor mange sekker DS du trenger for 12 m² sprøyting med 40 mm tykkelse.", "a": "19 kg/m² per cm × 4 cm × 12 m² = 912 kg. Med 5 % prell blir det ≈ 958 kg, altså ca. 39 sekker à 25 kg (eller én storsekk à 1200 kg)."}, {"id": "14-5", "q": "Hva er forskjellen på Planiseal WR 90 Gel og Planiseal WR 100?", "a": "Begge er ren silan. WR 90 Gel er tiksotrop, legges i ett strøk og gir inntrengning klasse II (≥ 10 mm), fordi gelen gir lengre kontakttid. WR 100 er tyntflytende og legges i to strøk på 0,1–0,2 kg/m². På SVV-bruer krever R762 (2018) gel eller krem med FE 25 ≥ 65 %, så der brukes WR 90 Gel."}, {"id": "14-6", "q": "Hvilken minimumstykkelse krever Cem Elastic og Mapelastic Smart, og hvorfor er den viktig?", "a": "Minst 2 mm. Det er tykkelsen som trengs for at belegget skal bygge over riss, så et tynnere lag gir ikke den deklarerte ytelsen."}, {"id": "14-7", "q": "Hvilket krav stiller Carboplate-databladet til underlaget?", "a": "Betongens avtrekksfasthet (strekkfasthet) må være minst 1,5 MPa."}, {"id": "14-8", "q": "Hvorfor skal Mapecure 1 ikke brukes på en flate som skal males?", "a": "Fordi voksfilmen hindrer heft. Den må fjernes helt før epoksy, maling eller påstøp, så bruk heller plast eller vanning."}, {"id": "14-9", "q": "Hva skiller Mapegrout T60 fra T40, og når velger du T60?", "a": "T60 er R4 (T40 er R3) og har sulfatresistent sement og korrosjonsinhibitor, 60 MPa og lagtykkelse opptil 100 mm. Velg T60 for bærende deler, marint miljø og offshore."}, {"id": "14-10", "q": "Hvorfor kan Mapeprimer M legges på fuktig betong, mens Mapecoat CFS ikke kan det?", "a": "Fordi Mapeprimer M er laget og testet for fuktig underlag (EN 13578). CFS krever maks 4 % fukt, og derfor legges den på primeren, ikke direkte på fuktig betong."}, {"id": "14-11", "q": "Hva betyr W(1) og (5/30) i klassifiseringen av Mapepoxy BI?", "a": "W(1) betyr at produktet kan injiseres i riss fra 0,1 mm. (5/30) betyr brukstemperatur fra +5 til +30 °C."}], "tall": [{"id": "t14-2", "q": "Mapefer og Redisit: to strøk, totalt ____, rett etter rensing. Aldri sammen med galvanisk KB.", "a": "2 mm", "hel": "Mapefer og Redisit: to strøk, totalt 2 mm, rett etter rensing. Aldri sammen med galvanisk KB."}, {"id": "t14-5", "q": "Elastiske belegg (Cem Elastic, Mapelastic Smart) krever minst ____ for å bygge over riss.", "a": "2 mm", "hel": "Elastiske belegg (Cem Elastic, Mapelastic Smart) krever minst 2 mm for å bygge over riss."}]}, {"nr": 15, "tittel": "Mapei-systemer steg for steg", "mal": ["Bygge opp et komplett reparasjonssystem lag for lag", "Koble hvert lag til et prinsipp i EN 1504-9", "Velge riktig system for bru, kai, søyle, balkong og dekke", "Unngå de vanligste feilene i overgangene mellom produktene"], "punkter": ["Et system er lag som virker sammen. Det svikter oftest i overgangene: ventetid, fukt og herding.", "En bærende reparasjon bygges opp slik: Redisit → Redirep 45 RSF → sparkel → primer → maling.", "På en kantdrager legges Confix vått-i-vått på Mapepoxy L, og deretter Cem Elastic.", "Ved galvanisk KB skal stålet ikke ha korrosjonsbeskyttelse, mørtelen skal være sementbasert og kontinuiteten ≤ 1 Ω.", "Ved FRP skal underlaget ha minst 1,5 MPa, limet brukes innen brukstiden, og produktet må passe temperaturen.", "På dekker er fukt under primeren den store fienden.", "Offshore legges T60 på mettet, overflatetørt underlag, og Mapepoxy LR brukes når tiden er lang. Mapeprimer M + Mapecoat CFS legges bare når fukt, RF og duggpunkt er innenfor."], "kort": [{"id": "15-1", "q": "Hvorfor legges Confix «vått-i-vått» på Mapepoxy L?", "a": "For å få monolittisk heft. Den ferske mørtelen må binde i limet mens det fortsatt er klebrig, altså innenfor åpentiden. Har limet herdet, blir det et slippsjikt."}, {"id": "15-2", "q": "Hvilke to ting må være på plass før Mapeshield E kobles til?", "a": "Minst to tilkoblinger per element, loddet eller festet til armeringen, og dokumentert elektrisk kontinuitet i armeringen (maks 1 Ω)."}, {"id": "15-3", "q": "Nevn tre feil som ødelegger et galvanisk KB-system.", "a": "Korrosjonsbeskyttelse (Mapefer/Redisit) på armeringen og epoksy- eller PU-mørtel. Videre mørtel med stålfiber eller resistivitet utenfor 50–200 % av gammel betong, og manglende kontinuitet."}, {"id": "15-4", "q": "Hvilke prinsipper i EN 1504-9 dekker Cem Elastic?", "a": "Prinsipp 1 (beskyttelse mot inntrengning), 2 (fuktkontroll) og 8 (økt resistivitet)."}, {"id": "15-5", "q": "Hvilke krav stiller Purtop 400 M-systemet til betongdekket?", "a": "Trykkfasthet ≥ 25 MPa, avtrekksfasthet ≥ 1,5 MPa og maks ca. 4 % fukt. Er det fuktigere, trengs fuktprimer."}, {"id": "15-6", "q": "I hvilken rekkefølge bygges MapeWrap C-systemet opp?", "a": "MapeWrap Primer 1 → MapeWrap 11 (avretting, vått-i-vått) → MapeWrap 31 → vev → MapeWrap 31."}, {"id": "15-7", "q": "Du skal lime en påstøp offshore, og utstøpingen tar ca. 2 timer ved +20 °C. Mapepoxy L eller LR?", "a": "LR. Ved +20 °C har LR ca. 180 min åpentid, mot 70 min for L. Med L ville limet ha herdet for langt før betongen kom på."}, {"id": "15-8", "q": "Hvilke klimakrav må være oppfylt før Mapecoat CFS legges?", "a": "Underlaget skal ha maks 4 % fukt og ingen oppstigende fukt, RF maks 80 %, og være minst 3 °C over duggpunktet. Belegget legges fersk-i-fersk på Mapeprimer M eller innen 48 timer ved +20 °C, ellers slipes primeren eller får nytt strøk. Beskytt det mot vann i 24 timer."}, {"id": "15-9", "q": "Hva betyr «mettet, overflatetørt» underlag for Mapegrout T60, og hvorfor?", "a": "Betongen vannmettes slik at den ikke suger vann ut av mørtelen. Fritt vann på overflaten blåses bort med trykkluft, så det ikke blir et svakt, vannrikt sjikt i heftsonen."}, {"id": "15-10", "q": "Hvorfor holder ikke hydrofobering alene på en kantdrager med høyt kloridinnhold ved armeringen?", "a": "Fordi silanet bare bremser ny inntrengning av vann og klorider. Korrosjonen som er i gang, fortsetter så lenge det er nok fukt, så kloridbelastet betong må fjernes, eller armeringen beskyttes elektrokjemisk."}], "tall": [{"id": "t15-4", "q": "Galvanisk KB: ingen korrosjonsbeskyttelse på stålet, sementbasert mørtel, kontinuitet ≤ ____.", "a": "1 Ω", "hel": "Galvanisk KB: ingen korrosjonsbeskyttelse på stålet, sementbasert mørtel, kontinuitet ≤ 1 Ω."}, {"id": "t15-5", "q": "FRP: underlaget minst ____, lim innen brukstid, riktig produkt for temperaturen.", "a": "1,5 MPa", "hel": "FRP: underlaget minst 1,5 MPa, lim innen brukstid, riktig produkt for temperaturen."}]}, {"nr": 16, "tittel": "Kvalitetskontroll, dokumentasjon og HMS", "mal": ["Lage og følge en kontrollplan", "Føre klimalogg og avvik", "Levere komplett sluttdokumentasjon", "Kjenne HMS- og miljøkravene i faget"], "punkter": ["Kontroller hvert skjulte trinn før det dekkes til.", "En klimalogg med luft, underlag, RF og duggpunkt hindrer de fleste produktfeil.", "Avvik meldes og avklares før arbeidet fortsetter.", "Vann fra vannmeisling har høy pH og må samles opp og renses før det slippes ut."], "kort": [{"id": "16-1", "q": "Nevn fem ting som bør stå i sluttdokumentasjonen.", "a": "«Som utført»-kart, kontrollskjemaer, klimalogger og testresultater. Dessuten produktdokumentasjon med batchnumre, foto og FDV."}, {"id": "16-2", "q": "Hvorfor er klimalogg så viktig?", "a": "Fordi mange produktfeil skyldes arbeid utenfor produktets grenser for temperatur, fukt og duggpunkt."}, {"id": "16-3", "q": "Hva gjør du hvis mengden skade er dobbelt så stor som beskrevet?", "a": "Du stanser, dokumenterer og melder avvik til byggherre eller rådgiver. Avklar før du fortsetter."}, {"id": "16-4", "q": "Hvilket vern trengs ved pigging og blåsing?", "a": "Støvreduksjon eller avsug og P3-åndedrettsvern, i tillegg til hørselvern og vernebriller. Bruk vibrasjonsdempet verktøy."}, {"id": "16-r1", "q": "Hvordan måles ruheten på en forbehandlet betongflate i felt?", "a": "Med sandflekkmetoden (NS-EN 1766). Du stryker ut et kjent volum fin sand til en rund flekk, og diameteren gir gjennomsnittlig ruhetsdybde."}], "tall": []}, {"nr": 17, "tittel": "Kontrakt, beskrivelse og måleregler", "mal": ["Forstå hvordan beskrivelser og måleregler fordeler risiko", "Kjenne typiske måleenheter for rehabiliteringsarbeid", "Kalkulere med realistiske påslag"], "punkter": ["Bruk enhetspriser, og reguler etter mengdene som faktisk blir målt opp.", "Mål opp og dokumenter feltene i fellesskap før du mørtler.", "Pris injeksjonsmaterialet for seg, fordi forbruket varierer mye."], "kort": [{"id": "17-1", "q": "Når må oppmåling av et reparasjonsfelt gjøres?", "a": "Før du mørtler – helst i fellesskap, med bilder og signatur. Etterpå kan ingen se hvor dypt det var."}, {"id": "17-2", "q": "Hvorfor er små, spredte felt dyrere per m²?", "a": "Fordi rigg, tilkomst, oppstart og herding koster det samme uansett hvor stort feltet er."}, {"id": "17-3", "q": "Hvilken håndbok har Statens vegvesen brukt for beskrivelser på bruer og kaier?", "a": "R762 Prosesskode 2, hovedprosess 8. Fra 2025 er den slått sammen med R761."}], "tall": []}, {"nr": 18, "tittel": "Caser – fra funn til ferdig reparasjon", "mal": [], "punkter": [], "kort": [], "tall": []}, {"nr": 19, "tittel": "Fordypning: korrosjon, hastighet og levetid", "mal": ["Forklare hvorfor lite tæring er nok til å sprenge overdekningen", "Kjenne igjen situasjoner med «svart rust» uten synlige skader", "Regne om korrosjonsstrøm til tæring og tolke LPR-målinger", "Bruke Ficks 2. lov og kjenne fallgruvene i levetidsberegninger", "Forklare risikoen for hydrogensprøhet i spennarmering"], "punkter": ["Rust tar mange ganger større volum enn stålet. Derfor kan riss komme allerede ved under 0,1 mm tæring.", "I vannmettet betong med lite oksygen kan stålet tæres kraftig uten at det blir riss. Det kalles «svart rust».", "1 µA/cm² tilsvarer ca. 11,6 µm/år. LPR-målinger er i beste fall nøyaktige innen en faktor 2–4.", "Kloridterskelen avhenger av sementtype, fukt og oksygen. I luftet betong er risikoen lav under ca. 0,4 % og høy over ca. 1 % av sementvekt.", "Dapp, den tilsynelatende diffusjonskoeffisienten, avtar med alderen. Se bort fra de ytterste millimeterne, og ta prøver i flere høyder.", "Groptæring på spennstål kan gi hydrogensprøhet. Derfor foretrekkes galvanisk KB på spennarmering."], "kort": [{"id": "19-1", "q": "Målt korrosjonshastighet er 0,3 µA/cm². Hvor mye jevn tæring gir det på 15 år?", "a": "0,3 × 11,6 ≈ 3,5 µm/år. På 15 år blir det ca. 52 µm (0,05 mm) – nok til å gi riss i mange tilfeller."}, {"id": "19-2", "q": "Hvorfor kan armering under en lekk membran være kraftig korrodert uten riss?", "a": "Fordi det er lite oksygen. Jernet blir da værende i oppløsning i stedet for å danne ekspansiv rust («svart rust»), så sprengtrykket som gir riss, uteblir."}, {"id": "19-3", "q": "Hvorfor ser man ofte bort fra de første 5–10 mm i en kloridprofil?", "a": "Fordi overflatesonen påvirkes av utvasking, kapillærsug og avdamping, ikke bare av diffusjon. Den forstyrrer tilpasningen til Ficks lov."}, {"id": "19-4", "q": "Hvorfor gir kloridprofiler tatt de første årene ofte for pessimistisk prognose?", "a": "Fordi den tilsynelatende diffusjonskoeffisienten avtar med alderen, særlig i betong med flygeaske og slagg. Tidlige målinger gir derfor for høy D."}, {"id": "19-5", "q": "Nevn to situasjoner der hydrogen kan dannes på spennstål.", "a": "Inne i korrosjonsgroper i kloridholdig betong, der pH er svært lav. Og ved svært negative potensialer, for eksempel ved for kraftig katodisk beskyttelse eller ved realkalisering og kloriduttrekk med høy spenning."}, {"id": "19-r1", "q": "Hva er forskjellen på kloridklassen for ny betong (f.eks. Cl 0,20) og et kritisk kloridinnhold ved vurdering av en eksisterende konstruksjon?", "a": "Kloridklassen er en materialgrense for hvor mye klorid ny betong totalt kan inneholde: typisk Cl 0,20–0,40 for armert og Cl 0,10–0,20 for spennarmert betong. I Norge brukes fortrinnsvis Cl 0,20, og R762 krever Cl 0,10 for betong og mørtel på bruer og kaier. Når du vurderer en eksisterende konstruksjon, brukes ofte rundt 0,5 % som nivå for nærmere vurdering. Den reelle terskelen er en fordeling – under ca. 0,25 % er depassivering ikke funnet."}], "tall": [{"id": "t19-1", "q": "Rust tar mange ganger større volum enn stålet. Riss kan komme allerede under ____ tæring.", "a": "0,1 mm", "hel": "Rust tar mange ganger større volum enn stålet. Riss kan komme allerede under 0,1 mm tæring."}, {"id": "t19-3", "q": "1 µA/cm² ≈ ____/år. LPR-målinger er i beste fall nøyaktige innen en faktor 2–4.", "a": "11,6 µm", "hel": "1 µA/cm² ≈ 11,6 µm/år. LPR-målinger er i beste fall nøyaktige innen en faktor 2–4."}, {"id": "t19-4", "q": "Kloridterskelen avhenger av sementtype, fukt og oksygen. Lav risiko under ca. ____ og høy over ca. 1 % av sementvekt i luftet betong.", "a": "0,4 %", "hel": "Kloridterskelen avhenger av sementtype, fukt og oksygen. Lav risiko under ca. 0,4 % og høy over ca. 1 % av sementvekt i luftet betong."}]}, {"nr": 20, "tittel": "Fordypning: tiltak som virker – og tiltak som ikke gjør det", "mal": ["Forklare de vanligste årsakene til at reparasjoner svikter", "Vurdere realistisk hva belegg, silan og membraner kan oppnå", "Vurdere bruk av inhibitorer kritisk", "Velge mellom typer galvaniske anoder og korrosjonsbestandig armering", "Planlegge monitorering og bruke en beslutningsflyt for metodevalg"], "punkter": ["Ringanoder, lastomfordeling, undervurderte mengder og manglende herding er vanlige årsaker til at reparasjoner svikter.", "Belegg kan kontrollere korrosjon fra karbonatisering, men stopper ikke kloridkorrosjon som allerede har startet.", "Innblandet kalsiumnitritt er godt dokumentert. Inhibitorer som påføres herdnet betong, har svak dokumentasjon fra felt.", "Galvaniske anoder er enkle, men har begrenset strøm og levetid. Skal de oppfylle ISO 12696, må de overvåkes.", "Rustfritt stål som er beiset og fritt for sveise- og glødeskall, kan trygt blandes med vanlig armering. Bruk det gjerne selektivt i utsatte soner.", "Før elektrokjemiske tiltak må du avklare kontinuitet, kortslutninger, isolerende lag, AKR, spennarmering og strømforsyning."], "kort": [{"id": "20-1", "q": "Hvorfor kan KB bli billigere enn tradisjonell reparasjon på en kloridskadet viadukt?", "a": "Fullstendig fjerning av forurenset betong krever ofte avstivning og mye arbeid. Med KB reparerer du bare løs betong, og korrosjonen stoppes over hele flaten."}, {"id": "20-2", "q": "Hvorfor stopper ikke et tett belegg kloridkorrosjon som har startet?", "a": "Fordi det er nok fukt og oksygen i porene. Kloridsaltene trekker dessuten til seg fukt, så korrosjonen fortsetter ved den fuktigheten som er vanlig i norsk klima."}, {"id": "20-3", "q": "Hva er risikoen ved underdosering av inhibitor?", "a": "Da risikerer du små, svært aktive anoder med groptæring."}, {"id": "20-4", "q": "Kan rustfritt stål brukes sammen med vanlig armering ved reparasjon?", "a": "Ja, når det rustfrie stålet er beiset og fritt for sveise- og glødeskall. Med skall blir det en bedre katode og kan gi galvanisk korrosjon på karbonstålet. Rent rustfritt stål er en dårlig katode og driver korrosjon på karbonstål mindre enn passivt karbonstål gjør. Det kan dessuten begrense ringanodeeffekten."}, {"id": "20-5", "q": "Hva viser en galvanisk «stigeprobe»?", "a": "Den viser når klorid- eller karbonatiseringsfronten når hver elektrode, som står i ulike dybder. Slik får du varsel før fronten når armeringen."}, {"id": "20-6", "q": "Nevn fire forutsetninger som må sjekkes før KB.", "a": "Elektrisk kontinuitet, ingen kortslutninger og ingen isolerende lag. Du må også vurdere risikoen for spennarmering og AKR, sikre strømforsyningen og ha en organisasjon for drift."}], "tall": []}, {"nr": 21, "tittel": "Utførelse: forskaling, armering, utstøping og herding", "mal": ["Forklare hvordan NS-EN 13670 og utførelsesklassene styrer kontrollen på byggeplass", "Kontrollere forskaling og armering før støp", "Ta imot, støpe ut og vibrere betong riktig", "Velge herdetiltak etter temperatur og vær, også i kulde og varme", "Koble utførelsesfeil til V441-årsakskodene du finner ved inspeksjon"], "punkter": ["NS-EN 13670 styrer utførelsen. Utførelsesklasse 1–3 bestemmer hvor mye som skal kontrolleres.", "Forskalingen må tåle betongtrykket, være tett og ren og stå lenge nok.", "Overdekningen er det viktigste for bestandigheten. Den lages med avstandsholdere og kontrolleres før støp.", "Sjekk følgeseddelen før lasset tømmes. Tilsett aldri vann på plassen.", "Støp i lag på ca. 0,5 m. Vibrer ned i laget under, og la virkeområdene overlappe.", "Herdingen beskytter overdekningen. Herdeklasse 1–4 angir hvor langt betongen skal herdes.", "Når det er kaldere enn +5 °C, må betongen varmes og beskyttes til den tåler frost."], "kort": [{"id": "21-1", "q": "Hvilken standard styrer utførelsen av betongarbeider, og hva bestemmer utførelsesklassen?", "a": "NS-EN 13670 med nasjonalt tillegg. Utførelsesklassen (1–3) bestemmer hvor mye kontroll og dokumentasjon som kreves. Klasse 3 brukes for konstruksjoner med høy konsekvens, som bruer og kaier."}, {"id": "21-2", "q": "Hvorfor kan SKB gi høyere trykk på forskalingen enn vanlig betong?", "a": "Fordi SKB er flytende og ikke vibreres. Den kan gi fullt væsketrykk over hele høyden, særlig når den stiger raskt i forskalingen."}, {"id": "21-3", "q": "Hva er nominell overdekning, og hvordan sikrer du den i praksis?", "a": "Minste overdekning pluss et tillegg for avvik i utførelsen, typisk 10 mm. Du sikrer den med avstandsholdere med riktig høyde og tetthet, og kontrollerer den før støp."}, {"id": "21-4", "q": "Hva kontrollerer du på følgeseddelen før et lass tømmes?", "a": "At fasthetsklasse, bestandighets- og eksponeringsklasse, Dmaks, konsistensklasse og tilsetningsstoffer er riktige – og at mengde og blandetidspunkt stemmer."}, {"id": "21-5", "q": "Hvorfor skal vibratoren ned i laget under?", "a": "Fordi vibratoren da syr lagene sammen, slik at det ikke blir en svak skjøt mellom dem."}, {"id": "21-6", "q": "Hva er en kaldstøp, og hvordan unngår du den?", "a": "En svak og porøs skjøt som oppstår når forrige lag har begynt å stivne før neste legges på. Du unngår den ved å støpe neste lag i tide og vibrere ned i laget under."}, {"id": "21-7", "q": "Hva betyr herdeklasse 3?", "a": "At betongen skal herdes til den har nådd 50 % av spesifisert karakteristisk fasthet."}, {"id": "21-8", "q": "Hvorfor gir dårlig herding raskere armeringskorrosjon?", "a": "Fordi overflaten – altså overdekningen – tørker ut og blir porøs. Da trenger CO₂ og klorider raskere inn til armeringen."}, {"id": "21-9", "q": "Lufttemperaturen er −5 °C. Hvilken temperatur bør den ferske betongen minst ha?", "a": "Minst +10 °C, fordi lufta er under −3 °C (ellers minst +5 °C). Betongen må så beskyttes til den er frostsikker: ca. 5 MPa, eller minst +10 °C i 3 døgn. Grensene er hentet fra tyske regler (Zement-Merkblatt B 8 og B 21)."}, {"id": "21-10", "q": "Du finner steinreir og liten overdekning ved en inspeksjon. Hvilke V441-årsakskoder er aktuelle?", "a": "For steinreiret: 33 Feil utstøpning eller 34 Manglende bearbeiding. For den lille overdekningen: 32 Feilplassert armering."}, {"id": "21-11", "q": "Hvorfor må Mapecure 1 fjernes før en flate males eller får påstøp?", "a": "Fordi herdemembranen er en voksfilm som svekker heften til maling, mørtel og ny betong. Den må derfor fjernes helt."}], "tall": [{"id": "t21-1", "q": "Utførelse styres av NS-EN ____ med nasjonalt tillegg.", "a": "13670", "hel": "Utførelse styres av NS-EN 13670 med nasjonalt tillegg."}, {"id": "t21-2", "q": "Støp i lag på ca. ____ og vibrer ned i laget under.", "a": "0,5 m", "hel": "Støp i lag på ca. 0,5 m og vibrer ned i laget under."}, {"id": "t21-3", "q": "Vibratoren skal minst ca. ____ ned i laget under.", "a": "150 mm", "hel": "Vibratoren skal minst ca. 150 mm ned i laget under."}, {"id": "t21-4", "q": "Herdeklasse 4 betyr herding til ____ av karakteristisk fasthet.", "a": "70 %", "hel": "Herdeklasse 4 betyr herding til 70 % av karakteristisk fasthet."}, {"id": "t21-5", "q": "Ung betong tåler én frysing når den har nådd ca. ____.", "a": "5 MPa", "hel": "Ung betong tåler én frysing når den har nådd ca. 5 MPa."}, {"id": "t21-6", "q": "Temperaturforskjellen mellom kjerne og overflate bør holdes under ca. ____.", "a": "20 K", "hel": "Temperaturforskjellen mellom kjerne og overflate bør holdes under ca. 20 K."}]}, {"nr": 22, "tittel": "Betongsammensetning og produksjonskontroll", "mal": ["Lese og forstå en betongspesifikasjon etter NS-EN 206 med nasjonalt tillegg", "Forklare hvordan en betongresept proporsjoneres, steg for steg", "Prøve fersk og herdet betong og vite hva resultatene betyr", "Bruke enkel statistikk og samsvarskriteriene i NS-EN 206", "Bruke den samme tankegangen på reparasjonsmørtler"], "punkter": ["En spesifikasjon etter NS-EN 206 består av fasthetsklasse, eksponerings- og bestandighetsklasse, Dmaks, konsistens og kloridklasse.", "Bestandighetsklassen setter et tak på masseforholdet, og ofte er det dette som styrer resepten.", "Proporsjoneringen går i denne rekkefølgen: målfasthet, v/c, vann, sement, luft, tilslag og til slutt prøveblanding.", "På fersk betong kontrolleres synkmål, utbredelse, luft, densitet og temperatur.", "fck = fcm − 1,64σ. Jo lavere spredning, desto billigere betong.", "Ved kontinuerlig produksjon gjelder fcm ≥ fck + 1,48σ, og hvert resultat må være ≥ fck − 4 MPa på sylinder. På terning gjelder ± 5 MPa.", "Reparasjonsmørtler kontrolleres etter samme logikk, med klasse R1–R4 og heftprøving."], "kort": [{"id": "22-1", "q": "Forklar hva hver del av spesifikasjonen B35 M45 XC4 XS1 Dmaks 22 S4 betyr.", "a": "B35: karakteristisk sylinderfasthet 35 MPa (C35/45). M45: bestandighetsklasse med masseforhold høyst 0,45. XC4: eksponering for karbonatisering. XS1: eksponering for klorider fra sjøvann – tallet viser hvor strengt miljøet er. Dmaks 22: største tilslag er 22 mm. S4: konsistensklasse målt som synkmål."}, {"id": "22-2", "q": "Hvorfor er det ofte bestandighetsklassen og ikke fasthetsklassen som bestemmer sementmengden?", "a": "Fordi bestandighetsklassen setter et tak på masseforholdet, og det taket er ofte lavere enn det fastheten krever. Det laveste v/c-tallet styrer."}, {"id": "22-3", "q": "En betong skal ha v/c 0,40 og 170 kg vann per m³. Hvor mye sement trengs?", "a": "Sement = vann / v/c = 170 / 0,40 = 425 kg/m³."}, {"id": "22-4", "q": "Hvorfor må middelfastheten ligge høyere enn den karakteristiske fastheten?", "a": "Fordi resultatene sprer seg. Den karakteristiske fastheten er 5 %-fraktilen, så middelet må ligge ca. 1,64 standardavvik over."}, {"id": "22-5", "q": "Produksjonen har σ = 3 MPa. Hvor høy må middelfastheten være for en C35/45 ved kontinuerlig produksjon (sylinder)?", "a": "fcm ≥ 35 + 1,48 · 3 = 39,4 MPa. I tillegg må hvert enkelt resultat være minst 31 MPa."}, {"id": "22-6", "q": "Hva kan det bety at synkmålet plutselig øker fra lass til lass?", "a": "Det kan være for mye vann (våt sand, feil dosering eller vann tilsatt) eller feil dosering av plastiserende stoff. Begge deler gir lavere fasthet og bestandighet."}, {"id": "22-7", "q": "Hvilken prøving viser om en frostbestandig betong har nok luft?", "a": "Måling av luftinnholdet med trykkmetoden etter NS-EN 12350-7."}, {"id": "22-8", "q": "Hva er et kontrollkort, og hvorfor er det nyttig?", "a": "En fortløpende oversikt over resultatene, for eksempel løpende middel eller CUSUM. Den avslører endringer i produksjonen tidlig, før enkeltresultater faller under kravet."}, {"id": "22-9", "q": "Hvordan bruker du tankegangen fra betongkontroll når du kontrollerer en reparasjonsmørtel?", "a": "Spesifiser riktig klasse (R1–R4) og bland med nøyaktig vannmengde. Ta prøver etter kontrollplanen, heftprøv både prøvefelt og ferdig arbeid, og sørg for sporbarhet med batchnummer og temperatur."}, {"id": "22-10", "q": "Hvilken klasse etter NS-EN 1504-3 har DS og Mapegrout T60, og hva betyr det?", "a": "R4. Det er den høyeste klassen for konstruktive reparasjonsmørtler, med de strengeste kravene til fasthet og heft."}], "tall": [{"id": "t22-1", "q": "Karakteristisk fasthet: fck = fcm − ____ · σ.", "a": "1,64", "hel": "Karakteristisk fasthet: fck = fcm − 1,64 · σ."}, {"id": "t22-2", "q": "Kontinuerlig produksjon: fcm ≥ fck + ____ · σ.", "a": "1,48", "hel": "Kontinuerlig produksjon: fcm ≥ fck + 1,48 · σ."}, {"id": "t22-3", "q": "Hvert enkelt resultat må være minst fck − ____ (sylinder; terning: − 5 MPa).", "a": "4 MPa", "hel": "Hvert enkelt resultat må være minst fck − 4 MPa (sylinder; terning: − 5 MPa)."}, {"id": "t22-4", "q": "Bestandighetsklasse M45 tillater høyst masseforhold ____.", "a": "0,45", "hel": "Bestandighetsklasse M45 tillater høyst masseforhold 0,45."}, {"id": "t22-5", "q": "Synkmål måles etter NS-EN ____.", "a": "12350-2", "hel": "Synkmål måles etter NS-EN 12350-2."}, {"id": "t22-6", "q": "Frostbestandig betong har typisk ____ innført luft (SVV: 4,5 ± 1,5 % t.o.m. B45, 3,5 ± 1,5 % over B45).", "a": "4–6 %", "hel": "Frostbestandig betong har typisk 4–6 % innført luft (SVV: 4,5 ± 1,5 % t.o.m. B45, 3,5 ± 1,5 % over B45)."}]}, {"nr": 23, "tittel": "Sprøytebetong og sprøytemørtel", "mal": ["Skille mellom tørrsprøyting og våtsprøyting og vite når de brukes", "Forberede et reparasjonsfelt for sprøyting", "Sprøyte med riktig avstand, vinkel og lagtykkelse", "Måle og begrense prelltap", "Kontrollere sprøytebetongen med prøveplater, kjerner og heftprøving"], "punkter": ["Våtsprøyting gir høy kapasitet og jevnere kvalitet. Tørrsprøyting passer for små felt og lange transportavstander.", "Skrå kantene ca. 45°, sørg for minst ca. 20 mm åpning bak armeringen, og bruk helst vannmeisling.", "Ved reparasjon sprøyter du vinkelrett på flaten, med ca. 0,5–1,0 m avstand.", "Uten akselerator er grensen ca. 30 mm per lag i tak og 50 mm på vegg, med ca. 3–5 timer mellom lagene ved +20 °C. Databladet kan tillate mer.", "Bruk ikke stålfiber bak armeringen. Skygger bak stengene er den alvorligste feilen.", "Prelltap måles ved å samle det opp på plast og oppgi det som prosent av sprøytet masse.", "Sprøytebetongen kontrolleres med prøveplater, kjerner, heftprøving og bankeprøve."], "kort": [{"id": "23-1", "q": "Nevn to fordeler med våtsprøyting og én fordel med tørrsprøyting.", "a": "Våtsprøyting gir høyere kapasitet, kontrollert v/c-tall og mindre støv og prelltap. Tørrsprøyting tåler lange transportavstander og er enkel å stoppe og starte ved små felt."}, {"id": "23-2", "q": "Hvorfor skal kantene på et reparasjonsfelt skrås før sprøyting?", "a": "Fordi rette hjørner fanger prelltap, som blir til porøse lommer. Skrå kanter (ca. 45°) gir god oppbygging."}, {"id": "23-3", "q": "Hvor stor åpning bør det være bak armeringen?", "a": "Minst ca. 20 mm, slik at sprøytebetongen kan omslutte stengene helt."}, {"id": "23-4", "q": "Hva skjer hvis dysen holdes for nær eller for langt fra flaten?", "a": "For nær: Strålen vasker bort materialet. For langt: Støtet blir for svakt til å komprimere og feste laget. Begge deler gir mye prelltap."}, {"id": "23-5", "q": "Hvorfor skal dysen holdes vinkelrett på flaten?", "a": "Fordi materialet spretter av i samme vinkel som det treffer. En skrå vinkel gir mer prelltap og dårligere komprimering."}, {"id": "23-6", "q": "Hvor tykt kan et lag være i tak uten akselerator, ifølge EFNARC?", "a": "Høyst ca. 30 mm per lag. Det første laget bygges opp til 10 mm forbi armeringen."}, {"id": "23-7", "q": "Hvorfor skal det ikke brukes stålfiber bak armeringen?", "a": "Fordi fibrene hindrer at stengene blir helt omsluttet. Det øker risikoen for hulrom og dårlig komprimering."}, {"id": "23-8", "q": "Hvorfor får sprøytebetongen som blir sittende, mer pasta enn blandingen?", "a": "Fordi prellen mest består av grovt tilslag. Det som blir sittende, får derfor relativt mer sementpasta."}, {"id": "23-9", "q": "Hva er en skygge, og hvordan unngår du den?", "a": "Et hulrom bak en armeringsstang. Du unngår den med nok åpning bak stengene, riktig vinkling av dysen bak stengene og ved å fjerne prell med blåserør."}, {"id": "23-10", "q": "Hvordan lages og behandles en prøveplate?", "a": "Den sprøytes av samme dysefører, med samme utstyr og i samme stilling som arbeidet. Platen beskyttes straks mot uttørking, flyttes ikke de første 18 timene og herdes videre før kjerner eller prøver tas ut."}, {"id": "23-11", "q": "Hvilken Mapei-mørtel bruker du for å dekke anodenett ved katodisk beskyttelse, og hvor tykt kan hvert lag være?", "a": "DS-CP (R3). Den kan legges ca. 40 mm per lag uten forskaling."}], "tall": [{"id": "t23-1", "q": "Ved reparasjon holdes dysen ca. ____ fra flaten.", "a": "0,5–1,0 m", "hel": "Ved reparasjon holdes dysen ca. 0,5–1,0 m fra flaten."}, {"id": "t23-2", "q": "Ved sprøyting skrås kanter på reparasjonsfeltet ca. ____ (håndpåføring: ca. 90°).", "a": "45°", "hel": "Ved sprøyting skrås kanter på reparasjonsfeltet ca. 45° (håndpåføring: ca. 90°)."}, {"id": "t23-3", "q": "Det bør være minst ca. ____ åpning bak armeringen.", "a": "20 mm", "hel": "Det bør være minst ca. 20 mm åpning bak armeringen."}, {"id": "t23-4", "q": "Uten akselerator: høyst ____ per lag i tak.", "a": "30 mm", "hel": "Uten akselerator: høyst 30 mm per lag i tak."}, {"id": "t23-5", "q": "Uten akselerator: høyst ____ per lag på vegg.", "a": "50 mm", "hel": "Uten akselerator: høyst 50 mm per lag på vegg."}, {"id": "t23-6", "q": "Prøveplaten skal ikke flyttes de første ____.", "a": "18 timene", "hel": "Prøveplaten skal ikke flyttes de første 18 timene."}]}];
const MCQ = {"1": [{"id": "m1-1", "q": "Hvorfor kommer en skade ofte tilbake etter at en avskalling er reparert?", "rett": "Skadeårsaken virker fortsatt", "feil": ["Reparasjonsmørtelen er alltid svakere enn betongen", "Det ble brukt for lite primer", "Avskallinger kan ikke repareres"], "forkl": "En reparasjon som bare fjerner symptomet, holder ikke. Karbonatiseringen eller kloridene fortsetter å virke, og skaden kommer tilbake."}, {"id": "m1-2", "q": "Hva er riktig rekkefølge i rehabiliteringsprosessen?", "rett": "Tilstandsanalyse → strategi → prosjektering → utførelse → bruksfase", "feil": ["Strategi → tilstandsanalyse → prosjektering → utførelse → bruksfase", "Tilstandsanalyse → prosjektering → utførelse → strategi → bruksfase", "Prosjektering → tilstandsanalyse → strategi → utførelse → bruksfase"], "forkl": "Først må du vite hva som er galt. Så velger du strategi, prosjekterer og utfører – og til slutt følges konstruksjonen opp i bruksfasen."}, {"id": "m1-3", "q": "Hva er den vanligste skadeårsaken på betong i Norge?", "rett": "Armeringskorrosjon fra karbonatisering eller klorider", "feil": ["Alkalireaksjoner (AKR) mellom tilslag og sement", "Frostskader fra gjentatt frysing og tining med salt", "Sulfatangrep fra grunnvann, jord og avløpsvann"], "forkl": "Korrosjon på armeringen, fra karbonatisering eller klorider, er klart den vanligste skadeårsaken."}, {"id": "m1-4", "q": "Hvilken del av NS-EN 1504 gir prinsippene for reparasjon?", "rett": "Del 9", "feil": ["Del 3", "Del 5", "Del 10"], "forkl": "Del 9 gir prinsippene, og del 10 gjelder utførelse og kontroll. Del 3 handler om mørtel og del 5 om injeksjon."}, {"id": "m1-5", "q": "Hvilke tre ting skal tilstandsanalysen kartlegge?", "rett": "Skadeårsak, skadeomfang og skadekonsekvens", "feil": ["Skadeomfang, kostnadsoverslag og tidsplan for jobben", "Skadetype, produktvalg og nødvendig mengde mørtel", "Skadeårsak, garantitid og hvem som skal utføre"], "forkl": "Årsak, omfang og konsekvens – gjerne også hvordan skaden vil utvikle seg. Pris og tidsplan kommer senere."}, {"id": "m1-6", "q": "Hva er hensikten med et prøvefelt?", "rett": "Teste metode, mengder og produkter under de faktiske forholdene", "feil": ["Vise byggherren ferdig farge og overflate før kontrakten signeres", "Erstatte tilstandsanalysen på mindre konstruksjoner uten prøver", "Måle trykkfastheten i den eksisterende betongen før pigging starter"], "forkl": "Prøvefeltet viser om metode, mengder og produkter fungerer i praksis, slik at problemer avdekkes før hele jobben settes i gang."}, {"id": "m1-7", "q": "Hvilke kurs gir normalt grunnlag for kompetansebevis i betongrehabilitering?", "rett": "R-kurset sammen med U1, pluss dokumentert praksis", "feil": ["Fagbrev i betongfaget og minst fem års praksis", "U3-kurset alene, uten krav til dokumentert praksis", "Epoksykurs og varme arbeider sammen med fagbrev"], "forkl": "R-kurset (rehabilitering) og U1 (praktisk betongteknologi), sammen med dokumentert praksis."}], "2": [{"id": "m2-1", "q": "Hva er normal pH i porevæsken i ny betong med portlandsement?", "rett": "Ca. 13–14", "feil": ["Ca. 7", "Ca. 9", "Ca. 11"], "forkl": "Porevæsken er sterkt basisk, og det gir stålet en beskyttende passivfilm. Slagg, flygeaske og silika gir litt lavere pH."}, {"id": "m2-2", "q": "Hva slags korrosjon gir klorider typisk?", "rett": "Lokal groptæring", "feil": ["Jevn korrosjon over hele stålet", "Ingen korrosjon før betongen er karbonatisert", "Bare overflaterust uten tverrsnittstap"], "forkl": "Klorider angriper lokalt og gir groptæring, som kan gi stort tverrsnittstap uten store synlige tegn. Det er karbonatisering som gir jevnere korrosjon."}, {"id": "m2-3", "q": "Hva trengs for en korrosjonscelle, i tillegg til oksygen?", "rett": "Anode, katode, elektrisk forbindelse og elektrolytt", "feil": ["Anode, katode, karbonatiseringsfront og høyt kloridinnhold", "Klorider, CO₂, riss i overdekningen og lav overdekning", "Elektrolytt, frost, rissvidde over 0,3 mm og høy temperatur"], "forkl":
