"Stålet er den elektriske forbindelsen, og den fuktige betongen er elektrolytten. Sammen med anode og katode utgjør de cellen."}, {"id": "m2-4", "q": "Hvor mye lengre blir initieringstiden omtrent ved dobbel overdekning?", "rett": "Ca. fire ganger", "feil": ["Ca. dobbelt", "Ca. 1,5 ganger", "Ca. ti ganger"], "forkl": "Fronten beveger seg med √t. Dobbel dybde gir derfor omtrent fire ganger så lang tid, ikke bare dobbelt."}, {"id": "m2-5", "q": "Hvorfor sprekker overdekningen når armeringen ruster?", "rett": "Rustproduktene har større volum enn stålet", "feil": ["Stålet krymper og trekker betongen med seg", "Rusten løser opp sementen", "Rust gjør betongen varmere"], "forkl": "Rusten tar større plass enn stålet den kommer fra. Ekspansjonen gir et sprengtrykk som gir riss og avskalling."}, {"id": "m2-6", "q": "Hvorfor trenger CO₂ nesten ikke inn i vannmettet betong?", "rett": "Gasser diffunderer ca. 10 000 ganger langsommere i vann", "feil": ["Vannet i porene nøytraliserer CO₂ med en gang", "Vannmettet betong har lukkede porer uten forbindelse", "CO₂ omdannes til karbonat i vannet før den når stålet"], "forkl": "Når porene er fulle av vann, må CO₂ diffundere gjennom vannet. Det går så sakte at gasstransporten nesten stopper."}, {"id": "m2-7", "q": "Hvorfor går klorider raskest inn i betong som veksler mellom vått og tørt?", "rett": "Tørr overflate suger saltvann inn ved kapillærsug", "feil": ["Diffusjon går raskest når betongen er tørr og porene åpne", "Kloridene fordamper med vannet og trekkes innover i porene", "Uttørkingen gir riss som kloridene renner rett inn gjennom"], "forkl": "En tørr overflate suger saltvann inn ved kapillærsug, og det går mye raskere enn diffusjon. Diffusjon er hovedmekanismen i vannmettet betong."}, {"id": "m2-8", "q": "Hva skjer i initieringsfasen?", "rett": "CO₂ eller klorider vandrer inn mot armeringen, uten synlige skader", "feil": ["Armeringen ruster, og det kommer riss langs stengene i overdekningen", "Betongen herder videre og får full fasthet etter omtrent 28 døgn", "Rusten sprenger overdekningen, og betongen skaller av i flak"], "forkl": "Initieringsfasen varer til passivfilmen brytes, og så lenge ser du ingen skader. Først da starter propageringsfasen."}], "3": [{"id": "m3-1", "q": "En konstruksjon er 36 år og har 18 mm karbonatiseringsdybde. Hva er k?", "rett": "3,0 mm/√år", "feil": ["0,5 mm/√år", "6,0 mm/√år", "18 mm/√år"], "forkl": "k = x/√t = 18/√36 = 18/6 = 3,0. Du deler målt dybde på kvadratroten av alderen."}, {"id": "m3-2", "q": "En konstruksjon har k = 3,0 mm/√år. Ved hvilken alder når fronten 30 mm?", "rett": "Ved ca. 100 års alder", "feil": ["Ved ca. 10 års alder", "Ved ca. 30 års alder", "Ved ca. 300 års alder"], "forkl": "t = (x/k)² = (30/3)² = 100 år. Er konstruksjonen 36 år i dag, er det altså ca. 64 år igjen."}, {"id": "m3-3", "q": "Ved hvilken relativ fuktighet går karbonatiseringen raskest?", "rett": "Ca. 50–70 % RF", "feil": ["Ca. 20 % RF", "Ca. 95–100 % RF", "Den er uavhengig av fukt"], "forkl": "Da er porene delvis tørre, så CO₂ slipper inn, samtidig som det er nok vann til reaksjonen."}, {"id": "m3-4", "q": "Hva oppgis ofte internasjonalt som nedre grense for korrosjonsrisiko fra klorider?", "rett": "Ca. 0,4 % av sementvekt", "feil": ["Ca. 4 % av sementvekt", "Ca. 0,004 % av sementvekt", "Ca. 0,4 % av betongvekt"], "forkl": "0,4 % av sementvekt tilsvarer ca. 0,05–0,07 % av betongvekt. I norsk praksis brukes ofte 0,07–0,10 % av betongvekt. Terskelen varierer, så oppgi alltid både grense og enhet."}, {"id": "m3-5", "q": "Hva er ringanodeeffekten?", "rett": "Ny korrosjon rundt en reparert lapp", "feil": ["At KB-anoden får form av en ring", "Riss i ringform rundt en søyle", "At reparasjonsmørtelen krymper i ring"], "forkl": "Stålet like utenfor den nye, passive lappen blir anode og begynner å korrodere."}, {"id": "m3-6", "q": "Bremser hydrofobering karbonatisering?", "rett": "Nei, porene er fortsatt åpne for CO₂", "feil": ["Ja, den tetter porene slik at CO₂ ikke slipper inn", "Ja, fordi tørrere betong alltid karbonatiserer langsommere", "Ja, den binder CO₂ i overflatesonen før den når stålet"], "forkl": "Hydrofobering holder vann ute, men porene står åpne for CO₂. Mot karbonatisering trenger du et belegg med høy CO₂-motstand."}, {"id": "m3-7", "q": "Hvordan påviser du AKR sikkert?", "rett": "Plan- eller tynnslip av borkjerner", "feil": ["Fenolftalein på fersk bruddflate", "Potensialkartlegging over hele flaten", "Bankeprøve og måling av rissvidder"], "forkl": "Mikroskopi av plan- eller tynnslip viser alkaligelen og det typiske rissmønsteret."}, {"id": "m3-8", "q": "Hvilket rissmønster er typisk for AKR?", "rett": "Kartmønsterriss", "feil": ["Rette riss langs armeringen", "Ett enkelt horisontalt riss", "Ingen riss, bare misfarging"], "forkl": "AKR gir typisk kartmønsterriss. Reaksjonen kan ikke stoppes, men uttørking kan forsinke den og hindrer følgeskader."}, {"id": "m3-9", "q": "Hvor mye av porene må omtrent være vannfylt før få frostsykluser kan gi skade?", "rett": "Over ca. 80–90 %", "feil": ["Over ca. 20 %", "Over ca. 50 %", "100 % – ellers skjer ingenting"], "forkl": "Dette kalles kritisk metningsgrad. Drenering og hydrofobering holder metningen under grensen."}, {"id": "m3-10", "q": "Hvorfor var sement med lavt C₃A dårlig for mange marine konstruksjoner?", "rett": "Den binder klorider dårlig", "feil": ["Den tåler sulfat dårlig i sjøvann", "Den herder for sakte i kaldt sjøvann", "Den gir mer AKR i marint miljø"], "forkl": "Sulfatbestandig sement er ikke automatisk kloridbestandig – lavt C₃A gir dårlig kloridbinding."}, {"id": "m3-r1", "q": "Hvorfor ruster armeringen ofte raskt i et kloridholdig riss?", "rett": "Stålet i risset blir anode, mens stålet på hver side blir en stor katode", "feil": ["Risset gjør at betongen rundt stålet får høyere pH og sterkere passivfilm", "Kloridene i risset reagerer med sementen og danner et tett beskyttende lag", "Risset hindrer oksygen i å nå stålet, så stålet på sidene blir anode"], "forkl": "Den lille anoden i risset og den store katoden på hver side – minst ca. 30 cm – danner en kraftig makrocelle. Det gir dyp groptæring i risset."}, {"id": "m3-r2", "q": "Hva viser fenolftalein langs et riss der vann har rent gjennom i mange år?", "rett": "Ingen rødfarge nær risset fordi alkaliene er vasket ut", "feil": ["Sterk rødlilla farge helt inn til rissflatene", "Blå farge der det er klorider langs risset", "Gul farge der stålet har begynt å ruste"], "forkl": "Utvaskingen senker pH langs risset, så indikatoren slår ikke ut der."}], "4": [{"id": "m4-1", "q": "Hva viser fenolftalein på en fersk bruddflate når den blir rødlilla?", "rett": "Betongen er ikke karbonatisert (pH over ca. 9)", "feil": ["Betongen er karbonatisert (pH under ca. 9)", "Betongen har klorider over kritisk grense", "Armeringen bak flaten korroderer aktivt"], "forkl": "Fargeløs flate betyr karbonatisert betong. Blir flaten rødlilla, er pH fortsatt høy, og betongen er ikke karbonatisert."}, {"id": "m4-2", "q": "Hvorfor skal fenolftalein ikke sprayes på en saget flate?", "rett": "Sagestøvet smører indikatoren utover og gir feil avlesning", "feil": ["Indikatoren virker bare på våte, nyborede flater", "Sagingen varmer opp flaten og endrer fargen", "Kjølevannet fra sagen vasker ut karbonatiseringen"], "forkl": "Støvet fra sagingen smører indikatoren utover flaten, og avlesningen blir feil. Bruk en fersk bruddflate."}, {"id": "m4-3", "q": "Hva forteller potensialkartlegging?", "rett": "Sannsynlighet for korrosjon, ikke hastighet", "feil": ["Nøyaktig hvor fort armeringen korroderer", "Kloridinnholdet ved armeringsdybde", "Hvor dypt karbonatiseringen har gått"], "forkl": "Potensialet sier noe om sannsynlighet, ikke hastighet. Se på gradientene og bekreft med åpninger."}, {"id": "m4-4", "q": "Potensialet er −400 mV mot Cu/CuSO₄. Hva er riktig tolkning?", "rett": "Høy sannsynlighet for korrosjon, men det må bekreftes", "feil": ["Stålet korroderer garantert og må repareres straks", "Stålet er passivt fordi verdien er under −500 mV", "Målingen er ugyldig fordi den er mer negativ enn 0"], "forkl": "Fukt, oksygen og belegg påvirker målingen, så bekreft med en åpning."}, {"id": "m4-5", "q": "Hva forteller lav resistivitet (under 10 kΩ·cm)?", "rett": "Fuktig og/eller kloridholdig betong som leder godt", "feil": ["Tørr og tett betong som leder strøm dårlig", "Karbonatisert betong med lav pH ved stålet", "At armeringen mangler eller ikke har kontinuitet"], "forkl": "Betongen leder strøm godt fordi den er fuktig eller kloridholdig. Er stålet depassivert, kan korrosjonen gå raskt."}, {"id": "m4-6", "q": "Du måler svært negative potensialer ved foten av en søyle i fuktig terreng, men ser ingen skader. Hva er mest sannsynlig?", "rett": "Oksygenmangel i vannmettet betong, ikke sikkert aktiv korrosjon", "feil": ["Kraftig aktiv korrosjon som må repareres med en gang før den sprer seg", "Feil på referanseelektroden, så hele målingen må forkastes og tas på nytt", "Kloridinnhold over terskelen i hele søylefoten, også uten synlige riss"], "forkl": "Lite oksygen i vannmettet betong gir svært negative potensialer. Mål korrosjonshastigheten eller åpne for å kontrollere."}, {"id": "m4-7", "q": "Hva skal tilstandsrapporten gi?", "rett": "Årsak, omfang, konsekvens, prognose og tiltak", "feil": ["Bilder, skisser, mengder og pris per m²", "Produktvalg, leverandør, pris og tidsplan", "Skadetype, foto, posisjon og hvem som målte"], "forkl": "Rapporten er grunnlaget for strategien, så den må svare på årsak, omfang, konsekvens, prognose og tiltak."}, {"id": "m4-8", "q": "Hva kjennetegner registreringsnivå 3 i NS 3424?", "rett": "Spesielt inngående, med prøvetaking og lab", "feil": ["Generell og visuell, uten målinger", "Inngående, med enkle målinger på stedet", "Visuell kontroll med drone og 3D-modell"], "forkl": "Nivå 1 er visuelt, nivå 2 har enkle målinger, og nivå 3 tar i tillegg prøver til laboratoriet."}, {"id": "m4-r1", "q": "Hvilken metode gir det absolutte fuktinnholdet og brukes til å kalibrere de andre?", "rett": "Tørkemetoden (veiing før og etter tørking ved 105 °C)", "feil": ["CM-metoden med karbidampulle og trykkflaske", "Elektrisk fuktmåler med elektroder mot overflaten", "RF-måling i et tettet borehull etter ett døgn"], "forkl": "Tørkemetoden er referansen. CM-metoden og elektriske målere er raske, men kan gi store feil uten kalibrering."}, {"id": "m4-r2", "q": "Hvorfor injiserer du harpiks i risset før du borer en kjerne for å måle rissdybden?", "rett": "Harpiksen holder kjernen sammen så dybde og vidde kan måles", "feil": ["Harpiksen gjør risset synlig ved ultralydmåling etterpå", "Harpiksen stopper vannet slik at boringen kan skje tørt", "Harpiksen øker fastheten så kjernen tåler laboratorieprøving"], "forkl": "Uten harpiks deler kjernen seg ofte i risset. Harpiksen holder bitene sammen, så du kan måle dybde og vidde direkte."}], "5": [{"id": "m5-1", "q": "Hva beskriver skadegrad i V441?", "rett": "Hvor ille skaden er", "feil": ["Hva som rammes", "Hvorfor skaden oppsto", "Hva slags skade det er"], "forkl": "Skadegrad sier hvor ille skaden er. Skadetype sier hva slags skade det er, og skadeårsak hvorfor den oppsto."}, {"id": "m5-2", "q": "Hva betyr skadegrad 3?", "rett": "Stor skade", "feil": ["Liten skade", "Middels skade", "Svært stor skade"], "forkl": "Skalaen går fra 1 liten og 2 middels til 3 stor og 4 svært stor skade."}, {"id": "m5-3", "q": "Hvilken konsekvenstype står T for?", "rett": "Trafikksikkerhet", "feil": ["Tæring", "Tilstand", "Tetthet"], "forkl": "B står for bæreevne, T trafikksikkerhet, V vedlikeholdskostnader og M miljø og estetikk."}, {"id": "m5-4", "q": "Hva skal skje ved konsekvensgrad 4?", "rett": "Forvalter varsles umiddelbart, og varslingen dokumenteres", "feil": ["Skaden registreres og følges opp ved neste hovedinspeksjon", "Tiltak registreres i Brutus og inspeksjonsintervall vurderes", "Skaden kontrolleres på nytt innen ett år før noe gjøres"], "forkl": "Konsekvensgrad 4 krever umiddelbar varsling. Registrering av tiltak i Brutus hører til konsekvensgrad 3."}, {"id": "m5-5", "q": "Hvilken skadetypekode har avskalling?", "rett": "35", "feil": ["36", "14", "53"], "forkl": "35 er Avskalling og 36 Armeringskorrosjon. Opptrer de sammen, registreres primærskaden 36."}, {"id": "m5-6", "q": "Hvilken skadeårsakskode har karbonatisering?", "rett": "53", "feil": ["52", "35", "17"], "forkl": "53 er Karbonatisering og 52 Kloridangrep. Begge ligger under gruppe 50 Miljøangrep."}, {"id": "m5-7", "q": "Hvilke skadetypekoder har riss og lekkasje?", "rett": "14 og 17", "feil": ["14 og 54", "34 og 17", "35 og 37"], "forkl": "Riss og sprekk har kode 14, som er felles for alle materialer og også står under skade på betong. Lekkasje og fuktbelastning har kode 17, som er materialuavhengig."}, {"id": "m5-8", "q": "Kan en middels skade ha konsekvensgrad 4?", "rett": "Ja, f.eks. løse biter over en gangveg", "feil": ["Nei, skadegrad og konsekvensgrad må være like", "Bare på bruer over 100 m", "Bare hvis skadegraden er 4"], "forkl": "Skadegrad og konsekvensgrad vurderes hver for seg, så også en middels skade kan få høy konsekvens."}, {"id": "m5-v1", "q": "Hvilken inspeksjon er en enkel visuell kontroll over vann uten tilkomstutstyr?", "rett": "Enkelinspeksjon", "feil": ["Hovedinspeksjon", "Spesialinspeksjon", "Generell inspeksjon"], "forkl": "En hovedinspeksjon er derimot en nær visuell kontroll av hele brua."}], "6": [{"id": "m6-1", "q": "Hvilke prinsipper i NS-EN 1504-9 gjelder armeringskorrosjon?", "rett": "7–11", "feil": ["1–6", "1–3", "12–15"], "forkl": "Prinsipp 1–6 gjelder selve betongen, mens 7–11 gjelder armeringskorrosjon."}, {"id": "m6-2", "q": "Hvilket prinsipp er katodisk beskyttelse?", "rett": "Prinsipp 10", "feil": ["Prinsipp 7", "Prinsipp 1", "Prinsipp 3"], "forkl": "Katodisk beskyttelse er prinsipp 10. Sammen med prinsipp 7, gjenopprette passivitet, er det de viktigste ved korrosjon."}, {"id": "m6-3", "q": "Hvilken del av NS-EN 1504 stiller krav til reparasjonsmørtel?", "rett": "Del 3", "feil": ["Del 2", "Del 5", "Del 9"], "forkl": "Del 3 gjelder reparasjonsmørtel. Del 2 gjelder overflatebeskyttelse, del 5 injeksjon og del 9 prinsippene."}, {"id": "m6-4", "q": "Hva er en fullstendig reparasjon?", "rett": "All karbonatisert/kloridholdig betong rundt stålet fjernes", "feil": ["Bare løs og oppsprukket betong fjernes og erstattes med ny mørtel", "Overflaten hydrofoberes etter at alle riss er injisert med epoksy", "All synlig rust males med epoksy før feltet sparkles og males"], "forkl": "Fullstendig reparasjon fjerner all karbonatisert eller kloridholdig betong rundt stålet. Forenklet fjerner bare løs betong."}, {"id": "m6-5", "q": "Hvorfor må du vite om KB kommer senere før du velger mørtel?", "rett": "Isolerende mørtel eller epoksy på stålet stopper strømmen", "feil": ["KB krever en spesiell mørtel med høyt kloridinnhold for å lede strøm", "KB virker bare når armeringen er malt med epoksy før mørtling", "KB krever at mørtelen er av klasse R1 for at strømmen skal gå"], "forkl": "KB krever elektrisk kontakt mellom stål og mørtel. Isolerende mørtel eller epoksy på stålet bryter den kontakten."}, {"id": "m6-6", "q": "Når er KB ofte billigere enn tradisjonell reparasjon?", "rett": "Ved utbredte, dype kloridskader", "feil": ["Ved én liten avskalling", "Ved karbonatisering på 5 mm", "Ved estetiske misfarginger"], "forkl": "Når skadene er dype og spredte, blir det svært dyrt å fjerne all forurenset betong. Da er KB ofte billigere."}, {"id": "m6-7", "q": "Hvorfor kan et tett belegg ikke stoppe korrosjonen ved å stenge ute oksygen?", "rett": "Litt oksygen kommer alltid inn, og ikke alle sider kan belegges", "feil": ["Belegget slipper ut CO₂ og senker dermed pH-en i betongen bak", "Korrosjon trenger ikke oksygen når det først er klorider ved stålet", "Belegget løses opp av den høye pH-en i betongen etter noen år"], "forkl": "Litt oksygen kommer alltid inn, og du får sjelden belagt alle sider. Katodeprosessen kan derfor ikke stoppes pålitelig i luft."}, {"id": "m6-8", "q": "Hvilken metode hører IKKE til prinsipp 7?", "rett": "Hydrofobering", "feil": ["Økt overdekning", "Elektrokjemisk realkalisering", "Kloriduttrekk"], "forkl": "Hydrofobering hører til prinsipp 1, 2 og 8 – beskyttelse mot inntrengning, fuktkontroll og økt resistivitet. De tre andre er metoder under prinsipp 7."}, {"id": "m6-r1", "q": "Hva kreves for realkalisering ved diffusjon (metode 7.4)?", "rett": "Sementbasert lag på minst 20 mm og karbonatiseringsdybde under ca. 40 mm", "feil": ["Polymermodifisert mørtel på 5–10 mm over hele flaten", "Påtrykt strøm på ca. 1 A/m² stål i noen uker", "At betongen holdes helt tørr under 50 % RF i ett år"], "forkl": "Laget må i tillegg være tykkere enn det selv vil karbonatisere i restlevetiden, og betongen må være kloridfri. Polymermodifiserte mørtler bremser diffusjonen."}, {"id": "m6-r2", "q": "Et riss beveger seg flere millimeter gjennom året. Hvilken metode passer?", "rett": "Gjøre risset om til en fuge (metode 1.6)", "feil": ["Injisere risset med stiv epoksy (metode 4.5)", "Hydrofobere hele flaten med silan (metode 1.1)", "Elektrokjemisk realkalisering (metode 7.3)"], "forkl": "En stiv epoksy sprekker opp igjen når risset beveger seg mye. En fuge tar derimot opp bevegelsen."}], "7": [{"id": "m7-1", "q": "Hvorfor er vannmeisling ofte bedre enn tung pigging?", "rett": "Den er selektiv og gir ikke mikroriss", "feil": ["Den er alltid billigst per m²", "Den trenger ikke oppsamling av vann", "Den renser armeringen helt, så den ikke må blåses"], "forkl": "Den fjerner bare svak betong og gir ingen mikroriss, men det alkaliske vannet må håndteres."}, {"id": "m7-2", "q": "Hvor mye fritt rom bak armeringen krever R762 minst?", "rett": "20 mm", "feil": ["2–3 mm", "50–60 mm", "Ingen – mørtelen skal bare dekke forsiden"], "forkl": "Mørtelen må kunne omslutte stålet. Ved klorider fjernes ofte 25–30 mm, så følg beskrivelsen."}, {"id": "m7-3", "q": "Hvorfor skal mørtel ikke fjæres ut mot null i kanten?", "rett": "Den tynne kanten sprekker og løsner", "feil": ["Mørtelen krymper mer i kanten", "Det bruker for mye mørtel per m²", "Det gir for høy heft og spenninger"], "forkl": "En tynn kant sprekker og løsner. Kanten skal derfor være rett og ha en minste dybde."}, {"id": "m7-4", "q": "Hva betyr «vannmettet, overflatetørt»?", "rett": "Porene er fulle av vann, men flaten har ikke vannfilm", "feil": ["Flaten har en tynn vannfilm som gir bedre heft for mørtelen", "Betongen er tørket helt ut før mørtelen legges på flaten", "Bare de øverste millimeterne er fuktet med kost rett før"], "forkl": "Porene er fulle av vann, men det står ingen vannfilm på flaten. Den ser mørk og matt ut."}, {"id": "m7-5", "q": "Hvilken rensegrad kreves ofte for armering?", "rett": "Sa 2 etter ISO 8501-1 ved blåsing", "feil": ["Sa 1 etter ISO 8501-1 ved blåsing", "St 1 med lett håndbørsting", "Ingen rensing – slemmen binder rusten"], "forkl": "R762 (2018) og DIBt TR Instandhaltung krever Sa 2. Andre steder kreves Sa 2½, eller det databladet angir. Der blåsing ikke er mulig, brukes St 2 eller St 3."}, {"id": "m7-6", "q": "Når skal armeringen IKKE males med epoksy?", "rett": "Når KB eller elektrokjemiske metoder skal brukes", "feil": ["Når reparasjonsmørtelen er av klasse R4 eller sterkere", "Når arbeidet gjøres i tørre innerom uten klorider", "Når temperaturen på stålet er under +10 °C"], "forkl": "Stålet må ha elektrisk kontakt med mørtelen, og epoksy hindrer den kontakten."}, {"id": "m7-7", "q": "Hvilke krav har en R4-mørtel?", "rett": "≥ 45 MPa trykk og ≥ 2,0 MPa heft", "feil": ["≥ 25 MPa trykk og ≥ 1,5 MPa heft", "≥ 15 MPa trykk og ≥ 0,8 MPa heft", "≥ 60 MPa trykk og ≥ 3,0 MPa heft"], "forkl": "R4 krever minst 45 MPa trykkfasthet og 2,0 MPa heft. For R3 er kravene minst 25 MPa og 1,5 MPa."}, {"id": "m7-8", "q": "Hvor langt skal du fjerne betong langs korrodert armering?", "rett": "Til du finner rent stål", "feil": ["Bare der betongen er løs", "Alltid nøyaktig 10 cm", "Til nærmeste skjøt"], "forkl": "Fortsett langs stangen til stålet er rent. Samtidig vurderer du tverrsnittstapet og om det trengs ny armering."}, {"id": "m7-v1", "q": "Hvorfor gir vannmeisling bedre heft enn pigging?", "rett": "Den gir ikke mikroriss i underlaget", "feil": ["Den gjør overflaten glattere", "Den tilfører fukt som limer", "Den fjerner mindre betong"], "forkl": "Slagmetoder gir et oppknust lag med mikroriss, typisk 3–10 mm dypt. Vannmeisling gjør ikke det."}], "8": [{"id": "m8-1", "q": "Hvilken R-klasse brukes for konstruktive reparasjoner?", "rett": "R3 eller R4", "feil": ["R1 eller R2", "Bare R1", "Klassen spiller ingen rolle"], "forkl": "R3 og R4 er de konstruktive klassene. R1 og R2 er ikke-konstruktive."}, {"id": "m8-2", "q": "Hva er hovedvalget av reparasjonsmørtel?", "rett": "Sementbasert (CC) eller polymermodifisert (PCC)", "feil": ["Ren epoksymørtel (PC) i alle lagtykkelser", "Polyuretanmørtel (PU) for alle bærende deler", "Kalkmørtel eller gips for best fukttransport"], "forkl": "Sementbaserte og polymermodifiserte mørtler er hovedvalget. Ren epoksymørtel brukes bare til små spesialjobber."}, {"id": "m8-3", "q": "Hva er prelltap?", "rett": "Materiale som spretter av ved sprøyting", "feil": ["Svinn ved herding av mørtelen", "Vann som skiller seg ut av mørtel", "Mørtel som blir igjen i slangen"], "forkl": "Prell som bygges inn, gir svake soner og hulrom. Derfor må det fjernes underveis."}, {"id": "m8-4", "q": "Hvorfor er herding spesielt viktig for reparasjoner?", "rett": "De er tynne med stor overflate og tørker raskt ut", "feil": ["De er tykkere enn ny betong og herder sakte", "Herdingen øker pH-en rundt armeringen", "De har mer sement og blir for varme"], "forkl": "Tynne lag med stor overflate tørker raskt ut. Det gir svinnriss, dårlig heft og en svak overflate."}, {"id": "m8-5", "q": "Hva er en fordel med våtsprøyting framfor tørrsprøyting?", "rett": "Høy kapasitet og mindre støv", "feil": ["Bedre for små, spredte felt", "Krever ingen blanding", "Gir alltid bedre heft"], "forkl": "Våtsprøyting gir høy kapasitet og mindre støv. Tørrsprøyting er til gjengjeld fleksibel og gir god heft."}, {"id": "m8-6", "q": "Når velger du utstøping framfor håndmørtel?", "rett": "Ved store volum og gjennomgående skader", "feil": ["Ved små, spredte skader på hjørner", "Ved riss under 0,2 mm som skal tettes", "Ved tynne reparasjoner under 10 mm"], "forkl": "Ved store volum og gjennomgående skader gir utstøping god fylling rundt armering på flere sider."}, {"id": "m8-7", "q": "Hvilken er IKKE en vanlig feil ved håndmørtling?", "rett": "Å herde mørtelen i den tiden databladet krever", "feil": ["For tykke lag i ett strøk", "Tørt eller støvete underlag", "For lite fjernet bak armeringen"], "forkl": "Herding etter databladet er riktig praksis, ikke en feil. De tre andre er typiske feil ved håndmørtling."}], "9": [{"id": "m9-1", "q": "Hva stopper hydrofobering?", "rett": "Vann og klorider, men ikke CO₂", "feil": ["CO₂, men ikke vann", "Alt – vann, klorider og CO₂", "Bare frost"], "forkl": "Hydrofoberingen gjør poreveggene vannavstøtende, men porene er fortsatt åpne for gass. Derfor slipper CO₂ inn."}, {"id": "m9-2", "q": "Hvilken sd,CO₂ skal et belegg mot karbonatisering ha?", "rett": "Over 50 m", "feil": ["Over 0,5 m", "Over 5 m", "Under 1 m"], "forkl": "NS-EN 1504-2 krever høy CO₂-motstand, altså sd > 50 m, for belegg mot karbonatisering."}, {"id": "m9-3", "q": "Hvor mye over duggpunktet skal underlaget være ved maling?", "rett": "Minst 3 °C", "feil": ["Minst 0,5 °C", "Minst 10 °C", "Under duggpunktet"], "forkl": "Det er duggpunktsregelen: Er underlaget kaldere enn dette, kan det dannes kondens som ødelegger heften."}, {"id": "m9-4", "q": "Hva avgjør levetiden til en hydrofobering?", "rett": "Inntrengningsdybden", "feil": ["Fargen", "Glansgraden", "Hvor tykk filmen på overflaten blir"], "forkl": "Jo dypere silanet trenger inn, jo lenger varer virkningen. Underlaget må også være tørt for at det skal trenge godt inn."}, {"id": "m9-5", "q": "Hvorfor kan tett epoksybelegg være feil på AKR-skadet betong?", "rett": "Det stenger fukten inne, så reaksjonen fortsetter", "feil": ["Epoksy reagerer med alkaligelen og løser seg opp", "Det slipper inn CO₂ som øker AKR-reaksjonen", "Det gjør betongen for tørr til at riss lukker seg"], "forkl": "Et tett belegg holder fukten inne, så reaksjonen fortsetter. Uttørking kan forsinke AKR, men ikke stoppe den."}, {"id": "m9-6", "q": "Hvilken behandling velger du mot klorider på en kantdrager?", "rett": "Hydrofobering, gjerne silangel for dyp inntrengning", "feil": ["Akrylmaling med høy CO₂-motstand (sd over 50 m)", "Kalkmaling som slipper fukt godt ut av betongen", "Ingen behandling, fordi kantdragere skal tørke"], "forkl": "Silangel trenger dypt inn og holder kloridene ute. Et alternativ er en sementbasert membran som bremser kloridene."}, {"id": "m9-7", "q": "Hva er riktig om tette belegg?", "rett": "God barriere, men stenger fukt inne og fornyes etter 10–15 år", "feil": ["Slipper ut fukt bedre enn åpne løsninger og varer i 50 år", "Stopper kloridkorrosjon som er i gang, uten annen reparasjon", "Brukes bare innendørs fordi de ikke tåler UV og regn"], "forkl": "Tette belegg stopper inntrengning, men holder på fukten. Derfor trenger utvendige, fuktige konstruksjoner diffusjonsåpne løsninger."}, {"id": "m9-8", "q": "Hvilket er et typisk krav til en god hydrofobering?", "rett": "Inntrengning minst 2 mm (ofte mer i beskrivelser)", "feil": ["Inntrengning under 0,1 mm, slik at porene holdes åpne", "Vannopptak over 80 % av ubehandlet betong etter behandling", "Den skal danne en tett, blank film på hele overflaten"], "forkl": "Beskrivelser krever ofte mer. Vannopptaket skal også være under ca. 20 % og uttørkingen minst 60 % av ubehandlet."}, {"id": "m9-r1", "q": "Hvilke riss bør lukkes før hydrofobering?", "rett": "Riss bredere enn ca. 0,1 mm", "feil": ["Bare riss bredere enn ca. 2 mm", "Ingen – silanet fyller og tetter alle riss", "Bare riss som lekker vann ved befaring"], "forkl": "Hydrofobering virker i porene, ikke i riss. Ved bevegelser over ca. 0,1–0,2 mm er et rissoverbyggende belegg et bedre valg."}], "10": [{"id": "m10-1", "q": "Et stabilt, tørt riss i en bærende bjelke skal injiseres. Hvilket materiale?", "rett": "Lavviskøs epoksy (klasse F)", "feil": ["PUR-skum (klasse S)", "Elastisk PUR (klasse D)", "Akrylatgel (klasse S)"], "forkl": "Epoksy er stiv og kraftoverførende (klasse F), så den gjenoppretter bæreevnen i et stabilt riss."}, {"id": "m10-2", "q": "Hvilken EN 1504-5-klasse brukes for riss som beveger seg?", "rett": "Klasse D (duktil fylling)", "feil": ["Klasse F (kraftoverførende)", "Klasse S (svellende fylling)", "Klasse R4 (konstruktiv)"], "forkl": "D står for duktil fylling, som tåler bevegelse. F er kraftoverførende og S er svellende."}, {"id": "m10-3", "q": "Et riss lekker aktivt vann. Hvordan stopper du lekkasjen?", "rett": "Tetter med PUR-skum", "feil": ["Sparkler risset med mørtel", "Maler over med epoksybelegg", "Venter til risset tørker ut"], "forkl": "PUR-skum ekspanderer og stopper lekkasjen raskt. Etterpå kan du etterinjisere med elastisk PUR."}, {"id": "m10-4", "q": "Skal riss langs korrodert armering injiseres?", "rett": "Nei, korrosjonen må utbedres", "feil": ["Ja, med epoksy for å binde stålet", "Ja, med PUR-skum for å stoppe vann", "Ja, men bare hvis risset er over 1 mm"], "forkl": "Injeksjon stopper ikke korrosjonen. Risset er et symptom, så du må utbedre årsaken."}, {"id": "m10-5", "q": "Hva er typisk pakkeravstand?", "rett": "Ca. halve tykkelsen av elementet", "feil": ["Ca. dobbel tykkelse av elementet", "Alltid 1 m, uansett tykkelse", "Ca. 5 cm, uansett tykkelse"], "forkl": "Bor skrått og vekselvis fra hver side av risset, slik at hullet krysser risset midt i tverrsnittet."}, {"id": "m10-6", "q": "Hvorfor er høyt trykk ikke bedre ved injeksjon?", "rett": "Det kan sprenge betongen og presse materialet bort", "feil": ["Materialet herder for fort og tetter pakkerne", "Det gir for lavt forbruk og for lite materiale", "Pakkerne varmes opp og mister tettheten"], "forkl": "For høyt trykk kan sprenge betongen. Injiser heller nedenfra med kontrollert trykk."}, {"id": "m10-7", "q": "Hva kan svært lavt forbruk per pakker bety?", "rett": "At risset ikke er fylt, f.eks. at borehullet bommet", "feil": ["At risset er helt fylt, og at jobben er godt utført", "At materialet er for tyntflytende og renner ut av risset", "At risset er svært bredt og derfor trenger lite materiale"], "forkl": "Svært lavt forbruk tyder på at materialet ikke når risset. Derfor logger du forbruket per pakker."}, {"id": "m10-8", "q": "Hva betyr W(8) i U(S1) W(8)(1/3)(5/30)?", "rett": "Dokumentert for riss fra 0,8 mm", "feil": ["Dokumentert for riss fra 8 mm", "Maks injeksjonstrykk 8 bar", "Herdetid inntil 8 timer"], "forkl": "W-tallet angir minste rissvidde produktet er dokumentert for. Til 0,3 mm trenger du W(3) eller lavere."}, {"id": "m10-9", "q": "Du skal injisere epoksy ved +8 °C. Mapepoxy BI eller BI-R?", "rett": "BI – klassifisert fra +5 °C", "feil": ["BI-R – klassifisert fra +5 °C", "Begge er like", "Ingen av dem kan brukes under +20 °C"], "forkl": "BI er klassifisert fra +5 °C. BI-R er klassifisert for +21 til +30 °C, så den passer ikke ved +8 °C."}, {"id": "m10-v1", "q": "Hvorfor stålbørste og ikke slipemaskin langs risset?", "rett": "Slipestøvet fyller risset", "feil": ["Slipemaskin er for treg", "Stålbørste ruer opp mer", "Slipemaskin skader epoksyen"], "forkl": "Slipestøvet tetter risset, så materialet ikke kommer inn. Rådet kommer fra ACI RAP-1."}], "11": [{"id": "m11-1", "q": "Hvilken strømtetthet brukes typisk ved realkalisering og kloriduttrekk?", "rett": "Ca. 1 A/m² stål", "feil": ["Ca. 1 mA/m²", "Ca. 100 A/m²", "Ca. 20 mA/m² stål"], "forkl": "Begge er midlertidige behandlinger som bruker høy strøm over kort tid. Til sammenligning bruker KB bare mA/m²."}, {"id": "m11-2", "q": "Hvor lenge varer kloriduttrekk typisk?", "rett": "2–10 uker", "feil": ["Noen timer", "1–2 dager", "5–10 år"], "forkl": "Kloriduttrekk tar typisk 2–10 uker, mens realkalisering tar fra noen dager til noen uker."}, {"id": "m11-3", "q": "Hvilken elektrolytt brukes typisk ved realkalisering?", "rett": "Natriumkarbonatløsning", "feil": ["Natriumkloridløsning", "Kalsiumkloridløsning", "Kalsiumnitrittløsning"], "forkl": "Natriumkarbonatløsningen legges ofte på i sprøytet cellulosefiber."}, {"id": "m11-4", "q": "Hva er den mest katastrofale feilen?", "rett": "Feil polaritet", "feil": ["For lav strøm", "For lang behandlingstid", "Feil farge på kablene"], "forkl": "Byttes pluss og minus, blir armeringen anode og korroderer kraftig. Sjekk derfor tilkoblingen før start."}, {"id": "m11-5", "q": "Hvorfor fjerner kloriduttrekk dårlig klorider bak armeringen?", "rett": "Stålet er katoden og «skygger»", "feil": ["Klorider bak armeringen er ufarlige", "Elektrolytten når ikke inn", "Strømmen går feil vei"], "forkl": "Stålet er katoden og står i veien. Kloridene bak vandrer dårlig ut mot anoden på overflaten."}, {"id": "m11-6", "q": "Hva er den største forskjellen på kloriduttrekk og KB?", "rett": "Kloriduttrekk er midlertidig, KB er permanent og overvåkes", "feil": ["KB er midlertidig, kloriduttrekk er permanent og overvåkes", "De virker likt, men kloriduttrekk bruker lavere strøm", "Kloriduttrekk beskytter også mot fremtidige klorider"], "forkl": "KB kjører hele restlevetiden og beskytter derfor også mot nye klorider. Kloriduttrekk avsluttes etter noen uker."}, {"id": "m11-7", "q": "Hvordan kontrolleres realkalisering?", "rett": "Fenolftalein på kjerner, pluss logget ladningsmengde", "feil": ["Kloridprofil på kjerner tatt før behandlingen", "Visuell kontroll og banking etter at strømmen er av", "Potensialmåling instant-off etter 24 timer"], "forkl": "Fenolftalein viser om pH er gjenopprettet: Betongen rundt armeringen skal farges rød."}, {"id": "m11-8", "q": "Hva er en forutsetning for elektrokjemiske metoder?", "rett": "Kontinuitet i armeringen og ingen kortslutninger", "feil": ["At betongen er helt tørr før strømmen settes på", "Epoksy på all armering for å isolere stålet", "At temperaturen er under 0 °C under behandling"], "forkl": "Strømmen må nå all armering, og kortslutninger gjør behandlingen virkningsløs. Spennarmering og AKR krever særskilt vurdering."}, {"id": "m11-r1", "q": "Hvorfor bør du ikke potensialkartlegge rett etter kloriduttrekk?", "rett": "Stålet er fortsatt sterkt polarisert og målingene blir misvisende", "feil": ["Elektrolytten har farget betongen slik at måleren ikke virker", "Kloridene som er igjen gjør betongen elektrisk ikke-ledende", "Standarden forbyr potensialmåling i fem år etter behandling"], "forkl": "Polariseringen sitter i lenge og gir feil bilde. Vent, eller bruk innstøpte sensorer."}], "12": [{"id": "m12-1", "q": "Hva gjør KB med armeringen?", "rett": "Gjør hele armeringen til katode", "feil": ["Gjør hele armeringen til anode", "Trekker kloridene ut av betongen", "Øker pH ved realkalisering av stålet"], "forkl": "Når hele armeringen blir katode, undertrykkes anodereaksjonen, og dermed korrosjonen."}, {"id": "m12-2", "q": "Hvilket kriterium er ett av KB-kriteriene?", "rett": "Instant-off mer negativ enn −720 mV (Ag/AgCl)", "feil": ["Instant-off mer positiv enn 0 mV (Ag/AgCl)", "Strøm over 1 A/m² stål i alle soner", "Potensial mer negativ enn −2000 mV (Ag/AgCl)"], "forkl": "Det er nok at ett kriterium er oppfylt. De andre er 100 mV depolarisering innen 24 t, eller 150 mV over lengre tid."}, {"id": "m12-3", "q": "Hva er grensen for overbeskyttelse av slakkarmering (instant-off, Ag/AgCl)?", "rett": "Ikke mer negativt enn ca. −1100 mV", "feil": ["Ikke mer negativt enn ca. −500 mV", "Ikke mer negativt enn ca. −900 mV", "Ikke mer negativt enn ca. −300 mV"], "forkl": "For mye strøm gir overbeskyttelse. Spennarmering har strengere grense, ca. −900 mV, fordi den kan få hydrogensprøhet."}, {"id": "m12-4", "q": "Hvorfor måles potensialet «instant-off»?", "rett": "For å fjerne IR-fallet i betongen", "feil": ["For å måle kloridinnholdet ved stålet", "For å spare strøm i anlegget over tid", "For å finne kontinuiteten i armeringen"], "forkl": "Mens strømmen går, gir IR-fallet et for negativt potensial. Måler du i øyeblikket strømmen brytes, faller det bort."}, {"id": "m12-5", "q": "Hva er typisk strømtetthet for KB i atmosfærisk betong?", "rett": "Noen få til ca. 20 mA/m² stål", "feil": ["Ca. 1 A/m² stål, som ved kloriduttrekk", "Ca. 200–500 mA/m² stål", "Ca. 1 µA/m² stål"], "forkl": "Det gjelder for å beskytte stål som allerede korroderer. Ved katodisk forebygging trengs under ca. 2 mA/m²."}, {"id": "m12-6", "q": "Hva måler du først, før strømmen slås på?", "rett": "Naturlige potensialer ved alle referanseelektroder", "feil": ["Kloridinnholdet i betongen ved alle anodene", "Instant-off-potensialet ved alle referansene", "Strømtettheten i alle sonene ved full spenning"], "forkl": "De statiske potensialene er utgangspunktet som alle senere målinger sammenlignes med."}, {"id": "m12-7", "q": "Hvilket anodesystem på et trafikkert brudekke?", "rett": "MMO-titannett i overlag eller titanbånd i spor", "feil": ["Ledende karbonmaling med innlagte strømfordelere", "Sinkplater limt på overflaten av hele brudekket", "Termisk sprøytet sink på hele overflaten av dekket"], "forkl": "Belegg tåler ikke slitasjen fra trafikk, mens titan er robust og varer svært lenge."}, {"id": "m12-8", "q": "Hvorfor monteres pseudoreferanser i tillegg?", "rett": "Ekte referanser varer ca. 20 år; da kan du fortsatt måle", "feil": ["De er mer nøyaktige enn ekte referanseelektroder", "De erstatter anoden når den er oppbrukt etter 20 år", "De gir ekstra strøm til soner med for lite beskyttelse"], "forkl": "Uten pseudoreferanser må elektrodene byttes når de er brukt opp."}, {"id": "m12-9", "q": "Hva er de viktigste installasjonskontrollene ved KB?", "rett": "Kontinuitet og kortslutningskontroll", "feil": ["Fenolftalein og kloridprofil", "Vannopptak og inntrengningsdybde", "Trykkfasthet og avtrekk i overlaget"], "forkl": "Mangler kontinuiteten, blir deler av armeringen ubeskyttet. Én kortslutning kan gjøre hele sonen virkningsløs."}, {"id": "m12-v1", "q": "Hvilken resistivitet bør materialet rundt en innstøpt sinkanode ha?", "rett": "Under ca. 15 000 Ω·cm", "feil": ["Over 100 000 Ω·cm", "Det spiller ingen rolle", "Så høy som mulig"], "forkl": "Epoksy og sterkt polymermodifiserte mørtler isolerer anoden, så den ikke kan avgi strøm (ACI RAP-8)."}], "13": [{"id": "m13-1", "q": "Hvem prosjekterer forsterkning?", "rett": "Alltid konstruktør", "feil": ["Utførende fagarbeider", "Produktleverandøren alene", "Byggherren"], "forkl": "Forsterkning endrer bæresystemet, og derfor må en konstruktør alltid prosjektere den."}, {"id": "m13-2", "q": "Hvor svikter CFRP-forsterkning vanligvis?", "rett": "I limfugen eller betongoverdekningen", "feil": ["Ved brudd i selve karbonfiberen", "I stålarmeringen bak forsterkningen", "Ved at epoksyen sprekker i kulde"], "forkl": "Fiberen har svært høy strekkfasthet. Det svake punktet er heften og betongen den er limt til."}, {"id": "m13-3", "q": "Hvilken strekkfasthet bør underlaget minst ha?", "rett": "Ca. 1,5 MPa", "feil": ["Ca. 0,1 MPa", "Ca. 15 MPa", "Ingen krav"], "forkl": "Dette kontrolleres med avtrekksprøving før du limer."}, {"id": "m13-4", "q": "Hvorfor rundes hjørner av før omsnøring?", "rett": "Skarpe hjørner kan kutte fibrene", "feil": ["For å spare lim og fiber", "For at vevet skal ligge pent", "For å få bedre heft i hjørnet"], "forkl": "Skarpe hjørner gir spenningskonsentrasjoner som kan kutte fibrene."}, {"id": "m13-5", "q": "Hva må gjøres før et korrosjonsskadet element forsterkes?", "rett": "Reparere betongskadene og stoppe korrosjonen", "feil": ["Male elementet med epoksy først", "Ingenting, forsterkningen tar lasten", "Hydrofobere hele elementet"], "forkl": "Forsterkningen må ha et friskt underlag. Limer du på skadet betong, svikter den."}], "14": [{"id": "m14-1", "q": "Hvilken mørtel er R4 og deklarert for XS3/XD3/XF4?", "rett": "Redirep 45 RSF", "feil": ["Redirep 25 RSF", "Mapegrout T40", "DS-RSF"], "forkl": "Redirep 25 RSF er bare R2, T40 er R3, og DS-RSF er bare deklarert til XS1."}, {"id": "m14-2", "q": "Hvilken R-klasse har Mapegrout T40?", "rett": "R3", "feil": ["R1", "R2", "R4"], "forkl": "T40 er R3 og passer for ikke-kritiske flater. Søstermørtelen T60 er R4."}, {"id": "m14-3", "q": "Hvor tykt legges Mapefer/Redisit på armeringen?", "rett": "Totalt ca. 2 mm i to strøk", "feil": ["0,1 mm i ett strøk", "10 mm i fem strøk", "Det skal ikke legges på armering"], "forkl": "To strøk med pensel gir totalt ca. 2 mm. Legg det rett etter at stålet er renset."}, {"id": "m14-4", "q": "Hvorfor skal Mapefer ikke brukes med Mapeshield E?", "rett": "Det hindrer kontakten mellom stål og mørtel", "feil": ["Det løser opp sinken i anoden over tid", "Det gjør mørtelen for tett til at strømmen går", "Det reagerer med sinken og danner gass"], "forkl": "Den galvaniske strømmen må fram til armeringen, og belegget på stålet stenger den ute."}, {"id": "m14-5", "q": "Hva skiller Planiseal WR 90 Gel fra WR 100?", "rett": "WR 90 Gel er tiksotrop, ett strøk, klasse II", "feil": ["WR 90 Gel er en maling, WR 100 en silan", "WR 100 er tiksotrop og legges i ett strøk", "De er like, men WR 90 Gel har annen farge"], "forkl": "WR 100 er tyntflytende og legges i to strøk. På SVV-bruer krever R762 (2018) gel eller krem med FE 25 ≥ 65 %, så der brukes WR 90 Gel."}, {"id": "m14-6", "q": "Hvilken minimumstykkelse krever Cem Elastic og Mapelastic Smart?", "rett": "Minst 2 mm", "feil": ["0,2 mm", "10 mm", "Ingen krav"], "forkl": "Databladene krever minst 2 mm for at belegget skal bygge over riss. Tynnere lag gir ikke den deklarerte ytelsen."}, {"id": "m14-7", "q": "Hva skiller Mapegrout T60 fra T40?", "rett": "T60 er R4 med sulfatresistent sement og inhibitor", "feil": ["T60 er R3 med samme sement, men kan legges tykkere", "T60 er R4, men bare godkjent for innvendig bruk", "T60 er en epoksymørtel for tynne lag i sprutsonen"], "forkl": "T60 tåler mer og er R4, mens T40 er R3. Velg T60 for bærende deler, marint miljø og offshore."}, {"id": "m14-8", "q": "Hvorfor kan Mapeprimer M legges på fuktig betong, men ikke Mapecoat CFS?", "rett": "Primer M tåler fukt; CFS krever maks 4 % fukt", "feil": ["CFS tåler fukt; Primer M krever maks 4 % fukt", "Begge tåler fukt, men CFS trenger sand i primeren", "Ingen av dem tåler fukt over 4 % i betongen"], "forkl": "Mapeprimer M er laget for fuktig underlag. CFS legges derfor på primeren, ikke direkte på betongen."}, {"id": "m14-9", "q": "Hvorfor skal Mapecure 1 ikke brukes på en flate som skal males?", "rett": "Voksfilmen hindrer heft", "feil": ["Den gjør betongen våt", "Den farger betongen", "Den øker pH"], "forkl": "Voksfilmen må fjernes helt før maling. Bruk heller plast eller vanning til herdingen."}, {"id": "m14-10", "q": "Hva betyr (5/30) i klassifiseringen av Mapepoxy BI?", "rett": "Brukstemperatur +5 til +30 °C", "feil": ["Rissvidde fra 5 til 30 mm", "Trykk fra 5 til 30 bar", "Brukstid 5 til 30 minutter"], "forkl": "Tallene i parentes er temperaturområdet. W(1) betyr at produktet kan brukes i riss fra 0,1 mm."}, {"id": "m14-11", "q": "DS forbrukes med 19 kg/m² per cm. Hvor mye trengs til 12 m² × 4 cm (uten prell)?", "rett": "912 kg", "feil": ["228 kg", "456 kg", "1824 kg"], "forkl": "19 × 4 × 12 = 912 kg. Legger du til 5 % prell, blir det ca. 958 kg."}], "15": [{"id": "m15-1", "q": "Hva er riktig rekkefølge for bærende reparasjon?", "rett": "Redisit → Redirep 45 RSF → sparkel → primer → maling", "feil": ["Redirep 45 RSF → Redisit → primer → sparkel → maling", "Primer → Redisit → Redirep 45 RSF → maling → sparkel", "Redisit → sparkel → Redirep 45 RSF → maling → primer"], "forkl": "Korrosjonsbeskyttelsen kommer først, så mørtelen, og overflatebeskyttelsen helt til slutt."}, {"id": "m15-2", "q": "Hvorfor legges Confix vått-i-vått på Mapepoxy L?", "rett": "For monolittisk heft; herdet lim blir et slippsjikt", "feil": ["For å spare lim, fordi Confix trekker inn i limet", "For at Confix skal herde raskere i kulde", "Fordi Confix krever helt tørt underlag"], "forkl": "Mørtelen må legges mens limet er klebrig, innenfor åpentiden. Ellers blir limet et slippsjikt."}, {"id": "m15-3", "q": "Hvilken kontinuitet kreves før Mapeshield E kobles til?", "rett": "Maks 1 Ω", "feil": ["Maks 100 Ω", "Minst 1000 Ω", "Kontinuitet er ikke nødvendig"], "forkl": "Det trengs også minst to tilkoblinger per element."}, {"id": "m15-4", "q": "Hvilken feil ødelegger et galvanisk KB-system?", "rett": "Mapefer/Redisit som korrosjonsbeskyttelse på stålet", "feil": ["Sementbasert mørtel med passende resistivitet", "Dokumentert kontinuitet under 1 Ω i armeringen", "To tilkoblinger per element loddet til armeringen"], "forkl": "Strømmen fra anoden må nå stålet. Epoksy- eller PU-mørtel og stålfiber er også feil."}, {"id": "m15-5", "q": "Hvilke prinsipper dekker Cem Elastic?", "rett": "1, 2 og 8", "feil": ["7 og 10", "3 og 4", "Bare 11"], "forkl": "Det er beskyttelse mot inntrengning (1), fuktkontroll (2) og økt resistivitet (8)."}, {"id": "m15-6", "q": "Utstøpingen offshore tar ca. 2 t ved +20 °C. Mapepoxy L eller LR?", "rett": "LR – ca. 180 min åpentid", "feil": ["L – ca. 180 min åpentid", "Ingen lim trengs", "L, fordi LR er for innendørs"], "forkl": "L har bare ca. 70 min åpentid ved +20 °C og ville herdet før betongen kom på."}, {"id": "m15-7", "q": "Hvilket klimakrav gjelder for Mapecoat CFS?", "rett": "RF maks 80 % og minst 3 °C over duggpunktet", "feil": ["RF minst 85 % og under duggpunktet", "RF maks 95 % og minst 1 °C over duggpunktet", "RF maks 80 %, men duggpunktet spiller ingen rolle"], "forkl": "I tillegg skal underlaget ha maks 4 % fukt."}, {"id": "m15-8", "q": "Hva er riktig rekkefølge i MapeWrap C-systemet?", "rett": "MapeWrap Primer 1 → MapeWrap 11 → MapeWrap 31 → vev → MapeWrap 31", "feil": ["MapeWrap 11 → MapeWrap Primer 1 → vev → MapeWrap 31 → MapeWrap 31", "MapeWrap Primer 1 → vev → MapeWrap 11 → MapeWrap 31 → MapeWrap 31", "MapeWrap 31 → vev → MapeWrap Primer 1 → MapeWrap 11 → MapeWrap 31"], "forkl": "Avrettingen med MapeWrap 11 legges vått-i-vått før limet og veven."}, {"id": "m15-9", "q": "Hvilke krav stiller Purtop 400 M-systemet til dekket?", "rett": "≥ 25 MPa, ≥ 1,5 MPa avtrekk, maks ca. 4 % fukt", "feil": ["≥ 15 MPa, ≥ 0,8 MPa avtrekk og vannmettet dekke", "≥ 45 MPa, ≥ 2,0 MPa avtrekk og maks 10 % fukt", "≥ 25 MPa, men ingen krav til fukt i dekket"], "forkl": "Er dekket fuktigere enn dette, må du bruke fuktprimer."}, {"id": "m15-10", "q": "Hvorfor holder ikke hydrofobering alene på en kantdrager med mye klorider ved armeringen?", "rett": "Korrosjonen som er i gang fortsetter", "feil": ["Silan virker bare innendørs", "Silan øker kloridinnholdet", "Det gjør den – det holder alltid"], "forkl": "Silanet bremser bare ny inntrengning. Forurenset betong må fjernes, eller armeringen beskyttes elektrokjemisk."}], "16": [{"id": "m16-1", "q": "Når skal skjulte trinn kontrolleres?", "rett": "Før de dekkes til", "feil": ["Etter at jobben er ferdig", "Bare ved sluttbefaring", "Aldri – de er skjult"], "forkl": "Når trinnet er dekket til, er det for sent å se det."}, {"id": "m16-2", "q": "Hva bør klimaloggen inneholde?", "rett": "Luft- og underlagstemperatur, RF og duggpunkt", "feil": ["Værmelding, vindretning og antall arbeidstimer", "Lufttemperatur, nedbør og soltimer per dag", "Underlagstemperatur, mengder og batchnumre"], "forkl": "Mange produktfeil skyldes arbeid utenfor produktets grenser, og loggen viser om du var innenfor."}, {"id": "m16-3", "q": "Skadeomfanget er dobbelt så stort som beskrevet. Hva gjør du?", "rett": "Stanser, dokumenterer og melder avvik før du fortsetter", "feil": ["Fortsetter og dokumenterer mengdene i sluttfakturaen", "Reparerer det som er beskrevet og noterer resten", "Fortsetter, men bruker en billigere mørtel på resten"], "forkl": "Avvik skal avklares med byggherre eller rådgiver før arbeidet fortsetter."}, {"id": "m16-4", "q": "Hva må gjøres med vann fra vannmeisling?", "rett": "Samles og renses (høy pH) før utslipp", "feil": ["Slippes ut, fordi det bare er vann og støv", "Brukes som herdevann på fersk mørtel", "Nøytraliseres med salt og slippes i sjøen"], "forkl": "Vannet er sterkt alkalisk og skadelig for miljøet, så det må samles opp og renses først."}, {"id": "m16-5", "q": "Hvilket åndedrettsvern brukes ved pigging og blåsing?", "rett": "P3", "feil": ["Ingen", "Papirmaske", "Bare hørselvern"], "forkl": "Støvet kan inneholde krystallinsk silika. Bruk også støvreduksjon, vernebriller, hørselvern og vibrasjonsdempet verktøy."}, {"id": "m16-6", "q": "Hva hører IKKE hjemme i sluttdokumentasjonen?", "rett": "Leverandørens reklamebrosjyre", "feil": ["Produktdatablad og batchnumre", "Klimalogger og kontrollskjemaer", "«Som utført»-kart og bilder per felt"], "forkl": "Sluttdokumentasjonen viser hva som er gjort: kontrollskjemaer, testresultater, foto og FDV. Reklame hører ikke hjemme der."}, {"id": "m16-r1", "q": "Hvor mye over duggpunktet må underlaget minst være før belegg eller hydrofobering?", "rett": "Minst 3 K (3 °C) over duggpunktet", "feil": ["Minst 0,5 K over duggpunktet", "Minst 10 K over duggpunktet", "Det holder at lufta er tørr, duggpunktet er uviktig"], "forkl": "Er underlaget mindre enn ca. 3 K over duggpunktet, kan det dannes kondens som ødelegger heften."}], "17": [{"id": "m17-1", "q": "Hvilken prisform anbefales ved rehabilitering?", "rett": "Enhetspriser regulert etter oppmålte mengder", "feil": ["Fast totalpris uavhengig av mengde", "Timepris uten oppmåling av felt", "Pris per dag for rigg og mannskap"], "forkl": "Mengdene er usikre før betongen er åpnet, så prisen bør følge det som faktisk måles opp."}, {"id": "m17-2", "q": "Når skal reparasjonsfelt måles opp?", "rett": "Før mørtling, gjerne felles og med bilder", "feil": ["Etter maling", "Ved garantibefaring", "Aldri – man bruker beskrivelsens mengder"], "forkl": "Etter mørtling kan ingen se hvor dypt det var. Derfor må feltet måles og dokumenteres før."}, {"id": "m17-3", "q": "Hvorfor er små, spredte felt dyrere per m²?", "rett": "Rigg, tilkomst og oppstart koster det samme uansett", "feil": ["Mørtelen er dyrere når den kjøpes i små sekker", "Små felt krever alltid R4-mørtel og avtrekksprøver", "Små felt må prosjekteres av konstruktør hver for seg"], "forkl": "De faste kostnadene blir de samme og må fordeles på få m²."}, {"id": "m17-4", "q": "Hvordan bør injeksjonsmateriale prises?", "rett": "Separat, fordi forbruket varierer mye", "feil": ["Inkludert i rissmeter uansett forbruk", "Gratis", "Per pakker uten materiale"], "forkl": "Forbruket er svært usikkert, så en egen pris gir et riktigere oppgjør."}, {"id": "m17-5", "q": "Hvilken håndbok har Statens vegvesen brukt for beskrivelser på bruer og kaier?", "rett": "R762 Prosesskode 2", "feil": ["V441 Bruinspeksjon", "N400 Bruprosjektering", "N200 Vegbygging"], "forkl": "Fra 2025 er den slått sammen med R761, så sjekk hvilken utgave kontrakten viser til."}], "19": [{"id": "m19-1", "q": "Hvor mye tæring tilsvarer 1 µA/cm²?", "rett": "Ca. 11,6 µm/år", "feil": ["Ca. 1 mm/år", "Ca. 0,1 µm/år", "Ca. 116 µm/år"], "forkl": "Omregningen kommer fra Faradays lov."}, {"id": "m19-2", "q": "0,3 µA/cm² i 15 år gir omtrent hvor mye jevn tæring?", "rett": "Ca. 0,05 mm", "feil": ["Ca. 0,5 mm", "Ca. 5 mm", "Ca. 0,005 mm"], "forkl": "0,3 × 11,6 ≈ 3,5 µm/år, og på 15 år blir det ca. 52 µm."}, {"id": "m19-3", "q": "Hva er «svart rust»?", "rett": "Kraftig tæring uten riss i vannmettet, oksygenfattig betong", "feil": ["Rust som skyldes brann eller sveising nær armeringen i betongen", "Tæring fra karbonatisering i tørr, innendørs betong med lav fukt", "Rust på rustfritt stål som ligger i kontakt med vanlig karbonstål"], "forkl": "Med lite oksygen danner jernet ikke ekspansiv rust, så det blir ikke sprengtrykk og riss."}, {"id": "m19-4", "q": "Hvor nøyaktige er LPR-målinger?", "rett": "I beste fall innen en faktor 2–4", "feil": ["Innen omtrent 1 %", "Innen omtrent 10 %", "Innen en faktor 100"], "forkl": "Det holder til å skille lav fra høy hastighet, men ikke til nøyaktige tall."}, {"id": "m19-5", "q": "Hvorfor ser man bort fra de ytterste mm i en kloridprofil?", "rett": "Overflatesonen påvirkes av utvasking, sug og avdamping", "feil": ["Det er alltid null klorider i de ytterste millimeterne", "Prøvene fra overflaten blir for små til å analyseres", "Overflaten er karbonatisert, så kloridene er bundet"], "forkl": "Sonen styres av mer enn diffusjon, og den forstyrrer tilpasningen til Ficks lov."}, {"id": "m19-6", "q": "Hvorfor gir tidlige kloridprofiler ofte for pessimistisk prognose?", "rett": "Den tilsynelatende diffusjonskoeffisienten avtar med alderen", "feil": ["Kloridene forsvinner gradvis ut av betongen igjen over tid", "Betongen blir mer porøs med alderen, så diffusjonen øker", "Kloridterskelen ved armeringen synker etter hvert som betongen eldes"], "forkl": "Det gjelder særlig betong med flygeaske og slagg. Tidlige målinger gir derfor for høy D."}, {"id": "m19-7", "q": "Hvilken risiko gir groptæring på spennstål?", "rett": "Hydrogensprøhet", "feil": ["AKR", "Frostskader", "Sulfatangrep"], "forkl": "Hydrogen fra gropene kan gjøre stålet sprøtt. Galvanisk KB foretrekkes derfor på spennarmering."}, {"id": "m19-8", "q": "Ved hvilket kloridinnhold er risikoen høy i luftet betong?", "rett": "Over ca. 1 % av sementvekt", "feil": ["Over ca. 0,1 % av sementvekt", "Over ca. 0,2 % av sementvekt", "Over ca. 4 % av sementvekt"], "forkl": "Under ca. 0,4 % er risikoen lav. Terskelen avhenger av sementtype, fukt og oksygen."}, {"id": "m19-r1", "q": "Hva er kloridklassen (f.eks. Cl 0,40) i NS-EN 206?", "rett": "En grense for det totale kloridinnholdet i ny betong", "feil": ["Nivået der armeringen garantert begynner å korrodere", "Grensen for klorider i spennarmert betong i bruk", "Målt vannløselig klorid ved armeringen etter 50 år"], "forkl": "Det er en materialgrense for ny betong – i Norge fortrinnsvis Cl 0,20, og Cl 0,10 for SVV-bruer. Ved vurdering brukes ofte ca. 0,5 %, og terskelen er en fordeling: under ca. 0,25 % er depassivering ikke funnet."}], "20": [{"id": "m20-1", "q": "Stopper et tett belegg kloridkorrosjon som har startet?", "rett": "Nei, det er nok fukt og oksygen i porene", "feil": ["Ja, hvis belegget er epoksy og helt tett", "Ja, fordi tilførselen av klorider stopper", "Ja, men først etter ett til to år"], "forkl": "Kloridsaltene trekker dessuten til seg fukt, så korrosjonen fortsetter."}, {"id": "m20-2", "q": "Hvilken inhibitor har god dokumentasjon?", "rett": "Innblandet kalsiumnitritt", "feil": ["Inhibitor påført herdnet betong", "Kalsiumklorid innblandet i fersk betong", "Silan påført som porefyller"], "forkl": "Inhibitorer som påføres herdnet betong, har derimot svak dokumentasjon fra felt."}, {"id": "m20-3", "q": "Hva er risikoen ved underdosert inhibitor?", "rett": "Små, svært aktive anoder med groptæring", "feil": ["Ingen risiko, bare litt kortere levetid", "Høyere pH som gir AKR i betongen", "Raskere karbonatisering rundt stålet"], "forkl": "Doseringen må derfor være tilstrekkelig."}, {"id": "m20-4", "q": "Kan rustfritt stål blandes med vanlig armering?", "rett": "Ja, når det er beiset og fritt for sveise- og glødeskall", "feil": ["Nei – det gir alltid kraftig galvanisk korrosjon på karbonstålet", "Bare hvis stengene er isolert fra hverandre med epoksy eller tape", "Bare i tørre innerom der det ikke finnes klorider i betongen"], "forkl": "Rent rustfritt stål er en dårlig katode og kan begrense ringanodeeffekten. Med skall blir det en bedre katode og kan gi galvanisk korrosjon på karbonstålet."}, {"id": "m20-5", "q": "Hva viser en galvanisk stigeprobe?", "rett": "Når klorid- eller karbonatiseringsfronten når ulike dybder", "feil": ["Hvor mye strøm et KB-anlegg bruker i hver enkelt sone", "Hvor stor trykkfasthet betongen har i ulike dybder inn", "Hvor mye av tverrsnittet armeringen har mistet over tid"], "forkl": "Elektrodene står i ulike dybder, så du får varsel før fronten når armeringen."}, {"id": "m20-6", "q": "Hvilken er en vanlig årsak til at reparasjoner svikter?", "rett": "Ringanoder og manglende herding", "feil": ["For dyp fjerning bak armeringen", "For lang herding med plast", "For mye dokumentasjon per felt"], "forkl": "Også lastomfordeling og undervurderte mengder. Ved en ringanode blir lappen katode, og stålet rundt korroderer."}, {"id": "m20-7", "q": "Hva gjelder for galvaniske anoder?", "rett": "Enkle, men begrenset strøm og levetid; må overvåkes", "feil": ["Krever strømforsyning, men varer i over 100 år", "Ubegrenset levetid og trenger ingen overvåking", "Virker også uten elektrisk kontakt med armering"], "forkl": "Systemet kan ikke styres og må overvåkes. ICCP gir mer styrbar beskyttelse."}, {"id": "m20-8", "q": "Hvorfor kan KB bli billigere enn tradisjonell reparasjon på en kloridskadet viadukt?", "rett": "Bare løs betong repareres, og korrosjonen stoppes overalt", "feil": ["KB fjerner alle kloridene permanent i løpet av en uke", "KB krever ingen prosjektering eller overvåking", "KB gjør at armeringen ikke trenger rensing eller ny mørtel"], "forkl": "Fullstendig fjerning av forurenset betong krever ofte avstivning og mye arbeid."}], "21": [{"id": "m21-1", "q": "Hva bestemmer utførelsesklassen etter NS-EN 13670?", "rett": "Omfanget av kontroll og dokumentasjon", "feil": ["Betongens fasthetsklasse", "Hvilken sement som brukes", "Hvor tykk overdekningen er"], "forkl": "Klasse 1–3 styrer hvor mye som kontrolleres. Klasse 3 brukes for bruer, kaier og konstruksjoner med høy konsekvens."}, {"id": "m21-2", "q": "Hvorfor kan SKB gi høyt trykk på forskalingen?", "rett": "Den kan gi fullt væsketrykk over hele høyden", "feil": ["Den er tyngre enn vanlig betong", "Den inneholder mer stein", "Den må vibreres hardere"], "forkl": "Flytende betong stivner sent og presser som en væske, særlig når den stiger raskt."}, {"id": "m21-3", "q": "Hva gjør du hvis betongen er for stiv ved mottak?", "rett": "Kontakter leverandøren – aldri vann på plassen", "feil": ["Tilsetter litt vann", "Vibrerer ekstra lenge", "Støper i tykkere lag"], "forkl": "Ekstra vann øker v/c-tallet og gir svakere og mer porøs betong."}, {"id": "m21-4", "q": "Hvor langt ned skal vibratoren?", "rett": "Ned i laget under (minst ca. 150 mm)", "feil": ["Bare i øverste halvdel av laget", "Helt ned til bunnen av forskalingen", "Den skal ikke ned i betongen, bare mot forskalingen"], "forkl": "Vibratoren skal minst ca. 150 mm ned i laget under. Da sys lagene sammen, og det blir ingen svak skjøt."}, {"id": "m21-5", "q": "Hva er en kaldstøp?", "rett": "En svak skjøt der forrige lag har stivnet før neste ble lagt på", "feil": ["Betong støpt under 0 °C", "Betong med for lite sement", "En planlagt støpeskjøt med fugebånd"], "forkl": "Du unngår den ved å støpe neste lag i tide og vibrere ned i laget under."}, {"id": "m21-6", "q": "Herdeklasse 3 i NS-EN 13670 betyr at betongen herdes til …", "rett": "50 % av karakteristisk fasthet", "feil": ["3 døgn", "35 % av karakteristisk fasthet", "70 % av karakteristisk fasthet"], "forkl": "Herdeklassene er: 1 = 12 timer, 2 = 35 %, 3 = 50 % og 4 = 70 %."}, {"id": "m21-7", "q": "Hvilken V441-årsak passer for liten overdekning fordi armeringen ble tråkket ned?", "rett": "32 Feilplassert armering", "feil": ["35 Manglende herdetiltak", "53 Karbonatisering", "21 Sammensetning"], "forkl": "Utførelsesfeil har koder i 30-gruppen, og 32 gjelder armering som ligger på feil sted."}, {"id": "m21-8", "q": "Når regnes ung betong som frostsikker for én frysing?", "rett": "Ved ca. 5 MPa, beskyttet mot regn og snø", "feil": ["Etter 24 timer uansett temperatur", "Når forskalingen er revet", "Ved 50 % av karakteristisk fasthet"], "forkl": "Den regnes også som frostsikker når den har holdt minst +10 °C i 3 døgn."}, {"id": "m21-9", "q": "Hva må gjøres før en flate som er herdet med Mapecure 1, males eller får påstøp?", "rett": "Membranen må fjernes helt", "feil": ["Ingenting, den forsvinner av seg selv", "Flaten må vannes i ett døgn", "Flaten må primes med Mapecure 1 på nytt"], "forkl": "Voksfilmen svekker heften til maling og mørtel, så membranen må bort først."}], "22": [{"id": "m22-1", "q": "Hva betyr M45?", "rett": "Bestandighetsklasse, masseforhold høyst 0,45", "feil": ["Fasthetsklasse, trykkfasthet minst 45 MPa", "Tilslagskrav, største stein D maks 45 mm", "Konsistensklasse, synkmål omtrent 45 mm"], "forkl": "Bestandighetsklassen setter et tak på masseforholdet. M45 betyr høyst 0,45."}, {"id": "m22-2", "q": "Proporsjoneringen gir v/c 0,50 for fastheten, men M45 er krevd. Hvilket v/c-tall gjelder?", "rett": "0,45", "feil": ["0,50", "0,475", "Det velger leverandøren fritt"], "forkl": "Det laveste tallet styrer, ikke de 0,50 som fastheten ga."}, {"id": "m22-3", "q": "Betongen skal ha v/c 0,40 og 170 kg vann per m³. Hvor mye sement trengs?", "rett": "425 kg/m³", "feil": ["68 kg/m³", "340 kg/m³", "400 kg/m³"], "forkl": "Sement = vann / v/c = 170 / 0,40."}, {"id": "m22-4", "q": "Hva er karakteristisk fasthet?", "rett": "Verdien som bare 5 % av resultatene ligger under", "feil": ["Middelverdien av alle resultater", "Den laveste målte verdien", "Fastheten etter 7 døgn"], "forkl": "Den er 5 %-fraktilen: fck = fcm − 1,64σ."}, {"id": "m22-5", "q": "Kriteriet for middelfasthet ved kontinuerlig produksjon er …", "rett": "fcm ≥ fck + 1,48σ", "feil": ["fcm ≥ fck + 4 MPa", "fcm ≥ fck", "fcm ≥ fck + 1,64σ + 4 MPa"], "forkl": "fck + 4 MPa gjelder ved oppstart, når man har 3 resultater."}, {"id": "m22-6", "q": "Synkmålet øker plutselig fra lass til lass. Hva er mest sannsynlig?", "rett": "For mye vann eller feil dosering av stoff", "feil": ["Kaldere vær og lavere betongtemperatur", "Bedre vibrering av det forrige lasset", "Lavere luftinnhold enn i lasset før"], "forkl": "Det gir lavere fasthet og bestandighet. Stopp og avklar med leverandøren."}, {"id": "m22-7", "q": "Hvilken prøving sjekker luft i frostbestandig betong?", "rett": "Trykkmetoden, NS-EN 12350-7", "feil": ["Synkmål", "Terningtrykkprøve", "Kloridmigrasjon"], "forkl": "For lite luft gir dårlig frostbestandighet, og for mye luft gir lavere fasthet."}, {"id": "m22-8", "q": "Hvorfor lønner lav spredning (σ) seg for produsenten?", "rett": "Samme klasse kan lages med mindre sement", "feil": ["Betongen blir automatisk frostbestandig", "Synkmålet blir høyere", "Den kan leveres uten følgeseddel"], "forkl": "Med lav spredning kan middelfastheten ligge nærmere fck, og da trengs mindre sement."}, {"id": "m22-9", "q": "Hvilken klasse etter NS-EN 1504-3 har DS og Mapegrout T60?", "rett": "R4", "feil": ["R2", "R3", "C1"], "forkl": "R4 er den høyeste klassen for konstruktive reparasjonsmørtler, med de strengeste kravene."}], "23": [{"id": "m23-1", "q": "Hvilken metode egner seg best for lange transportavstander og små felt?", "rett": "Tørrsprøyting", "feil": ["Våtsprøyting med robot", "Utstøping bak forskaling", "Injeksjon"], "forkl": "Materialet kan transporteres langt. EFNARC oppgir ca. 500 m vannrett og 100 m loddrett."}, {"id": "m23-2", "q": "Hvorfor skrås kantene på et reparasjonsfelt før sprøyting?", "rett": "Rette hjørner fanger prelltap", "feil": ["For å spare materiale", "For å få bedre overdekning", "Det kreves bare ved håndpåføring"], "forkl": "Prellen samles i hjørnene og blir porøse lommer. Skrå kanter (ca. 45°) gir god oppbygging."}, {"id": "m23-3", "q": "Hvilken sprøyteavstand anbefaler EFNARC ved reparasjon?", "rett": "0,5–1,0 m", "feil": ["0,1–0,3 m", "1,5–2,0 m", "2–3 m"], "forkl": "For nær vasker strålen bort materialet. For langt unna blir støtet for svakt."}, {"id": "m23-4", "q": "Hvordan skal dysen holdes?", "rett": "Vinkelrett på flaten", "feil": ["45° mot flaten", "Parallelt med flaten", "Det spiller ingen rolle"], "forkl": "Materialet spretter av i samme vinkel som det treffer, så vinkelrett gir minst prell."}, {"id": "m23-5", "q": "Hva er største lagtykkelse i tak uten akselerator?", "rett": "Ca. 30 mm", "feil": ["Ca. 10 mm", "Ca. 50 mm", "Ca. 100 mm"], "forkl": "På vegg er grensen ca. 50 mm. I tak bygges første lag opp til 10 mm forbi armeringen."}, {"id": "m23-6", "q": "Hvorfor ikke stålfiber bak armeringen?", "rett": "Fibrene hindrer at stengene blir omsluttet", "feil": ["Fiber ruster med en gang", "Fiber gir for høy fasthet", "Fiber kan ikke pumpes"], "forkl": "Utenfor armeringen kan stålfiber brukes."}, {"id": "m23-7", "q": "Hva er en skygge i sprøytebetong?", "rett": "Et hulrom bak en armeringsstang", "feil": ["En misfarging i overflaten", "Et område med for tykt lag", "Prelltap på gulvet"], "forkl": "Det er den alvorligste feilen. Du unngår den med åpning bak stålet, riktig vinkling og blåserør."}, {"id": "m23-8", "q": "Hvordan måles prelltap etter EFNARC?", "rett": "Samles på plast og veies, i % av sprøytet masse", "feil": ["Beregnes ut fra målt lagtykkelse og areal", "Anslås visuelt av dyseføreren etter hvert lag", "Måles som vekttap på kjerner fra prøveplate"], "forkl": "Det sprøytes minst 0,75 m³, 40–60 mm tykt fordelt på to lag."}, {"id": "m23-9", "q": "Hvilken mørtel dekker anodenett ved katodisk beskyttelse?", "rett": "DS-CP", "feil": ["DS-SR", "Monofinish", "Mapepoxy L"], "forkl": "DS-CP (R3) er laget for katodisk beskyttelse og kan legges ca. 40 mm per lag."}]};
const GK = [{"nr": "G1", "tittel": "Hva er betongrehabilitering?", "mal": ["Forklare hva rehabilitering er, og hvorfor det er mer enn å «lappe hull»", "Kjenne de fem stegene fra skade til ferdig jobb", "Vite hvorfor prøvefelt og dokumentasjon er viktig"], "punkter": ["Skaden du ser, er bare symptomet. Årsaken må stoppes.", "Rehabilitering har fem steg: tilstandsanalyse, strategi, prosjektering, utførelse og bruksfase.", "Tilstandsanalysen finner årsak, omfang og konsekvens.", "Et prøvefelt tester metode og produkter før hele jobben starter.", "I NS-EN 1504 gir del 9 prinsippene, og del 10 gir utførelse og kontroll."], "kort": [{"id": "g1-1", "q": "Hvorfor holder det ikke å fylle et hull der betongen har falt av?", "a": "Fordi årsaken, oftest rustende armering, fortsetter. Da kommer skaden tilbake."}, {"id": "g1-2", "q": "Hvilke fem steg har en rehabilitering?", "a": "Tilstandsanalyse, strategi, prosjektering, utførelse og bruksfase – i den rekkefølgen."}, {"id": "g1-3", "q": "Hvilke tre ting skal tilstandsanalysen finne?", "a": "Årsak, omfang og konsekvens."}, {"id": "g1-4", "q": "Hva er et prøvefelt?", "a": "Et lite område der du tester metode og produkter under de virkelige forholdene, før hele jobben starter."}, {"id": "g1-5", "q": "Hvilken del av NS-EN 1504 beskriver prinsippene?", "a": "Del 9. Del 10 beskriver utførelse og kontroll."}], "tall": [], "mcq": [{"id": "gm1-1", "q": "Hva er det viktigste prinsippet i betongrehabilitering?", "rett": "Stopp årsaken, ikke bare symptomet", "feil": ["Bruk alltid den sterkeste mørtelen", "Reparer så fort som mulig", "Mal over alle skader"], "forkl": "Skaden du ser, er et symptom. Stopper du ikke årsaken, kommer skaden tilbake."}, {"id": "gm1-2", "q": "Hva er første steg i en rehabilitering?", "rett": "Tilstandsanalyse", "feil": ["Utførelse", "Prosjektering", "Maling"], "forkl": "Først må du finne ut hva som er galt."}, {"id": "gm1-3", "q": "Hva finner tilstandsanalysen?", "rett": "Årsak, omfang og konsekvens", "feil": ["Pris, tid og mannskap", "Farge og tekstur", "Bare hvor mange m² som er skadet"], "forkl": "Årsak, omfang og konsekvens er grunnlaget for å velge strategi."}, {"id": "gm1-4", "q": "Hvorfor lager man prøvefelt?", "rett": "For å teste metode og produkter under virkelige forhold", "feil": ["For å vise byggherren farge og overflate før kontrakt", "For å slippe tilstandsanalyse på små konstruksjoner", "For å finne årsaken til skadene"], "forkl": "Da oppdager du feil tidlig, før de blir dyre."}, {"id": "gm1-5", "q": "Hvilken del av NS-EN 1504 handler om utførelse og kontroll?", "rett": "Del 10", "feil": ["Del 9", "Del 3", "Del 1"], "forkl": "Del 9 gir prinsippene. Del 10 gir utførelse og kontroll."}, {"id": "gm1-6", "q": "Hva må du følge i tillegg til standarden på en offshorejobb?", "rett": "Operatørens egne krav", "feil": ["Det som er vanlig praksis på land", "Det som gir kortest arbeidstid på plattformen", "Det som står i grunnboka og hovedboka"], "forkl": "Operatørens krav kommer i tillegg til regelverket, og de er ofte strengere."}]}, {"nr": "G2", "tittel": "Betong og armering", "mal": ["Forklare hva betong og armering er, og hvorfor de trenger hverandre", "Forklare hvorfor stål ikke ruster i ny betong (passivfilmen)", "Forklare hvorfor overdekningen er så viktig"], "punkter": ["Betongen tåler trykk, og armeringen tar strekk.", "Porevannet har pH 13–14. Det gir stålet en passivfilm som hindrer rust.", "Passivfilmen brytes av karbonatisering eller klorider.", "Overdekningen er stålets skjold. Dobbel overdekning gir omtrent fire ganger så lang tid.", "Først den usynlige initieringsfasen, så propageringsfasen med rust og skader."], "kort": [{"id": "g2-1", "q": "Hvorfor legger man armering i betong?", "a": "Fordi betong tåler lite strekk. Stålet tar strekket, og betongen tar trykket."}, {"id": "g2-2", "q": "Hva er pH i porevannet i ny betong?", "a": "Ca. 13–14, altså sterkt basisk."}, {"id": "g2-3", "q": "Hva er passivfilmen?", "a": "Et tynt, usynlig beskyttelseslag som stålet får i den basiske betongen. Det hindrer rust."}, {"id": "g2-4", "q": "Hva er overdekning, og hvorfor er den viktig?", "a": "Det er betongen mellom overflaten og armeringen. Den holder CO₂ og salt borte fra stålet."}, {"id": "g2-5", "q": "Hva skjer i initieringsfasen?", "a": "CO₂ eller salt vandrer inn mot armeringen, men du ser ingen skader ennå."}], "tall": [], "mcq": [{"id": "gm2-1", "q": "Hva tåler betong dårlig?", "rett": "Strekk", "feil": ["Trykk", "Vekt", "Basisk miljø"], "forkl": "Derfor legger man armering der betongen skal ta strekk."}, {"id": "gm2-2", "q": "Hva er pH i porevannet i ny betong?", "rett": "Ca. 13–14", "feil": ["Ca. 7", "Ca. 3", "Ca. 9"], "forkl": "Det er sterkt basisk og gir stålet en passivfilm."}, {"id": "gm2-3", "q": "Hva beskytter armeringen mot rust i ny betong?", "rett": "Passivfilmen", "feil": ["Malingen på stålet", "Sanden i betongen", "Kulden"], "forkl": "Passivfilmen er et usynlig beskyttelseslag som dannes i basisk miljø."}, {"id": "gm2-4", "q": "Hva er overdekning?", "rett": "Betongen mellom overflaten og armeringen", "feil": ["Malingen eller belegget på overflaten", "Avstanden mellom to armeringsjern", "Tykkelsen på hele veggen eller dekket"], "forkl": "Den er stålets skjold mot CO₂ og salt."}, {"id": "gm2-5", "q": "Dobbel overdekning gir omtrent hvor mange ganger så lang tid før rusten starter?", "rett": "Ca. fire ganger", "feil": ["Ca. dobbelt", "Like lang", "Ca. ti ganger"], "forkl": "Inntrengningen går langsommere og langsommere jo dypere den kommer."}, {"id": "gm2-6", "q": "Hvilke to ting kan bryte passivfilmen?", "rett": "Karbonatisering og klorider", "feil": ["Frost og høy temperatur", "Vibrasjon og tung last", "Maling og tett belegg"], "forkl": "Det er de to store årsakene til at armering ruster."}, {"id": "gm2-7", "q": "I hvilken fase synes ingen skader ennå?", "rett": "Initieringsfasen", "feil": ["Propageringsfasen", "Herdefasen", "Bruksfasen"], "forkl": "CO₂ eller salt er på vei inn, men stålet har ikke begynt å ruste."}]}, {"nr": "G3", "tittel": "Hvorfor armeringen ruster", "mal": ["Forklare karbonatisering og klorider med egne ord", "Forklare hvorfor rust sprenger betongen", "Kjenne de fire delene i en korrosjonscelle"], "punkter": ["CO₂ senker pH og gir jevn rust. Karbonatiseringen går raskest ved ca. 50–70 % RF.", "Klorider bryter filmen lokalt og gir groptæring. Grensen varierer: ofte ca. 0,4 % av sementvekten eller 0,07–0,10 % av betongvekten.", "Vått og tørt, særlig i sprutsonen, gir raskest saltinntrengning.", "Korrosjonscellen trenger anode, katode, elektrisk forbindelse og elektrolytt – pluss oksygen.", "Rust tar mer plass enn stål. Det gir riss, så bom og avskalling.", "Ringanodeeffekten betyr ny rust rundt en lapp i saltholdig betong."], "kort": [{"id": "g3-1", "q": "Hva skjer med pH når betongen karbonatiserer?", "a": "Den synker fra ca. 13 til under ca. 9. Da forsvinner passivfilmen."}, {"id": "g3-2", "q": "Hvorfor er kloridrust farligere enn karbonatiseringsrust?", "a": "Fordi den gir dype groper på små steder. Stålet kan miste mye tverrsnitt uten at du ser store tegn utenpå."}, {"id": "g3-3", "q": "Hvilke fire ting trengs i en korrosjonscelle?", "a": "Anode, katode, elektrisk forbindelse (stålet) og elektrolytt (fuktig betong). I tillegg trengs oksygen."}, {"id": "g3-4", "q": "Hvorfor sprekker betongen når armeringen ruster?", "a": "Fordi rusten tar mye større plass enn stålet. Den presser betongen fra hverandre."}, {"id": "g3-5", "q": "Hva er ringanodeeffekten?", "a": "Ny rust rundt en reparert lapp i saltholdig betong. Det skjer fordi stålet utenfor lappen blir anode."}], "tall": [], "mcq": [{"id": "gm3-1", "q": "Hva gjør karbonatisering med betongen?", "rett": "Senker pH slik at passivfilmen forsvinner", "feil": ["Tilfører salt som angriper passivfilmen", "Gjør betongen mer basisk", "Øker pH slik at stålet ruster raskere"], "forkl": "CO₂ reagerer med de basiske stoffene, så pH synker."}, {"id": "gm3-2", "q": "Ved hvilken fuktighet går karbonatiseringen raskest?", "rett": "Ca. 50–70 % RF", "feil": ["Helt tørt", "Helt vått", "Den er alltid lik"], "forkl": "Da er porene delvis tørre, så CO₂ slipper inn."}, {"id": "gm3-3", "q": "Hva slags rust gir klorider?", "rett": "Lokal groptæring", "feil": ["Jevn overflaterust", "Ingen rust", "Bare misfarging"], "forkl": "Dype groper kan gjøre at stålet mister mye tverrsnitt."}, {"id": "gm3-4", "q": "Hva er en vanlig grense for kritisk kloridinnhold?", "rett": "Ca. 0,4 % av sementvekt", "feil": ["Ca. 4 % av sementvekt", "Ca. 40 %", "0 % – alt salt er kritisk"], "forkl": "Grensen varierer. Et vanlig anslag er 0,4 % av sementvekten. Norsk praksis bruker også 0,07–0,10 % av betongvekten, så oppgi alltid enheten."}, {"id": "gm3-5", "q": "Hvor trenger salt raskest inn?", "rett": "Der betongen veksler mellom vått og tørt", "feil": ["I betong som alltid står under vann", "I tørre innerom med lite fukt", "I fersk betong de første døgnene"], "forkl": "Tørr betong suger saltvann inn som en svamp når den blir våt."}, {"id": "gm3-6", "q": "Hva må til i tillegg til anode, katode, forbindelse og elektrolytt?", "rett": "Oksygen", "feil": ["Sollys", "Varme over 30 grader", "Maling"], "forkl": "Oksygenet tas opp ved katoden."}, {"id": "gm3-7", "q": "Hvorfor sprenger rust betongen?", "rett": "Rust tar mye større plass enn stålet", "feil": ["Rust er tyngre enn stål", "Rust løser opp sementen", "Rust gjør betongen varmere"], "forkl": "Rusten utvider seg og gir riss og avskalling."}, {"id": "gm3-8", "q": "Hva er ringanodeeffekten?", "rett": "Ny rust rundt en lapp i saltholdig betong", "feil": ["Rust inne i lappen fordi mørtelen er for tett", "Riss i ring rundt en søyle på grunn av frost", "En ring av rust rundt en offeranode av sink"], "forkl": "Stålet utenfor den friske lappen blir anode og ruster."}]}, {"nr": "G4", "tittel": "Sjøvann, frost og andre skader", "mal": ["Kjenne eksponeringssonene på en marin konstruksjon", "Forklare frostskader og AKR med enkle ord", "Kjenne igjen de vanligste skadene du ser i felt"], "punkter": ["Tidevanns- og sprutsonen, med vått og tørt og sjøsprut, er verst.", "Neddykket betong har mye salt, men lite oksygen.", "Frost skader når mer enn ca. 80–90 % av porene er fylt med vann. Luftporer beskytter.", "AKR gir kartmønsterriss. Den kan ikke stoppes, bare bremses ved å holde betongen tørrere. Beviset får du med mikroskop.", "Bom betyr hul lyd, og hul lyd betyr løs betong."], "kort": [{"id": "g4-1", "q": "Hvilken sone er verst på en konstruksjon i sjø?", "a": "Tidevanns- og sprutsonen. Der veksler betongen mellom vått og tørt, med sjøsprut."}, {"id": "g4-2", "q": "Når kan frost skade betongen?", "a": "Når mer enn ca. 80–90 % av porene er fylt med vann."}, {"id": "g4-3", "q": "Hva gjør luftporer?", "a": "De gir isen plass til å utvide seg, så betongen ikke sprekker."}, {"id": "g4-4", "q": "Hvordan ser AKR-riss typisk ut?", "a": "Som et kartmønster."}, {"id": "g4-5", "q": "Hva betyr det når betongen gir hul lyd når du banker på den?", "a": "At betongen har løsnet, selv om den ikke har falt av. Det kalles bom."}], "tall": [], "mcq": [{"id": "gm4-1", "q": "Hvor på en kai er skadene ofte verst?", "rett": "I tidevanns- og sprutsonen", "feil": ["I neddykket sone, helt under vann", "I atmosfærisk sone, høyt over sjøen", "Inne i lagerbygget på kaia"], "forkl": "Vått og tørt, med både salt og oksygen."}, {"id": "gm4-2", "q": "Hvorfor ruster stål ofte langsomt i neddykket betong?", "rett": "Det er lite oksygen", "feil": ["Det er ikke salt der", "Betongen er karbonatisert der", "Betongen er tykkere der"], "forkl": "Uten oksygen går katodereaksjonen sakte, selv med mye salt."}, {"id": "gm4-3", "q": "Hva beskytter betong mot frost?", "rett": "Luftporer", "feil": ["Mer vann i blandingen", "Mørk farge", "Tynnere overdekning"], "forkl": "Små luftbobler gir isen plass til å utvide seg."}, {"id": "gm4-4", "q": "Hvor mye av porene må omtrent være vannfylt før frost gir skade?", "rett": "Over ca. 80–90 %", "feil": ["Over ca. 10 %", "Over ca. 40 %", "Det spiller ingen rolle"], "forkl": "Da er porene kritisk vannmettet."}, {"id": "gm4-5", "q": "Hvilket rissmønster er typisk for AKR?", "rett": "Kartmønster", "feil": ["Rette riss langs armeringen", "Ett horisontalt riss", "Ingen riss"], "forkl": "AKR-gelen sveller i alle retninger."}, {"id": "gm4-6", "q": "Hva bremser AKR best?", "rett": "Å holde betongen tørrere", "feil": ["Å holde den våt", "Å varme den opp", "Å spyle den jevnlig med ferskvann"], "forkl": "Gelen trenger vann for å svelle. AKR kan ikke stoppes, men tørrere betong bremser den."}, {"id": "gm4-7", "q": "Hva betyr «bom»?", "rett": "Betong som har løsnet og gir hul lyd", "feil": ["Betong som har fått kartmønsterriss", "Mørtel som spretter av ved sprøyting", "Hvit utfelling som renner fra et riss"], "forkl": "Du finner bom ved å banke på betongen."}]}, {"nr": "G5", "tittel": "Å finne og beskrive skadene", "mal": ["Kjenne de vanligste målingene i en tilstandskontroll", "Lese en fenolftaleintest riktig", "Bruke skadegrad og konsekvensgrad etter V441 i grove trekk"], "punkter": ["Se, bank etter bom, og mål overdekning, karbonatisering, klorider og potensial.", "Fenolftalein: rødlilla betyr ikke karbonatisert, fargeløs betyr karbonatisert. Bruk en fersk bruddflate.", "Potensialkartlegging viser sannsynlighet, ikke hastighet.", "V441: type (hva), årsak (hvorfor), skadegrad 1–4 (hvor ille) og konsekvens (hva rammes, og hvor mye).", "Ved konsekvensgrad 4 varsler du med en gang."], "kort": [{"id": "g5-1", "q": "Hvilken farge viser fenolftalein på betong som ikke er karbonatisert?", "a": "Rødlilla – betongen er fortsatt basisk."}, {"id": "g5-2", "q": "Hvorfor skal fenolftalein ikke sprayes på en saget flate?", "a": "Fordi sagestøvet smører basisk materiale utover flaten. Da blir avlesningen feil."}, {"id": "g5-3", "q": "Hva viser potensialkartlegging?", "a": "Hvor det er sannsynlig at stålet ruster, men ikke hvor fort det går."}, {"id": "g5-4", "q": "Hva er forskjellen på skadegrad og konsekvensgrad?", "a": "Skadegraden sier hvor ille selve skaden er. Konsekvensgraden sier hvor mye det betyr for bæreevne, sikkerhet, kostnader eller miljø."}, {"id": "g5-5", "q": "Hva skal skje ved konsekvensgrad 4?", "a": "Da skal forvalteren eller oppdragsgiveren varsles med en gang."}], "tall": [], "mcq": [{"id": "gm5-1", "q": "Hva betyr fargeløs fenolftalein på en bruddflate?", "rett": "Betongen er karbonatisert", "feil": ["Betongen er frisk", "Det er salt i betongen", "Armeringen mangler"], "forkl": "Rødlilla betyr basisk betong. Fargeløs betyr karbonatisert."}, {"id": "gm5-2", "q": "Hvor skal fenolftalein sprayes?", "rett": "På en fersk bruddflate", "feil": ["På en saget flate", "På en blåst flate", "På armeringen"], "forkl": "Sagestøv på en saget flate gir feil svar."}, {"id": "gm5-3", "q": "Hva viser en kloridprofil?", "rett": "Hvor mye salt det er i ulike dybder", "feil": ["Hvor sterk betongen er i ulike dybder", "Hvor dypt karbonatiseringen har gått", "Hvor mye armering det er i tverrsnittet"], "forkl": "Profilen viser om saltet har nådd armeringen."}, {"id": "gm5-4", "q": "Hva forteller potensialkartlegging?", "rett": "Hvor det er sannsynlig at stålet ruster", "feil": ["Nøyaktig hvor fort stålet ruster", "Kloridinnholdet ved armeringen", "Hvor dypt karbonatiseringen er"], "forkl": "Ikke hvor fort. Bekreft alltid ved å åpne."}, {"id": "gm5-5", "q": "Hva betyr skadegrad 4?", "rett": "Svært stor skade", "feil": ["Liten skade", "Middels skade", "Ingen skade"], "forkl": "Grad 1 er liten, 2 middels, 3 stor og 4 svært stor."}, {"id": "gm5-6", "q": "Hvilken konsekvenstype står B for?", "rett": "Bæreevne", "feil": ["Betong", "Bom", "Belegg"], "forkl": "B er bæreevne, T trafikksikkerhet, V vedlikeholdskostnader og M miljø."}, {"id": "gm5-7", "q": "Hvilken skadetype har kode 36?", "rett": "Armeringskorrosjon", "feil": ["Avskalling", "Riss eller sprekk", "Lekkasje"], "forkl": "Kode 35 er avskalling, og 36 er armeringskorrosjon."}, {"id": "gm5-8", "q": "Kan en middels skade ha stor konsekvens?", "re
